[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autoagent-core"
version = "0.20.1"
description = "LLM agent library with tool use, dynamic tool generation, and software evolution capabilities"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = [
    "llm", "agent", "llm-agent", "ai-agent", "agentic", "multi-agent",
    "tool-use", "function-calling", "mcp", "model-context-protocol",
    "openai", "anthropic", "claude", "gemini", "deepseek",
    "sandbox", "observability", "opentelemetry", "guardrails",
    "prompt-injection", "streaming",
]
classifiers = [
    # Alpha assumé, et pas par modestie : la 0.18.0 comme la 0.20.0 ont
    # embarqué un changement de comportement. Tant que ça arrive, annoncer
    # « Beta » raconterait une stabilité d'API qui n'existe pas encore.
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    # Testée en CI sur ubuntu ET windows (cf. .github/workflows/tests.yml) —
    # on ne déclare que ce qui tourne vraiment.
    "Programming Language :: Python :: 3.13",
    # Les `Topic::` sont les facettes que les gens CLIQUENT dans la recherche
    # PyPI ; sans eux le paquet n'apparaît dans aucun filtre.
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "jsonschema>=4.0",
]

[project.urls]
Homepage = "https://github.com/laazizi/autoagent"
Repository = "https://github.com/laazizi/autoagent"
Changelog = "https://github.com/laazizi/autoagent/blob/main/CHANGELOG.md"
Documentation = "https://github.com/laazizi/autoagent/blob/main/autoagent-dev-doc.md"
Examples = "https://github.com/laazizi/autoagent/tree/main/examples_autoagent"
"Visual builder" = "https://laazizi.github.io/autoagent/"
Issues = "https://github.com/laazizi/autoagent/issues"

[project.optional-dependencies]
otel = [
    "opentelemetry-api>=1.20",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "pytest-timeout>=2.1",
    "hypothesis>=6.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
]

[tool.setuptools.packages.find]
include = ["autoagent*"]

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.ruff.lint]
select = [
    "E",   "F",   # pyflakes + pycodestyle
    "W",           # pycodestyle warnings
    "B",           # flake8-bugbear
    "C4",          # flake8-comprehensions
    "I",           # isort
    "SIM",         # flake8-simplify
    "RUF",         # ruff-specific rules
]
ignore = [
    "E501",        # line too long (handled by formatter)
    "B008",        # do not perform function calls in argument defaults
    "SIM105",      # suppressible-exception (use contextlib.suppress)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S301", "S311"]  # allow assert, pickle, random in tests

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra -q --tb=short"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.10"
strict = false
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = false
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = ["tests/", ".autoagent/"]
