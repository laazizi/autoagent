gne ait changé. Et ça se\nmesure FOURNISSEUR PAR FOURNISSEUR : la même démo sur DeepSeek a rapporté un\nzéro MESURÉ au 1ᵉʳ appel puis 100 % (7 552 / 7 571) aux suivants — déterministe\nen pratique. Anthropic est seulement le seul à exiger un marqueur explicite\n(voir la fin de cette démo). Conséquence pratique : le cache est un bonus qu'on\nCONSTATE, jamais une économie qu'on PROMET dans un devis — sauf à l'avoir\nmesuré chez le fournisseur qu'on facture.\n\n    python examples_autoagent/27_cache_de_prompt.py\n\"\"\"\n\nfrom __future__ import annotations\n\nfrom _common import make_provider\n\nfrom autoagent import Agent\n\n# ── Le préfixe stable : c'est LUI qu'on veut voir passer en cache ────────────\n# Répété pour dépasser le seuil minimal de mise en cache des fournisseurs.\nSYSTEME = (\n    \"Tu es un assistant d'analyse de données de mobilité pour un institut \"\n    \"d'études spécialisé dans les comptages routiers et les enquêtes \"\n    \"déplacements. Tu réponds de façon concise et factuelle, et tu ne \"\n    \"fabriques jamais un chiffre que tu n'as pas lu. \"\n) * 120\n\nQUESTION = \"Réponds simplement : OK\"\nRUNS = 3\n\n\ndef _ligne(n: int, usage) -> tuple[int, int | None]:\n    \"\"\"Affiche un run et rend (entrée, part servie par le cache).\"\"\"\n    if usage is None:\n        print(f\"  run {n} : le fournisseur n'a rapporté aucun usage\")\n        return 0, None\n\n    taux = usage.cache_hit_ratio\n    if taux is None:\n        # Distinction essentielle : « rien rapporté » n'est pas « zéro mesuré ».\n        lu = \"inconnu\" if usage.cached_tokens is None else f\"{usage.cached_tokens}\"\n        affichage = \"— (le cache s'écrit)\" if usage.cached_tokens is None else \"0 %\"\n    else:\n        lu = str(usage.cached_tokens)\n        affichage = f\"{taux:.0%}\"\n\n    print(f\"  run {n} : entrée {usage.input_tokens:>6} · sortie \"\n          f\"{usage.output_tokens:>4} · servi par le cache {lu:>7} · {affichage}\")\n    return usage.input_tokens or 0, usage.cached_tokens\n\n\ndef main() -> None:\n    provider = make_provider()\n    modele = provider.config.model\n    print(f\"Modèle : {provider.config.provider} / {modele}\")\n    print(f\"Préfixe stable : ~{len(SYSTEME) // 4} jetons estimés\\n\")\n    print(\"─\" * 74)\n\n    entrees: list[int] = []\n    caches: list[int | None] = []\n    for n in range(1, RUNS + 1):\n        # Un agent NEUF à chaque fois : on ne teste pas la mémoire d'un objet,\n        # on teste le cache du fournisseur, de l'autre côté du réseau.\n        agent = Agent(provider, system_prompt=SYSTEME, max_steps=2)\n        entree, cache = _ligne(n, agent.run(QUESTION).usage)\n        entrees.append(entree)\n        caches.append(cache)\n\n    print(\"─\" * 74)\n    print(\"CE QU'IL FAUT RETENIR\\n\")\n\n    if len(set(entrees)) == 1 and entrees[0]:\n        print(f\"  L'entrée est restée à {entrees[0]} jetons aux {RUNS} runs.\")\n        print(\"  Le cache est un SOUS-ENSEMBLE de l'entrée, pas un ajout : on ne\")\n        print(\"  facture jamais deux fois les mêmes jetons.\")\n    else:\n        print(f\"  Entrées observées : {entrees} — elles devraient être identiques ;\")\n        print(\"  si elles varient, c'est que le préfixe n'est pas stable.\")\n\n    servis = [c for c in caches if c]\n    if servis:\n        print(f\"\\n  À partir du 2ᵉ run, {servis[-1]} jetons sur {entrees[-1]} sont\")\n        print(\"  servis depuis le cache — à chaque tour, pas une seule fois. Sur un\")\n        print(\"  agent qui fait huit étapes, ce sont huit fois ces jetons-là qui\")\n        print(\"  changent de tarif. En euros, l'écart dépend du prix du jeton caché\")\n        print(\"  chez ton fournisseur : la démo 22 fait ce calcul-là.\")\n    else:\n        print(\"\\n  Aucune part servie par le cache sur ces runs — et c'est un\")\n        print(\"  résultat NORMAL, pas une panne. Le cache implicite est décidé par\")\n        print(\"  le fournisseur : le même préfixe mord à un moment et plus à un\")\n        print(\"  autre (mesuré sur ce dépôt, cf. l'en-tête de la démo 22). Relance\")\n        print(\"  la démo : tu n'obtiendras pas forcément le même résultat.\")\n        print(\"  Les causes que TU contrôles, s'il ne mord jamais : préfixe trop\")\n        print(\"  court pour le seuil, ou pas strictement identique d'un appel à\")\n        print(\"  l'autre (une date, un identifiant… suffisent à le casser).\")\n\n    print(\"\\n  Rien n'a été demandé dans la requête : Gemini, OpenAI et les\")\n    print(\"  endpoints compatibles (DeepSeek…) mettent le préfixe stable en cache\")\n    print(\"  TOUT SEULS. Le seul travail de la lib est de le RAPPORTER — sans\")\n    print(\"  quoi l'économie serait invisible.\")\n    print()\n    print(\"  Anthropic est le seul à exiger un marqueur explicite. On l'active\")\n    print(\"  ainsi, et c'est la seule ligne à changer :\")\n    print()\n    print('      ModelConfig(provider=\"anthropic\", model=\"claude-sonnet-4-5\",')\n    print(\"                  cache_prompt=True)\")\n    print()\n    print(\"  Il est éteint par défaut, et c'est voulu : chez Anthropic, ÉCRIRE\")\n    print(\"  dans le cache coûte plus cher qu'une entrée normale. Sur un préfixe\")\n    print(\"  court, ou utilisé une seule fois, l'activer fait perdre de l'argent.\")\n\n    # La garantie qu'on ne double compte pas, vérifiée et pas seulement affirmée.\n    for entree, cache in zip(entrees, caches, strict=False):\n        if cache is not None and entree:\n            assert cache <= entree, \"la part cachée dépasse l'entrée — ce serait un bug\"\n\n\nif __name__ == \"__main__\":\n    main()\n"},
  {id: "28", file: "28_elagage_contexte.py", label: "28 · Élaguer les vieux résultats d'outils", note: "Quatre journaux lus l'un après l'autre. Seul prune_tool_results_after change : 16 357 → 7 567 jetons d'entrée (−54 %), même réponse. Troisième run prune_batch=3 : ruptures de préfixe 3 → 1, mais 12 028 jetons — le lot RETARDE l'élagage. Rentable seulement sur un run long avec un cache déterministe.", code: "\"\"\"28 — Élaguer les vieux résultats d'outils : la même tâche, deux fois moins de contexte.\n\nLa démo 26 borne la LARGEUR d'un résultat d'outil (`max_tool_result_chars`) :\nce qui entre une fois dans le transcript. Elle ne dit rien de sa DURÉE.\n\nOr un agent n'a pas de mémoire côté fournisseur : à chaque étape, TOUT le\ntranscript repart. Le résultat de 3 000 caractères lu à l'étape 1 est donc\nrenvoyé à l'étape 2, puis 3, puis 4 — alors que le modèle en a déjà tiré ce\nqu'il voulait. Et il n'est jamais dans le préfixe mis en cache (démo 27),\npuisque l'historique change à chaque tour. C'est du plein tarif, à chaque fois.\n\n    Agent(prune_tool_results_after=1)\n\nAu-delà des N plus récents, un résultat d'outil garde son rôle et son\n`tool_call_id` — la conversation reste bien formée — mais perd sa charge, dans\nla VUE envoyée au fournisseur uniquement. Le transcript rendu à l'hôte, la\ntrace et les snapshots gardent tout : on économise des jetons, pas des preuves.\n\nTrois points que la démo rend visibles :\n\n  1. LE MARQUEUR DIT QUE LE RÉSULTAT ÉTAIT VALIDE. « Supprimé » tout court fait\n     replanifier un modèle autour d'un échec qui n'a pas eu lieu. Il nomme\n     l'outil et la taille, et invite à rappeler l'outil si besoin.\n  2. LA TEINTE SURVIT. Un résultat untrusted élagué reste encadré : sans ça,\n     élaguer « laverait » la teinte et désarmerait la garde trifecta.\n  3. ÇA NE GROSSIT JAMAIS. Un résultat plus court que son propre marqueur est\n     laissé tel quel — une borne qui coûte du contexte n'est pas une borne.\n\n    python examples_autoagent/28_elagage_contexte.py\n\"\"\"\n\nfrom __future__ import annotations\n\nimport itertools\n\nfrom _common import make_provider\n\nfrom autoagent import Agent, TraceEmitter\n\nJOURS = (1, 2, 3, 4)\n\nTACHE = (\n    \"Lis le journal des jours 1, 2, 3 puis 4 — un appel d'outil à la fois. \"\n    \"Réponds ensuite par une seule phrase : le total d'erreurs sur les 4 jours.\"\n)\n\n\ndef journal(jour: int) -> str:\n    \"\"\"Un journal réaliste : beaucoup de lignes, une seule qui compte.\"\"\"\n    lignes = [\n        f\"2026-08-{jour:02d} 0{h}:{m:02d}:00 INFO  capteur={c} trames=1240 ok\"\n        for h in range(1, 6) for m in (0, 15, 30, 45) for c in (\"A12\", \"B07\")\n    ]\n    lignes.append(f\"2026-08-{jour:02d} 23:59:00 SUMMARY erreurs={jour * 2}\")\n    return \"\\n\".join(lignes)\n\n\ndef construire(elagage: int | None, trace: TraceEmitter, lot: int = 1) -> Agent:\n    agent = Agent(\n        make_provider(),\n        max_steps=10,\n        trace=trace,\n        prune_tool_results_after=elagage,\n        prune_batch=lot,\n        system_prompt=\"Tu utilises tes outils, un appel à la fois, et tu es bref.\",\n    )\n\n    @agent.tool\n    def lire_journal(jour: int) -> str:\n        \"\"\"Renvoie le journal brut d'une journée.\"\"\"\n        return journal(jour)\n\n    return agent\n\n\ndef mesurer(titre: str, elagage: int | None, lot: int = 1) -> tuple[int, str, int]:\n    economies: list[int] = []\n    elagues_par_etape: list[int] = []       # combien de résultats élagués, à chaque appel LLM\n    appels = [0]\n\n    def on_event(ev) -> None:\n        if ev.type == \"llm_request\":\n            appels[0] += 1\n            elagues_par_etape.append(0)\n        elif ev.type == \"context_pruned\":\n            economies.append(ev.payload[\"chars_saved\"])\n            elagues_par_etape[-1] = ev.payload[\"pruned\"]\n\n    with TraceEmitter(on_event=on_event) as trace:\n        resultat = construire(elagage, trace, lot).run(TACHE)\n\n    # RUPTURES DE PRÉFIXE : une étape où le nombre de résultats élagués a changé\n    # est une étape où la vue a été RÉÉCRITE — le cache du fournisseur ne peut\n    # pas la resservir. Mesure locale, indépendante du fournisseur.\n    ruptures = sum(1 for a, b in itertools.pairwise(elagues_par_etape) if a != b)\n\n    entree = resultat.usage.input_tokens or 0\n    print(f\"\\n  {titre}\")\n    print(f\"    entrée cumulée      : {entree} jetons\")\n    if economies:\n        print(f\"    élagages            : {len(economies)} tours, \"\n              f\"{sum(economies)} caractères retirés de la vue\")\n    print(f\"    ruptures de préfixe : {ruptures} sur {appels[0]} appels LLM\")\n    print(f\"    réponse             : {resultat.output.strip()[:80]}\")\n    return entree, resultat.output.strip(), ruptures\n\n\ndef main() -> None:\n    provider = make_provider()\n    taille = len(journal(1))\n    print(f\"Modèle : {provider.config.provider} / {provider.config.model}\")\n    print(f\"Chaque journal fait {taille} caractères ; l'agent en lit {len(JOURS)}.\")\n    print(\"Un seul paramètre change entre les deux runs.\")\n    print(\"─\" * 76)\n\n    sans, rep_sans, _ = mesurer(\"SANS élagage — chaque journal repart à chaque étape\", None)\n    avec, rep_avec, rupt_1 = mesurer(\"AVEC prune_tool_results_after=1\", 1)\n    lot, rep_lot, rupt_3 = mesurer(\"AVEC prune_tool_results_after=1, prune_batch=3\", 1, 3)\n\n    print(\"\\n\" + \"─\" * 76)\n    print(\"CE QU'IL FAUT RETENIR\\n\")\n    if sans and avec:\n        ecart = sans - avec\n        sens = \"économisés\" if ecart > 0 else \"de PLUS\"\n        print(f\"  Entrée cumulée : {sans} jetons sans élagage, {avec} avec.\")\n        print(f\"  Soit {abs(ecart)} jetons {sens} — {abs(ecart) / sans:.0%} de l'entrée.\")\n        print(\"  L'économie porte sur l'ENTRÉE, la part qu'on repaie à CHAQUE étape :\")\n        print(\"  elle grandit donc avec le nombre d'étapes, pas avec la taille du run.\")\n    print()\n    print(\"  Les deux réponses doivent dire la même chose ; c'est tout l'enjeu :\")\n    print(f\"    sans : {rep_sans[:60]}\")\n    print(f\"    avec : {rep_avec[:60]}\")\n    print()\n    print(\"  Si elles divergent, le seuil est trop agressif pour cette tâche —\")\n    print(\"  monte-le. Ce que le modèle a encore besoin de RELIRE doit rester ;\")\n    print(\"  ce dont il a déjà tiré sa conclusion peut partir. Aucun réglage\")\n    print(\"  universel : ça dépend de la tâche, et ça se mesure comme ici.\")\n    print()\n    print(\"  À noter : le transcript RENDU garde tout. `resultat.messages` porte\")\n    print(\"  les journaux complets, la trace aussi. On élague ce qu'on ENVOIE,\")\n    print(\"  jamais ce qu'on GARDE.\")\n    print()\n    print(\"ET LE CACHE DU FOURNISSEUR ?\\n\")\n    print(\"  Élaguer à CHAQUE étape réécrit la vue à chaque étape : le cache de\")\n    print(\"  préfixe, qui ne sert qu'un préfixe identique à l'octet, repart de zéro.\")\n    print(f\"  Ici : {rupt_1} ruptures avec prune_batch=1, {rupt_3} avec prune_batch=3.\")\n    print()\n    print(\"  MAIS LE LOT A UN PRIX, et la démo le montre plutôt que de le cacher :\")\n    print(f\"  {avec} jetons d'entrée avec prune_batch=1, {lot} avec prune_batch=3,\")\n    print(f\"  soit {lot - avec:+d} jetons. Un lot RETARDE l'élagage : tant que K vieux\")\n    print(\"  résultats ne sont pas réunis, rien ne part — et sur un run de quatre\")\n    print(\"  lectures, ça ne se produit qu'à la fin. Le compromis est donc :\")\n    print(\"  moins de ruptures de cache CONTRE des jetons envoyés en plus.\")\n    print()\n    print(\"  Il n'est rentable que si (1) le run est LONG devant K, pour que les lots\")\n    print(\"  se répètent, et (2) le cache est DÉTERMINISTE — Anthropic. Sur Gemini\")\n    print(\"  il est opportuniste (démo 27) : là, prune_batch=1 est le bon choix.\")\n    print(\"  TokenPilot (arXiv 2606.17016) mesure 5,9 M → 1,6 M jetons hors cache\")\n    print(\"  avec ce principe — sur des sessions longues, avec un cache qui répond.\")\n\n\nif __name__ == \"__main__\":\n    main()\n"},
  {id: "29", file: "29_delegation_parallele.py", label: "29 · Déléguer à plusieurs spécialistes en même temps", note: "Trois spécialistes, les mêmes trois questions. as_tool : l'agent les appelle l'un après l'autre. delegate_to : un seul appel, exécutés ensemble. 14,3 s → 8,8 s (−39 %), 1 appel d'outil au lieu de 3, même travail (1 576 vs 1 462 jetons). L'appel ne rend la main que quand tous ont fini : token_budget reste exact.", code: "\"\"\"29 — Déléguer à plusieurs spécialistes EN MÊME TEMPS.\n\n`as_tool` (démo 08) expose UN spécialiste. Un superviseur qui en consulte trois\nles fait donc passer l'un après l'autre : il attend la SOMME des latences.\n\n    delegate_to({\"comptage\": expert_a, \"juridique\": expert_b, ...})\n\nUn seul outil, plusieurs demandes en un appel, exécutées ensemble. La démo\nmesure les deux formes sur les MÊMES trois questions, avec de vrais appels\nréseau — c'est le seul endroit où la différence est visible.\n\nLE CONTRAT QUI REND ÇA SÛR, et qui est tout l'intérêt : l'appel ne rend la main\nque lorsque TOUS les spécialistes ont fini. Paralléliser, ce n'est pas rendre le\nsystème asynchrone. `token_budget` est vérifié avant chaque appel LLM sur la\ndépense DÉJÀ CONNUE : avec des sous-agents encore en vol, le plafond ne bornerait\nplus que ce qui a atterri, et le chiffre manquant n'existerait pas encore — donc\naucune comptabilité ne pourrait le rattraper. On gagne le temps, on ne perd pas\nla borne. La démo vérifie que la dépense des trois est bien dans `result.usage`.\n\nDeux pièges traités par la lib, et que la démo rappelle :\n\n  * un même spécialiste reçoit ses demandes EN SÉRIE (un `Agent` ne sert qu'un\n    appelant à la fois) ; seuls des spécialistes différents partent ensemble ;\n  * l'ordre des réponses suit l'ordre des DEMANDES, pas l'ordre d'arrivée —\n    sinon le transcript cesse d'être déterministe et le rejeu casse.\n\n    python examples_autoagent/29_delegation_parallele.py\n\"\"\"\n\nfrom __future__ import annotations\n\nimport time\n\nfrom _common import make_provider\n\nfrom autoagent import Agent, delegate_to\n\nQUESTIONS = {\n    \"comptage\": \"En une phrase : à quoi sert un comptage routier directionnel ?\",\n    \"enquete\": \"En une phrase : qu'est-ce qu'une enquête déplacements ménages ?\",\n    \"capteur\": \"En une phrase : quelle différence entre boucle magnétique et radar ?\",\n}\n\n\ndef _specialiste(domaine: str) -> Agent:\n    return Agent(\n        make_provider(),\n        max_steps=2,\n        system_prompt=f\"Tu es un expert {domaine} en mobilité. Tu réponds en UNE phrase.\",\n    )\n\n\ndef _mesurer(titre: str, agent: Agent, tache: str) -> tuple[float, int, str]:\n    debut = time.monotonic()\n    resultat = agent.run(tache)\n    duree = time.monotonic() - debut\n    appels = sum(len(m.tool_calls or []) for m in resultat.messages)\n    jetons = (resultat.usage.total_tokens if resultat.usage else 0) or 0\n    print(f\"\\n  {titre}\")\n    print(f\"    durée         : {duree:5.1f} s\")\n    print(f\"    appels d'outil: {appels}\")\n    print(f\"    jetons du run : {jetons} (spécialistes compris)\")\n    return duree, jetons, resultat.output.strip()\n\n\ndef main() -> None:\n    provider = make_provider()\n    print(f\"Modèle : {provider.config.provider} / {provider.config.model}\")\n    print(\"Trois spécialistes, les mêmes trois questions, deux façons de les poser.\")\n    print(\"─\" * 76)\n\n    tache = (\"Pose à chaque spécialiste la question de son domaine, puis résume \"\n             \"leurs trois réponses en trois lignes.\\n\"\n             + \"\\n\".join(f\"- {d} : {q}\" for d, q in QUESTIONS.items()))\n\n    # ── Forme A : un outil par spécialiste (l'agent les appelle l'un après l'autre)\n    sequentiel = Agent(make_provider(), max_steps=8,\n                       system_prompt=\"Tu interroges tes spécialistes puis tu résumes.\")\n    for domaine in QUESTIONS:\n        sequentiel.add_tool(_specialiste(domaine).as_tool(\n            name=f\"demander_{domaine}\",\n            description=f\"Pose une question au spécialiste {domaine}.\"))\n    duree_a, jetons_a, _ = _mesurer(\"A · un outil par spécialiste (as_tool)\",\n                                    sequentiel, tache)\n\n    # ── Forme B : un seul outil, les demandes partent ensemble\n    parallele = Agent(make_provider(), max_steps=8,\n                      system_prompt=\"Tu interroges tes spécialistes puis tu résumes.\")\n    parallele.add_tool(delegate_to({d: _specialiste(d) for d in QUESTIONS}))\n    duree_b, jetons_b, sortie_b = _mesurer(\"B · un seul outil (delegate_to)\",\n                                           parallele, tache)\n\n    print(\"\\n\" + \"─\" * 76)\n    print(\"CE QU'IL FAUT RETENIR\\n\")\n    if duree_b < duree_a:\n        print(f\"  {duree_a:.1f} s puis {duree_b:.1f} s : \"\n              f\"{(1 - duree_b / duree_a):.0%} de temps en moins.\")\n        print(\"  Le gain vient des latences qui se RECOUVRENT, pas d'un travail\")\n        print(\"  économisé — le nombre de jetons, lui, reste du même ordre :\")\n        print(f\"  {jetons_a} puis {jetons_b}.\")\n    else:\n        print(f\"  Pas de gain ici ({duree_a:.1f} s puis {duree_b:.1f} s).\")\n        print(\"  Cause la plus probable : le modèle n'a pas groupé ses demandes en\")\n        print(\"  UN seul appel — il reste libre de les envoyer une par une. Le gain\")\n        print(\"  dépend donc de son choix, pas seulement de l'outil. Relance :\")\n        print(\"  la démo mesure, elle ne triche pas.\")\n\n    print()\n    print(\"  Et la dépense des spécialistes est DANS le total ci-dessus : elle\")\n    print(\"  compte dans `token_budget`. Un plafond qu'on pourrait contourner en\")\n    print(\"  déléguant ne serait pas un plafond.\")\n    print()\n    print(\"  Ce qui n'est PAS fait ici, volontairement : les spécialistes ne se\")\n    print(\"  parlent pas entre eux, et rien ne survit à un redémarrage. Ça, c'est\")\n    print(\"  un serveur à faire tourner — pas une bibliothèque qu'on lit en entier.\")\n    print()\n    print(f\"  Synthèse du superviseur B :\\n    {sortie_b[:300]}\")\n\n\nif __name__ == \"__main__\":\n    main()\n"},
  {id: "30", file: "30_mode_temoin.py", label: "30 · Le mode témoin (le radar qui photographie)", note: "Un modèle scripté redemande 6 fois le même appel ; borne max_repeated_tool_calls=2. Mode témoin : rien n'est bloqué, l'outil tourne 6 fois, run_end dit « aurait refusé 4 ». Mode normal : 2 exécutions. Sans clé API. Ne PROTÈGE pas ; ne touche jamais à tool_policy.", code: "\"\"\"30 — Le mode témoin : la garde photographie au lieu de verbaliser.\n\nUn radar qui verbalise dès la première seconde, on ne l'installe pas : on ne\nsait pas s'il est bien réglé, et on l'apprend quand les plaintes arrivent.\n\nC'est le problème de toute borne. `max_repeated_tool_calls=2` en production,\nc'est un pari : et si un agent légitime avait vraiment besoin d'appeler trois\nfois ? Résultat courant — on ne l'active jamais, ou on l'active une fois, ça\ncasse, on l'éteint pour toujours.\n\n    Agent(..., max_repeated_tool_calls=2, shadow_guards=True)\n\nLe verdict est calculé et TRACÉ (`loop_guard_would_block`), mais pas appliqué.\nRien ne casse. À la fin, `run_end` porte le compte :\n\n    « cette borne aurait refusé N appels »\n\nUne semaine de trafic réel plus tard, tu lis le rapport, tu regardes les cas, et\ntu actives en SACHANT. Et comme la lib sait rejouer un run à l'identique\n(démo 21), tu peux poser la même question au mois DERNIER — hors ligne, sans\npayer un seul appel.\n\n⚠️ Le mode témoin ne PROTÈGE pas. C'est un mode de mesure, pas un défaut sûr.\nEt il ne touche jamais à `tool_policy` : la politique de l'hôte est la frontière\nde l'hôte, un drapeau de bibliothèque n'a pas à pouvoir l'éteindre.\n\nAucune clé API : le fournisseur est scripté dans le fichier. Forcer une vraie\nboucle avec un vrai modèle serait du théâtre peu fiable — et le sujet ici, c'est\nle rapport de la garde, pas le modèle.\n\n    python examples_autoagent/30_mode_temoin.py\n\"\"\"\n\nfrom __future__ import annotations\n\nimport sys\nfrom pathlib import Path\n\nif __package__ is None:                       # exécution directe\n    sys.path.insert(0, str(Path(__file__).resolve().parent.parent))\n\n# Console Windows en cp1252 : sans ça les filets et les accents plantent la\n# sortie. Les autres démos héritent ce réglage de `_common`, dont celle-ci se\n# passe volontairement (aucune clé, aucun fournisseur réel).\nfor _stream in (sys.stdout, sys.stderr):\n    if hasattr(_stream, \"reconfigure\"):\n        _stream.reconfigure(encoding=\"utf-8\")\n\nfrom autoagent import Agent, TraceEmitter                      # noqa: E402\nfrom autoagent.providers.base import LLMProvider               # noqa: E402\nfrom autoagent.schema import (                                 # noqa: E402\n    LLMResponse,\n    ModelConfig,\n    TokenUsage,\n    ToolCall,\n)\n\nTOURS = 6          # le modèle redemande 6 fois la même chose\nBORNE = 2          # on n'en tolère que 2\n\n\nclass ModeleQuiBoucle(LLMProvider):\n    \"\"\"Un modèle scripté qui redemande TOUJOURS le même appel — le défaut que\n    la garde anti-boucle existe pour attraper.\"\"\"\n\n    def __init__(self) -> None:\n        super().__init__(ModelConfig(provider=\"scripte\", model=\"boucleur\", api_key=\"x\"))\n        self.restants = TOURS\n\n    def complete(self, request):  # type: ignore[no-untyped-def]\n        if self.restants <= 0:\n            return LLMResponse(content=\"j'abandonne\")\n        self.restants -= 1\n        return LLMResponse(\n            tool_calls=[ToolCall(id=f\"c{self.restants}\", name=\"statut_capteur\",\n                                 arguments={\"capteur\": \"cmp-lyo-07\"})],\n            usage=TokenUsage(input_tokens=120, output_tokens=8),\n        )\n\n\ndef essai(temoin: bool) -> tuple[int, int, list[dict]]:\n    \"\"\"Rend (exécutions réelles, refus observés, détail des cas).\"\"\"\n    executions = {\"n\": 0}\n    cas: list[dict] = []\n    bilan: dict = {}\n\n    def on_event(ev) -> None:\n        if ev.type in (\"loop_guard_block\", \"loop_guard_would_block\"):\n            cas.append({\"type\": ev.type, **ev.payload})\n        elif ev.type == \"run_end\":\n            bilan.update(ev.payload)\n\n    with TraceEmitter(on_event=on_event) as trace:\n        agent = Agent(ModeleQuiBoucle(), max_steps=TOURS + 2, trace=trace,\n                      max_repeated_tool_calls=BORNE, shadow_guards=temoin)\n\n        @agent.tool\n        def statut_capteur(capteur: str) -> dict:\n            \"\"\"Interroge un capteur (ici : l'effet de bord qu'on veut compter).\"\"\"\n            executions[\"n\"] += 1\n            return {\"capteur\": capteur, \"etat\": \"ok\"}\n\n        agent.run(\"Donne-moi le statut du capteur cmp-lyo-07.\")\n\n    return executions[\"n\"], bilan.get(\"would_block\", 0), cas\n\n\ndef main() -> None:\n    print(f\"Un modèle qui redemande {TOURS} fois le MÊME appel d'outil.\")\n    print(f\"Borne posée : max_repeated_tool_calls={BORNE}.\")\n    print(\"─\" * 76)\n\n    exe_t, observes, cas_t = essai(temoin=True)\n    print(\"\\n  MODE TÉMOIN — shadow_guards=True (le radar photographie)\")\n    print(f\"    outil réellement exécuté : {exe_t} fois\")\n    print(f\"    refus OBSERVÉS           : {observes}\")\n    print(f\"    événements tracés        : {sorted({c['type'] for c in cas_t})}\")\n\n    exe_n, _, cas_n = essai(temoin=False)\n    print(\"\\n  MODE NORMAL — la borne s'applique (le radar verbalise)\")\n    print(f\"    outil réellement exécuté : {exe_n} fois\")\n    print(f\"    événements tracés        : {sorted({c['type'] for c in cas_n})}\")\n\n    print(\"\\n\" + \"─\" * 76)\n    print(\"LE RAPPORT — ce que tu lirais après une semaine de trafic réel\\n\")\n    print(f\"  La borne max_repeated_tool_calls={BORNE} aurait refusé \"\n          f\"{observes} appels.\")\n    for cas in cas_t:\n        print(f\"    · {cas['name']}(…) — {cas['repeats']}ᵉ fois identique, \"\n              f\"étape {cas['step']}\")\n    print()\n    print(\"  Tu regardes ces cas. Étaient-ce de vraies boucles, ou un agent\")\n    print(\"  légitime qui avait besoin d'insister ? Tu le sais AVANT d'activer,\")\n    print(f\"  et sans avoir rien cassé : l'outil a bien tourné {exe_t} fois.\")\n    print()\n    print(\"  Une fois la borne activée pour de bon, le même scénario s'arrête\")\n    print(f\"  à {exe_n} exécutions au lieu de {exe_t} — c'est le second run ci-dessus.\")\n\n    print(\"\\n\" + \"─\" * 76)\n    print(\"DEUX LIMITES, DITES CLAIREMENT\\n\")\n    print(\"  1. Le mode témoin ne PROTÈGE pas. Pendant l'observation, la boucle\")\n    print(\"     tourne vraiment : elle consomme des jetons et rejoue ses effets\")\n    print(\"     de bord. C'est un mode de mesure, jamais un défaut.\")\n    print()\n    print(\"  2. Il ne touche PAS à `tool_policy`. La politique de l'hôte est la\")\n    print(\"     frontière de l'hôte : un drapeau de bibliothèque n'a pas à pouvoir\")\n    print(\"     éteindre le code que tu as écrit pour dire non. Seules les gardes\")\n    print(\"     INTÉGRÉES (anti-boucle, trifecta) sont observables.\")\n\n\nif __name__ == \"__main__\":\n    main()\n"},
  {id: "31", file: "31_synthese_par_exemple.py", label: "31 · Synthèse par l'exemple : le modèle propose, TES cas décident", note: "Dix lignes de journal capteur avec trois pièges (deux formats de date, niveau parfois absent, espaces variables), 40 % cachées au modèle. Accepté à l'essai 1 : 6/6 montrés + 4/4 cachés, 11,2 s, 2 177 jetons — et juste sur une ligne que ni le modèle ni la boucle n'avaient vue.", code: "\"\"\"31 — Synthèse par l'exemple : le modèle écrit l'outil, TES cas décident.\n\nLa démo 06 fait écrire au modèle l'outil qui lui manque, et le modèle fournit\nses propres auto-tests. Le point faible tient en une phrase : il écrit les tests\nqui le jugent. Ici on inverse qui juge.\n\n    synthesize_tool(builder, \"…ce que l'outil doit faire…\", exemples)\n\nTu apportes des cas de VÉRITÉ (arguments → résultat attendu). Le modèle écrit un\noutil. Le code l'exécute en bac à sable sur tes cas et compare. Un outil qui\nrate est jeté — fichier compris — et le modèle reçoit deux ou trois cas ratés\npour corriger. Un outil qui passe est enregistré.\n\nLE PIÈGE, ET LA PARADE. Un modèle à qui l'on demande de « faire passer ces\ncas » écrit volontiers un outil qui les traite un par un (`if entree == …`) :\n100 % de réussite, 0 % d'utilité. La parade : les exemples sont COUPÉS. Le\nmodèle en voit 60 % ; **les 40 % restants ne lui sont jamais transmis**, même\nquand ils ratent — il apprend seulement COMBIEN ont raté. « Fais passer ces\ncas » devient « trouve la règle ».\n\nLe cas : des lignes de journal capteur à transformer en enregistrement propre.\nLa règle a trois pièges (deux formats de date, un niveau parfois absent, des\nespaces variables) — un modèle qui code les exemples par cœur y tombera.\n\nAucune clé Anthropic requise ; Gemini / OpenAI / DeepSeek via .env.\n\n    python examples_autoagent/31_synthese_par_exemple.py\n\"\"\"\n\nfrom __future__ import annotations\n\nimport time\n\nfrom _common import ROOT, make_provider\n\nfrom autoagent import Example, synthesize_tool\nfrom autoagent.dynamic import DynamicToolBuilder\n\n# ── La vérité : dix lignes réelles et ce qu'on attend de chacune ─────────────\n# Trois formats se mélangent, comme dans un vrai export : ISO avec « T », ISO\n# avec espace, et « JJ/MM/AAAA hh:mm ». Le niveau manque parfois (→ \"INFO\").\nEXEMPLES = [\n    Example({\"ligne\": \"2026-08-19T14:02:11 ERROR cmp-lyo-07 timeout 30s\"},\n            {\"date\": \"2026-08-19\", \"heure\": \"14:02\", \"niveau\": \"ERROR\", \"capteur\": \"cmp-lyo-07\"}),\n    Example({\"ligne\": \"2026-08-19 14:03:40  INFO  cmp-lyo-01  1240 passages\"},\n            {\"date\": \"2026-08-19\", \"heure\": \"14:03\", \"niveau\": \"INFO\", \"capteur\": \"cmp-lyo-01\"}),\n    Example({\"ligne\": \"19/08/2026 14:05 WARN cmp-lyo-12 latence 210ms\"},\n            {\"date\": \"2026-08-19\", \"heure\": \"14:05\", \"niveau\": \"WARN\", \"capteur\": \"cmp-lyo-12\"}),\n    Example({\"ligne\": \"2026-08-20T08:15:00 cmp-gre-03 boot ok\"},\n            {\"date\": \"2026-08-20\", \"heure\": \"08:15\", \"niveau\": \"INFO\", \"capteur\": \"cmp-gre-03\"}),\n    Example({\"ligne\": \"20/08/2026 08:16 ERROR cmp-gre-03 connexion refusee\"},\n            {\"date\": \"2026-08-20\", \"heure\": \"08:16\", \"niveau\": \"ERROR\", \"capteur\": \"cmp-gre-03\"}),\n    Example({\"ligne\": \"2026-08-20 08:17:59 DEBUG cmp-gre-04 trame 0x1F\"},\n            {\"date\": \"2026-08-20\", \"heure\": \"08:17\", \"niveau\": \"DEBUG\", \"capteur\": \"cmp-gre-04\"}),\n    Example({\"ligne\": \"2026-08-21T23:59:59 WARN cmp-nan-09 pile faible\"},\n            {\"date\": \"2026-08-21\", \"heure\": \"23:59\", \"niveau\": \"WARN\", \"capteur\": \"cmp-nan-09\"}),\n    Example({\"ligne\": \"21/08/2026 00:01 cmp-nan-09 reprise\"},\n            {\"date\": \"2026-08-21\", \"heure\": \"00:01\", \"niveau\": \"INFO\", \"capteur\": \"cmp-nan-09\"}),\n    Example({\"ligne\": \"2026-08-22 12:00:00 ERROR cmp-lyo-07 timeout 30s\"},\n            {\"date\": \"2026-08-22\", \"heure\": \"12:00\", \"niveau\": \"ERROR\", \"capteur\": \"cmp-lyo-07\"}),\n    Example({\"ligne\": \"22/08/2026 12:30   INFO   cmp-lyo-02   ok\"},\n            {\"date\": \"2026-08-22\", \"heure\": \"12:30\", \"niveau\": \"INFO\", \"capteur\": \"cmp-lyo-02\"}),\n]\n\n# Une ligne que NI le modèle NI la boucle n'ont vue : le vrai test final.\nJAMAIS_VUE = \"23/08/2026 06:45 cmp-bdx-11 demarrage\"\nATTENDU = {\"date\": \"2026-08-23\", \"heure\": \"06:45\", \"niveau\": \"INFO\", \"capteur\": \"cmp-bdx-11\"}\n\n\ndef main() -> None:\n    provider = make_provider()\n    builder = DynamicToolBuilder(provider, tools_dir=ROOT / \".autoagent\" / \"tools_demo31\",\n                                 timeout=15)\n    print(f\"Modèle : {provider.config.provider} / {provider.config.model}\")\n    print(f\"{len(EXEMPLES)} cas de vérité · 40 % cachés au modèle · 5 essais maximum\")\n    print(\"─\" * 76)\n\n    debut = time.monotonic()\n    res = synthesize_tool(\n        builder,\n        goal=(\"Parse one sensor log line into a record with keys date (YYYY-MM-DD), \"\n              \"heure (HH:MM), niveau (ERROR/WARN/INFO/DEBUG; INFO when absent) and \"\n              \"capteur (the token that starts with 'cmp-'). Dates may be ISO with 'T' \"\n              \"or space, or DD/MM/YYYY.\"),\n        examples=EXEMPLES,\n        tool_name=\"parser_ligne_capteur\",\n        holdout=0.4,\n        max_attempts=5,\n        seed=0,\n    )\n    duree = time.monotonic() - debut\n\n    print(f\"\\n  cas montrés au modèle : {res.shown} · cas cachés : {res.holdout}\\n\")\n    print(\"  essai  montrés  cachés   verdict\")\n    for a in res.attempts:\n        caches = \"—\" if a.holdout_passed is None else f\"{a.holdout_passed}/{a.holdout_total}\"\n        if a.error:\n            verdict = f\"construction ratée : {a.error[:50]}\"\n        elif a.accepted:\n            verdict = \"ACCEPTÉ\"\n        elif a.holdout_passed is None:\n            verdict = \"rate des cas montrés → retour au modèle avec 3 exemples\"\n        else:\n            verdict = \"passe les montrés, rate des cachés → « trop spécifique », sans détail\"\n        print(f\"    {a.index}     {a.shown_passed}/{a.shown_total}     {caches:>5}    {verdict}\")\n\n    print(f\"\\n  {res.summary()}\")\n    print(f\"  durée {duree:.1f} s · coût \"\n          f\"{(res.usage.total_tokens if res.usage else 0) or 0} jetons\")\n\n    print(\"\\n\" + \"─\" * 76)\n    if res.accepted:\n        obtenu = res.tool(ligne=JAMAIS_VUE)\n        ok = obtenu == ATTENDU\n        print(\"LE VRAI TEST — une ligne que personne n'a vue, ni le modèle ni la boucle :\\n\")\n        print(f\"  {JAMAIS_VUE}\")\n        print(f\"  → {obtenu}\")\n        print(f\"  {'✓ juste' if ok else '✗ FAUX — attendu ' + str(ATTENDU)}\")\n        print()\n        print(\"  L'outil est en bac à sable, dans .autoagent/tools_demo31/. Il n'est PAS\")\n        print(\"  promu : ça, c'est ton geste, par le manifeste à empreinte (démo 07).\")\n    else:\n        print(\"REFUSÉ après\", len(res.attempts), \"essais — et c'est un résultat honnête.\")\n        print(\"  Aucun outil non validé n'est resté sur le disque. Relis les essais :\")\n        print(\"  s'il rate toujours les cachés, la règle est peut-être mal décrite ;\")\n        print(\"  s'il rate les montrés, les exemples se contredisent peut-être.\")\n\n    print()\n    print(\"  Ce que la boucle ne fait pas : rendre le modèle plus intelligent. Elle\")\n    print(\"  convertit des essais en justesse — possible seulement parce que la\")\n    print(\"  vérité était déjà connue. Là où tu as les données ET la bonne réponse,\")\n    print(\"  elle est très rentable. Ailleurs, elle n'a pas de juge.\")\n\n\nif __name__ == \"__main__\":\n    main()\n"},
  {id: "32", file: "32_outils_au_fil_du_flux.py", label: "32 · Les outils tournent pendant que le modèle parle", note: "Deux capteurs de 1,2 s demandés dans le même tour, en streaming. Sans idempotent : les outils attendent la fin du message. Avec idempotent=True : lancés dès leur chunk. 6,1 s → 4,3 s (−29 %) sur Gemini ; 5,0 s → 4,0 s sur DeepSeek (fil OpenAI : le dernier appel d'un tour attend la fin du flux). Transcript identique à l'octet.", code: "\"\"\"32 — Exécuter les outils PENDANT que le modèle parle encore.\n\nEn streaming, un appel d'outil est souvent complet bien avant la fin du\nmessage : le modèle a décidé « lire capteur A », puis continue d'émettre\n« lire capteur B », puis du texte. Jusqu'ici la boucle attendait le `final`\npour lancer quoi que ce soit — le temps de génération et le temps d'outil\ns'ADDITIONNAIENT.\n\n    @agent.tool(idempotent=True)\n    def lire_capteur(nom: str) -> dict: ...\n\nAvec `idempotent=True`, la boucle lance l'outil dès que son appel est complet\n(chunk `tool_call`), pendant que le modèle émet la suite. PASTE (arXiv\n2603.18897) mesure -43 % de temps par tâche avec ce recouvrement.\n\nLA RÈGLE QUI REND ÇA SÛR — et elle est du code, pas une consigne :\n\n  * JAMAIS sans `idempotent=True`. Un flux qui casse jette le résultat anticipé ;\n    un outil idempotent n'a rien changé dans le monde. Un outil à effet de bord\n    (envoi, écriture, paiement) ne doit pas porter ce drapeau — la lib ne le\n    devine pas, l'hôte le déclare (papier compagnon arXiv 2606.07846 : « un\n    mauvais résultat spéculatif ne peut pas annuler l'irréversible »).\n  * Les GARDES passent AVANT le lancement, exactement comme sur la voie normale :\n    anti-boucle, trifecta, politique de l'hôte. Un appel refusé n'est pas lancé.\n  * Le chemin normal CONSOMME le résultat, il ne relance pas : un seul appel,\n    et le transcript est identique à l'octet à celui d'un run sans anticipation.\n\nCe que la démo mesure : le même run streamé deux fois, seul `idempotent`\nchange. Les deux outils dorment 1,2 s chacun pour rendre le recouvrement\nvisible. Le gain dépend du modèle : s'il n'émet pas ses deux appels dans le\nMÊME tour, il n'y a rien à recouvrir — la démo le dit alors, elle ne triche pas.\n\n    python examples_autoagent/32_outils_au_fil_du_flux.py\n\"\"\"\n\nfrom __future__ import annotations\n\nimport time\n\nfrom _common import make_provider\n\nfrom autoagent import Agent, TraceEmitter\n\nSOMMEIL = 1.2      # secondes par capteur — un vrai appel réseau lent\nTACHE = (\"Lis les capteurs cmp-lyo-07 et cmp-gre-03 (un appel d'outil par capteur, \"\n         \"les deux dans la même réponse), puis donne leur état en une phrase.\")\n\n\ndef construire(idempotent: bool, trace: TraceEmitter) -> Agent:\n    agent = Agent(make_provider(), max_steps=6, trace=trace,\n                  system_prompt=\"Tu utilises tes outils puis tu réponds en une phrase.\")\n\n    @agent.tool(idempotent=idempotent)\n    def lire_capteur(nom: str) -> dict:\n        \"\"\"Interroge un capteur (lent : 1,2 s) et rend son état.\"\"\"\n        time.sleep(SOMMEIL)\n        return {\"capteur\": nom, \"etat\": \"ok\", \"trames\": 1240}\n\n    return agent\n\n\ndef mesurer(titre: str, idempotent: bool) -> tuple[float, int, int, str]:\n    anticipes = [0]\n    appels_par_tour: list[int] = []\n\n    def on_event(ev) -> None:\n        if ev.type == \"tool_call_early_start\":\n            anticipes[0] += 1\n        elif ev.type == \"llm_response\":\n            appels_par_tour.append(ev.payload.get(\"tool_call_count\", 0))\n\n    debut = time.monotonic()\n    sortie = \"\"\n    with TraceEmitter(on_event=on_event) as trace:\n        for ev in construire(idempotent, trace).run_stream(TACHE):\n            if ev.type == \"done\":\n                sortie = (ev.output or \"\").strip()\n    duree = time.monotonic() - debut\n\n    max_par_tour = max(appels_par_tour or [0])\n    print(f\"\\n  {titre}\")\n    print(f\"    durée totale          : {duree:5.1f} s\")\n    print(f\"    appels dans un même tour : {max_par_tour}\")\n    print(f\"    lancés en avance      : {anticipes[0]}\")\n    print(f\"    réponse               : {sortie[:80]}\")\n    return duree, anticipes[0], max_par_tour, sortie\n\n\ndef main() -> None:\n    provider = make_provider()\n    print(f\"Modèle : {provider.config.provider} / {provider.config.model}\")\n    print(f\"Deux capteurs, {SOMMEIL} s chacun. Même run streamé deux fois ; seul \"\n          f\"`idempotent` change.\")\n    print(\"─\" * 76)\n\n    d_sans, _, _, _ = mesurer(\"SANS idempotent — les outils attendent la fin du message\", False)\n    d_avec, n_avance, par_tour, _ = mesurer(\"AVEC idempotent=True — lancés dès leur chunk\", True)\n\n    print(\"\\n\" + \"─\" * 76)\n    print(\"CE QU'IL FAUT RETENIR\\n\")\n    if n_avance and d_avec < d_sans:\n        print(f\"  {d_sans:.1f} s puis {d_avec:.1f} s : {1 - d_avec / d_sans:.0%} de temps en moins,\")\n        print(f\"  {n_avance} outil(s) lancé(s) pendant que le modèle parlait encore.\")\n        print(\"  Le travail est le même ; c'est l'ATTENTE qui s'est recouverte.\")\n    elif par_tour < 2:\n        print(\"  Pas de gain mesurable ici : le modèle n'a pas émis ses deux appels\")\n        print(\"  dans le même tour, il n'y avait donc rien à recouvrir. Le gain\")\n        print(\"  dépend de SA façon de répondre, pas seulement de l'outil. Relance.\")\n    else:\n        print(f\"  {d_sans:.1f} s puis {d_avec:.1f} s — pas de gain net sur ce run.\")\n        print(\"  Possible quand la génération finit avant l'outil : on ne peut pas\")\n        print(\"  recouvrir plus que la durée de ce qui reste à générer.\")\n    print()\n    print(\"  Le transcript est IDENTIQUE dans les deux cas — mêmes messages, même\")\n    print(\"  ordre, même trace. Seul l'instant de lancement change. Et rien n'est\")\n    print(\"  parti en avance sans le drapeau : un effet de bord ne se spécule pas.\")\n\n\nif __name__ == \"__main__\":\n    main()\n"},
  {id: "33", file: "33_cascade_par_resultat.py", label: "33 · La cascade : le petit modèle d'abord, le gros si TON juge dit non", note: "Quatre tâches vérifiables, gemini-3.5-flash-lite → gemini-3.7-flash, juge en code. Run 1 : 1 escalade sur 4, 369 jetons contre 307 pour le gros seul — la cascade a coûté PLUS (une escalade paie deux paliers). Run 2 : 0 escalade, 279 contre 288. Le taux d'acceptation du petit modèle décide, et il varie : la démo calcule le seuil de prix lite/pro.", code: "\"\"\"33 — La cascade : le petit modèle d'abord, le gros seulement si TON juge dit non.\n\n`RoutingProvider` (démo 03) route AVANT l'appel, sur la forme de la requête.\nLa cascade route APRÈS, sur le résultat : le petit modèle répond, un juge EN\nCODE vérifie, et on ne paie le gros que si le petit a raté.\n\n    cascade([lite, pro], tache, check=juge)\n\nCE QUI DÉCIDE DE MONTER EST DU CODE. Si c'est le petit modèle qui dit « je ne\nsuis pas sûr », on est revenu à une consigne qu'on espère. Ici le juge est un\nprédicat déterministe sur le résultat — le même contrat que `run_k` (démo 04).\n\nLa démo enchaîne quatre tâches vérifiables (la réponse doit être un JSON qui\nrespecte une propriété qu'on peut TESTER : des nombres premiers, une somme, un\ntri…). Pour chacune : cascade lite → pro. On compare la facture totale à celle\nd'un run « tout sur le gros » — et on montre le nombre d'escalades. Les paliers\nratés SE PAIENT : la dépense affichée est celle de tout ce qui a été essayé.\n\nDeux garanties qui ne se voient pas dans les chiffres, mais dans les tests :\nune pause d'approbation (`ApprovalRequired`) remonte au lieu d'être « rattrapée »\npar un modèle plus gros — la cascade ne contourne jamais `tool_policy` ; et un\npalier qui plante est un palier raté, pas une exception qui casse tout.\n\nPaliers : gemini-3.5-flash-lite → gemini-3.7-flash (liste des modèles relevée\nsur l'API). Avec une autre clé, change les deux ModelConfig.\n\n    python examples_autoagent/33_cascade_par_resultat.py\n\"\"\"\n\nfrom __future__ import annotations\n\nimport json\nimport re\n\nfrom _common import load_env\n\nfrom autoagent import Agent, ModelConfig, cascade, create_provider\n\nload_env()\nLITE = ModelConfig(provider=\"gemini\", model=\"gemini-3.5-flash-lite\", timeout=120)\nPRO = ModelConfig(provider=\"gemini\", model=\"gemini-3.7-flash\", timeout=120)\n\nSYSTEME = (\"Réponds UNIQUEMENT par un objet JSON valide, sans texte autour, \"\n           \"avec la clé demandée.\")\n\n\ndef _premier(n: int) -> bool:\n    return n > 1 and all(n % d for d in range(2, int(n ** 0.5) + 1))\n\n\ndef _json(res) -> dict | None:  # type: ignore[no-untyped-def]\n    texte = res.output.strip()\n    m = re.search(r\"\\{.*\\}\", texte, re.S)\n    try:\n        return json.loads(m.group(0)) if m else None\n    except json.JSONDecodeError:\n        return None\n\n\n# (tâche, juge) — chaque juge est du CODE qui vérifie une propriété, pas un avis.\nTACHES = [\n    (\"Donne les cinq premiers nombres premiers strictement supérieurs à 1000, \"\n     \"clé 'premiers' (liste d'entiers croissants).\",\n     lambda r: (d := _json(r)) is not None and d.get(\"premiers\") == [1009, 1013, 1019, 1021, 1031]),\n    (\"Trie ces mots par ordre alphabétique français strict : ['zèbre','écureuil','abeille','Éléphant'], \"\n     \"clé 'tries' (liste).\",\n     lambda r: (d := _json(r)) is not None and isinstance(d.get(\"tries\"), list)\n     and [w.lower().replace(\"é\", \"e\").replace(\"è\", \"e\") for w in d[\"tries\"]]\n     == sorted([\"zebre\", \"ecureuil\", \"abeille\", \"elephant\"])),\n    (\"Combien de secondes dans 3 jours, 7 heures et 15 minutes ? clé 'secondes' (entier).\",\n     lambda r: (d := _json(r)) is not None and d.get(\"secondes\") == 3 * 86400 + 7 * 3600 + 15 * 60),\n    (\"Le mot 'ressasser' est-il un palindrome (lettres seules, sans accent) ? clé 'palindrome' (booléen).\",\n     lambda r: (d := _json(r)) is not None and d.get(\"palindrome\") is True),\n]\n\n\ndef _agent(config: ModelConfig) -> Agent:\n    return Agent(create_provider(config), system_prompt=SYSTEME, max_steps=2)\n\n\ndef main() -> None:\n    print(f\"Paliers : {LITE.model}  →  {PRO.model}\")\n    print(f\"{len(TACHES)} tâches, chacune avec un juge en code.\")\n    print(\"─\" * 76)\n\n    total_cascade = 0\n    total_pro_seul = 0\n    escalades = 0\n    jetons_lite = 0        # ce que la cascade a dépensé sur le palier lite\n    jetons_pro_casc = 0    # … et sur le palier pro (escalades)\n    print(\"\\n  CASCADE (lite d'abord, pro si le juge refuse)\")\n    for i, (tache, juge) in enumerate(TACHES, 1):\n        r = cascade([lambda: _agent(LITE), lambda: _agent(PRO)], tache, check=juge)\n        jetons = (r.usage.total_tokens if r.usage else 0) or 0\n        total_cascade += jetons\n        escalades += r.escalations\n        for a in r.attempts:\n            j = (a.usage.total_tokens if a.usage else 0) or 0\n            if a.model == LITE.model:\n                jetons_lite += j\n            else:\n                jetons_pro_casc += j\n        chemin = \" → \".join(f\"{a.model.replace('gemini-', '')}{'✓' if a.ok else '✗'}\" for a in r.attempts)\n        print(f\"    tâche {i} : {chemin:<38} {jetons:>5} jetons\"\n              + (\"\" if r.accepted else \"   ← AUCUN palier accepté\"))\n\n    print(\"\\n  TOUT SUR LE GROS (référence)\")\n    for i, (tache, juge) in enumerate(TACHES, 1):\n        res = _agent(PRO).run(tache)\n        jetons = (res.usage.total_tokens if res.usage else 0) or 0\n        total_pro_seul += jetons\n        print(f\"    tâche {i} : {'✓' if juge(res) else '✗'} {jetons:>5} jetons\")\n\n    print(\"\\n\" + \"─\" * 76)\n    print(\"CE QU'IL FAUT RETENIR\\n\")\n    print(f\"  Cascade : {total_cascade} jetons ({jetons_lite} sur lite + {jetons_pro_casc} sur pro), \"\n          f\"{escalades} escalade(s) sur {len(TACHES)} tâches.\")\n    print(f\"  Gros seul : {total_pro_seul} jetons.\")\n    if total_cascade and total_pro_seul:\n        ecart = total_cascade / total_pro_seul - 1\n        if ecart > 0:\n            print(f\"\\n  EN JETONS, LA CASCADE A COÛTÉ PLUS : {ecart:+.0%}. C'est normal, et la\")\n            print(\"  démo le dit plutôt que de l'arrondir : une escalade paie DEUX paliers,\")\n            print(\"  et sur des tâches de 60 à 100 jetons l'essai raté ne s'amortit pas.\")\n        else:\n            print(f\"\\n  En jetons, la cascade a coûté {ecart:+.0%}.\")\n        # Seuil : la cascade gagne en EUROS si prix_lite/prix_pro < (pro_seul - pro_casc) / lite\n        economise_pro = total_pro_seul - jetons_pro_casc\n        if jetons_lite > 0 and economise_pro > 0:\n            seuil = economise_pro / jetons_lite\n            print(\"\\n  LE SEUIL QUI DÉCIDE : la cascade gagne en euros si le jeton lite coûte\")\n            print(f\"  moins de {seuil:.0%} du jeton pro. (Elle a évité {economise_pro} jetons de\")\n            print(f\"  pro, contre {jetons_lite} jetons de lite dépensés.) Le rapport de prix\")\n            print(\"  réel est TA donnée — la lib ne présume aucun tarif (démo 22).\")\n        elif economise_pro <= 0:\n            print(\"\\n  Ici la cascade n'a rien évité sur le gros modèle : elle ne peut pas\")\n            print(\"  gagner, quel que soit le tarif. Le taux d'acceptation du palier lite\")\n            print(\"  est ce qui décide — mesure-le sur TES tâches avant de déployer.\")\n    print()\n    print(\"  Le juge est du CODE : un JSON qui respecte une propriété vérifiable. Sans\")\n    print(\"  juge déterministe, il n'y a pas de cascade — il y a un pari. Et les\")\n    print(\"  paliers ratés sont DANS la facture : c'est ce qu'elle a vraiment coûté.\")\n\n\nif __name__ == \"__main__\":\n    main()\n"},
  {id: "34", file: "34_metriques_de_trace.py", label: "34 · L'efficacité lue dans la trace, après coup", note: "summarize_trace sur la trace déjà dans le dépôt, puis sur un modèle scripté qui insiste : 5 appels, 4 redondants (80 %), 3 refusés par la garde anti-boucle, 7 266 caractères élagués, jetons par succès échecs compris. Rien ajouté au run. Sans clé API.", code: "\"\"\"34 — L'efficacité lue dans la trace, après coup — sans rien ajouter au run.\n\nChaque run écrit déjà une trace JSONL (`TraceEmitter`, démo 04). Elle répond à\ndes questions que le taux de réussite ne pose pas :\n\n    Combien d'appels d'outils étaient REDONDANTS (même outil, mêmes arguments,\n    même run) ? Combien REFUSÉS, et par quelle garde ? Combien de jetons par\n    SUCCÈS, échecs compris ? Combien lancés en avance, combien élagués ?\n\n    summarize_trace(\"trace.jsonl\")      # ou une liste d'événements\n\nLe constat de Probe&Prefill (arXiv 2605.09252) — près de la moitié des appels\nd'outils inutiles sur leur banc — n'est mesurable chez nous que comme ça : on\nne lit pas dans le modèle, on lit dans ce qu'il a fait.\n\nAucune clé API : la première partie lit la trace déjà dans le dépôt\n(`trace_demo.jsonl`, écrite par la démo 04) ; la seconde rejoue un modèle\nscripté qui boucle, pour montrer redondance, gardes et élagage dans la même\nlecture.\n\n    python examples_autoagent/34_metriques_de_trace.py\n\"\"\"\n\nfrom __future__ import annotations\n\nimport sys\nfrom pathlib import Path\n\nif __package__ is None:\n    sys.path.insert(0, str(Path(__file__).resolve().parent.parent))\nfor _s in (sys.stdout, sys.stderr):\n    if hasattr(_s, \"reconfigure\"):\n        _s.reconfigure(encoding=\"utf-8\")\n\nfrom autoagent import Agent, TraceEmitter, summarize_trace  # noqa: E402\nfrom autoagent.providers.base import LLMProvider  # noqa: E402\nfrom autoagent.schema import LLMResponse, ModelConfig, TokenUsage, ToolCall  # noqa: E402\n\nICI = Path(__file__).resolve().parent\nTRACE_DEMO = ICI / \"trace_demo.jsonl\"\n\n\nclass ModeleQuiInsiste(LLMProvider):\n    \"\"\"Redemande 5 fois le MÊME appel, puis conclut — le défaut à mesurer.\"\"\"\n\n    def __init__(self) -> None:\n        super().__init__(ModelConfig(provider=\"scripte\", model=\"insistant\", api_key=\"x\"))\n        self.restants = 5\n\n    def complete(self, request):  # type: ignore[no-untyped-def]\n        if self.restants <= 0:\n            return LLMResponse(content=\"fini\", usage=TokenUsage(input_tokens=200, output_tokens=10))\n        self.restants -= 1\n        return LLMResponse(\n            tool_calls=[ToolCall(id=f\"c{self.restants}\", name=\"statut\", arguments={\"capteur\": \"A12\"})],\n            usage=TokenUsage(input_tokens=200, output_tokens=8))\n\n\ndef _afficher(titre: str, m) -> None:  # type: ignore[no-untyped-def]\n    print(f\"\\n  {titre}\")\n    for ligne in m.summary().splitlines():\n        print(f\"    {ligne}\")\n\n\ndef main() -> None:\n    print(\"PARTIE 1 — la trace déjà dans le dépôt (écrite par la démo 04)\")\n    print(\"─\" * 76)\n    m1 = summarize_trace(TRACE_DEMO)\n    _afficher(f\"{TRACE_DEMO.name}\", m1)\n    print(\"\\n  Deux runs, dont un arrêté par le plafond de jetons : il compte dans la\")\n    print(\"  dépense, pas dans les succès. C'est pour ça que « jetons/succès » est\")\n    print(\"  plus grand que le coût du seul run réussi — les échecs se paient aussi.\")\n\n    print(\"\\n\\nPARTIE 2 — un modèle qui insiste, lu à travers sa trace\")\n    print(\"─\" * 76)\n    evenements: list = []\n    with TraceEmitter(on_event=evenements.append) as trace:\n        agent = Agent(ModeleQuiInsiste(), max_steps=8, trace=trace,\n                      max_repeated_tool_calls=2, prune_tool_results_after=1)\n\n        @agent.tool\n        def statut(capteur: str) -> str:\n            \"\"\"Interroge un capteur.\"\"\"\n            return \"ok \" * 400\n\n        agent.run(\"Donne le statut du capteur A12.\")\n    m2 = summarize_trace(evenements)\n    _afficher(\"run avec max_repeated_tool_calls=2 et prune_tool_results_after=1\", m2)\n\n    print(\"\\n  Lecture : 5 appels demandés, 4 REDONDANTS (même outil, mêmes arguments).\")\n    print(\"  La garde anti-boucle en a refusé 3 — les deux premiers ont tourné, le\")\n    print(\"  reste a reçu un refus déterministe. L'élagage a retiré les vieux\")\n    print(\"  résultats de la vue. Tout ça sans avoir ajouté une ligne au run : la\")\n    print(\"  trace le savait déjà, personne ne le lisait.\")\n\n    print(\"\\n\" + \"─\" * 76)\n    print(\"CE QU'IL FAUT RETENIR\\n\")\n    print(\"  Ces métriques ne valent que sur du TRAFIC RÉEL : ici elles mesurent une\")\n    print(\"  démo. Branche `summarize_trace` sur les traces JSONL de production et tu\")\n    print(\"  sauras, sans rien changer aux agents, où partent les jetons :\")\n    print(\"  appels redondants, refus des gardes, coût par succès. Puis tu règles —\")\n    print(\"  et tu remesures. La trace est le compteur ; la lib ne fait que le lire.\")\n\n\nif __name__ == \"__main__\":\n    main()\n"},
];

function loadShowcase(id){
  const s = SHOWCASES.find(x=>x.id===id);
  if(!s) return;
  stack = []; renderPalette();
  $("#stack").innerHTML =
    `<div class="drop-empty"><strong>${escapeHtml(s.label)}</strong>` +
    `${escapeHtml(s.note)}<br><br>Démo complète écrite main — non assemblable en blocs. ` +
    `Le code s'affiche à droite (Copier / Télécharger). ` +
    `À lancer depuis <code>examples_autoagent/</code> (dépend de <code>_common.py</code>). ` +
    `Ajouter un bloc repasse en mode constructeur.</div>`;
  const dgv = $("#diag"); if(dgv) dgv.hidden = true;
  $("#code").innerHTML = highlight(s.code);
  window.__lastCode = s.code; window.__lastName = s.file;
  $("#loc-count").textContent = `${s.code.split("\n").length} lignes — ${s.file}`;
  // _common.py lit .env et prend la première clé trouvée : ne pas
  // imposer GEMINI_API_KEY, qui envoyait vers une erreur de clé absente.
  $("#run-cmd").innerHTML = `<span class="k">clé dans .env</span>&nbsp;&nbsp;python&nbsp;examples_autoagent/${s.file}`;
  montrerSortie(id);        // une démo complète a une sortie, comme un preset
}

/* ══ Agrandir : un panneau à la fois, Échap ou clic sur le fond pour sortir ══ */
let panneauZoome = null;

function basculerZoom(cible, bouton){
  const fond = document.querySelector("#fond-zoom");
  const indice = document.querySelector("#indice-zoom");
  const dejaOuvert = panneauZoome === cible;

  // on referme toujours d'abord : un seul panneau agrandi à la fois
  if(panneauZoome){
    panneauZoome.classList.remove("zoome");
    const b = panneauZoome.querySelector(".agrandir")
           || document.querySelector(`[data-zoom="${panneauZoome.id}"]`);
    if(b){ b.textContent = "⤢"; b.setAttribute("aria-pressed", "false"); }
    panneauZoome = null;
  }
  if(!dejaOuvert && cible){
    cible.classList.add("zoome");
    panneauZoome = cible;
    if(bouton){ bouton.textContent = "⤡"; bouton.setAttribute("aria-pressed", "true"); }
  }
  const ouvert = panneauZoome !== null;
  fond.hidden = !ouvert;
  indice.hidden = !ouvert;
}

function fermerZoom(){ if(panneauZoome) basculerZoom(null, null); }

(function(){
  const paires = [["#zoom-code", ".col[aria-label='Code généré']"],
                  ["#zoom-sortie", "#sortie"]];
  for(const [selBouton, selCible] of paires){
    const b = document.querySelector(selBouton);
    const c = document.querySelector(selCible);
    if(!b || !c) continue;
    b.setAttribute("data-zoom", c.id || "code");
    b.addEventListener("click", ev => { ev.stopPropagation(); basculerZoom(c, b); });
  }
  document.querySelector("#fond-zoom").addEventListener("click", fermerZoom);
  document.addEventListener("keydown", e => { if(e.key === "Escape") fermerZoom(); });
})();

const SORTIE_DATE = "18 ao\u00fbt 2026";
const SORTIE_MODELE = "deepseek-chat";

function montrerSortie(id){
  const box = document.querySelector("#sortie");
  const s = SORTIES[id];
  if(!s){ box.hidden = true; return; }
  box.hidden = false;
  box.classList.toggle("vide", !s.ok);
  // Le code affiché déclare « gemini » (défaut du composeur) alors que la
  // capture a tourné sur deepseek-chat. On le dit, plutôt que de laisser
  // croire à une incohérence — et ça illustre l'argument multi-fournisseur.
  // La nuance dépend de l'entrée : le code GÉNÉRÉ déclare « gemini » (défaut du
  // composeur) alors que la capture a tourné sur deepseek — mais les vitrines,
  // elles, ne codent aucun fournisseur en dur. Dire vrai dans les deux cas.
  const nuance = s.nuance !== undefined ? s.nuance
    : `le code affiche <code>gemini</code> : changer de fournisseur ne change que cette ligne`;
  document.querySelector("#sortie-meta").innerHTML = s.ok
    ? `exécution réelle du ${s.date || SORTIE_DATE} · <b>${s.modele || SORTIE_MODELE}</b>`
      + (nuance ? `<br><span class="nuance">${nuance}</span>` : ``)
    : "non exécuté";
  document.querySelector("#sortie-txt").textContent = s.texte;
}

function cacherSortie(){
  const b = document.querySelector("#sortie");
  if(!b) return;
  if(typeof panneauZoome !== "undefined" && panneauZoome === b) fermerZoom();
  b.hidden = true;
}

function loadPreset(id){
  const p = PRESETS.find(x=>x.id===id);
  if(!p) return;
  uid = 1; stack = p.make(); render();
  montrerSortie(id);          // APRÈS render() : regen() vient de cacher le panneau
}

function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),1600); }

// menu des exemples : panneau scrollable (garantit que les 12 sont accessibles)
(function(){
  const btn = $("#preset-btn"), menu = $("#preset-menu");
  const close = ()=>{ menu.classList.remove("open"); btn.setAttribute("aria-expanded","false"); };
  // Groupés par intention : on cherche « la sécurité » ou « la mémoire », pas un numéro.
  const GROUPES = ["Démarrer","Sécurité & bornes","Mémoire","Multi-agent","Outils qui s'écrivent","Flux & intégration","Observabilité & tests"];
  const parGroupe = new Map(GROUPES.map(g=>[g, []]));
  for(const p of PRESETS){ const g = parGroupe.has(p.grp) ? p.grp : "Flux & intégration"; parGroupe.get(g).push(p); }
  for(const [g, liste] of parGroupe){
    if(!liste.length) continue;
    const sep=document.createElement("div"); sep.className="menu-sep"; sep.textContent=g; menu.appendChild(sep);
    for(const p of liste){
      const b=document.createElement("button"); b.type="button"; b.className="menu-item";
      b.textContent=p.label; b.setAttribute("role","menuitem");
      b.addEventListener("click", ()=>{ loadPreset(p.id); close(); });
      menu.appendChild(b);
    }
  }
  // Vitrines : démos complètes (code seul, non assemblables en blocs)
  if(SHOWCASES.length){
    const sep=document.createElement("div");
    sep.className="menu-sep";
    sep.textContent="Démos complètes (code seul)";
    menu.appendChild(sep);
    for(const s of SHOWCASES){
      const b=document.createElement("button"); b.type="button"; b.className="menu-item";
      b.textContent=s.label; b.setAttribute("role","menuitem");
      b.addEventListener("click", ()=>{ loadShowcase(s.id); close(); });
      menu.appendChild(b);
    }
  }
  btn.addEventListener("click", e=>{
    e.stopPropagation();
    const open = menu.classList.toggle("open");
    btn.setAttribute("aria-expanded", open ? "true" : "false");
  });
  document.addEventListener("click", e=>{ if(!menu.contains(e.target) && e.target!==btn) close(); });
  document.addEventListener("keydown", e=>{ if(e.key==="Escape") close(); });
})();
$("#clear").addEventListener("click", ()=>{ stack=[]; render(); });
$("#copy").addEventListener("click", async ()=>{
  try{ await navigator.clipboard.writeText(window.__lastCode||""); toast("Code copié ✓"); }
  catch{ toast("Copie impossible — sélectionne le texte"); }
});
$("#download").addEventListener("click", ()=>{
  const blob=new Blob([window.__lastCode||""],{type:"text/x-python"});
  const url=URL.createObjectURL(blob); const a=document.createElement("a");
  const fname = window.__lastName || "mon_agent.py";
  a.href=url; a.download=fname; a.click(); URL.revokeObjectURL(url);
  toast(`${fname} téléchargé ✓`);
});

function setTheme(mode){
  document.documentElement.setAttribute("data-theme", mode);
  $("#th-light").setAttribute("aria-pressed", mode==="light");
  $("#th-dark").setAttribute("aria-pressed", mode==="dark");
}
$("#th-light").addEventListener("click", ()=>setTheme("light"));
$("#th-dark").addEventListener("click", ()=>setTheme("dark"));
// thème initial = préférence OS
setTheme(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");

// Format du code : script autonome vs fonction build_agent() à intégrer
function setMode(mode){
  codeMode = mode;
  $("#mode-script").setAttribute("aria-pressed", mode==="script");
  $("#mode-integ").setAttribute("aria-pressed", mode==="integration");
  regen();
}
$("#mode-script").addEventListener("click", ()=>setMode("script"));
$("#mode-integ").addEventListener("click", ()=>setMode("integration"));

// version de la lib couverte, affichée dans l'en-tête
(function(){ const v = $("#lib-ver"); if(v) v.textContent = "pour autoagent " + LIB_VERSION; })();

// retour à la ligne du code : un réglage par navigateur, jamais obligatoire
(function(){
  const b = $("#wrap-code"), pre = $("#code"); if(!b || !pre) return;
  let on = false; try{ on = localStorage.getItem("constructeur.wrap") === "1"; }catch(e){}
  const app = ()=>{ pre.classList.toggle("wrap", on); b.setAttribute("aria-pressed", String(on)); };
  b.addEventListener("click", ()=>{ on = !on; try{ localStorage.setItem("constructeur.wrap", on ? "1" : "0"); }catch(e){} app(); });
  app();
})();

// filtre de la palette
(function(){ const f = $("#filtre"); if(f) f.addEventListener("input", appliquerFiltre); })();

// démarrage : lien profond ?exemple=<id> (preset ou vitrine), sinon le 1er
// exemple — pour montrer un résultat concret tout de suite.
(function(){
  const demande = new URLSearchParams(location.search).get("exemple");
  if(demande && PRESETS.some(p=>p.id===demande)){ loadPreset(demande); return; }
  if(demande && SHOWCASES.some(s=>s.id===demande)){ loadShowcase(demande); return; }
  loadPreset("01");
})();
</script>
