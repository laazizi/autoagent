      L.push(``);
    }
    if(dyn){
      L.push(`${av}.enable_dynamic_tools(builder)   # débloque l'outil « create_python_tool »`);
      L.push(``);
      if(manifest){
        L.push(`# Promotion par manifest : un outil généré ne tourne en NATIF que si le sha256 de sa`);
        L.push(`# source est dans le manifest, approuvé par un humain (python -m autoagent.approval …).`);
        L.push(`# Un octet change → retour au bac à sable jusqu'à ré-approbation (pas de TOCTOU).`);
        const lt = [av, pyStr(dyn.f.dir||".autoagent/tools"), `ToolManifest.load(${pyStr(manifest)})`];
        if(sbVar) lt.push(`sandbox=${sbVar}`);
        L.push(`_promus = load_tools(${lt.join(", ")})`);
        L.push(`print("outils chargés :", _promus)   # [(nom, "native" | "sandbox")]`);
        L.push(``);
      }
    }
    if(evoB){
      const e = evoB.f;
      const ek = [`workspace_root=${pyStr(e.root||".")}`];
      if(String(e.pipeline||"").trim()) ek.push(`pipeline_path=${pyStr(e.pipeline.trim())}`);
      if(String(e.validation||"").trim()) ek.push(`validation_command=${pyStr(e.validation.trim())}`);
      if(e.custom_cmd) ek.push(`allow_custom_validation_command=True`);
      ek.push(`allowed_write_extensions=${setExt(e.exts||".py")}`);
      const caps = String(e.caps||"").split(",").map(s=>s.trim()).filter(Boolean);
      L.push(`# Évolution logicielle : l'agent modifie CE logiciel sous garde — dossier borné,`);
      L.push(`# extensions autorisées, validation en code, rollback de chaque changement. La`);
      L.push(`# commande de validation est fixée par l'hôte : le modèle ne peut pas la remplacer.`);
      L.push(`runtime = EvolutionRuntime(`);
      for(const k of ek) L.push(`    ${k},`);
      L.push(`)`);
      L.push(`enable_software_evolution(${av}, runtime${caps.length ? `, capabilities={${caps.map(pyStr).join(", ")}}` : ``})`);
      L.push(``);
    }
    // outils partagés donnés AUSSI à l'agent principal (ses outils d'audit)
    if(sharedTools.length){
      for(const t of sharedTools) L.push(attache(av, t));
      L.push(``);
    }
    // brancher les sous-agents en outils (SAUF si un pipeline les pilote)
    if(!hasPipeline) for(const s of subs){
      const sv = (s.f.var||"specialiste").trim();
      L.push(`${av}.add_tool(${sv}.as_tool(`);
      L.push(`    name=${pyStr(s.f.tname||"interroger_"+sv)},`);
      L.push(`    description=${pyStr(s.f.desc||"Délègue une sous-tâche.")}))`);
      L.push(``);
    }
    // délégation parallèle : UN outil, plusieurs spécialistes, exécutés ensemble
    if(delegB && agentB){
      const d = delegB.f, specs = parseStages(d.stages);
      L.push(`# Plusieurs spécialistes EN MÊME TEMPS : un seul outil, l'appel ne rend la main`);
      L.push(`# que quand TOUS ont fini — c'est ce qui garde token_budget exact. La dépense de`);
      L.push(`# chaque spécialiste entre dans le plafond du parent ; la teinte remonte.`);
      L.push(`_specialistes = {`);
      for(const [nom, role] of specs)
        L.push(`    ${pyStr(nom)}: Agent.from_model(${pyStr(d.prov)}, ${pyStr(d.model)}, system_prompt=${pyStr(role)}, max_steps=2),`);
      L.push(`}`);
      L.push(`${av}.add_tool(delegate_to(_specialistes, name=${pyStr(d.tname||"delegate")}))`);
      L.push(``);
    }
    // outils propres à l'agent principal (@decorator)
    for(const t of ownTools){
      const flags = flagsOf(t);
      L.push(flags.length ? `@${av}.tool(${flags.join(", ")})` : `@${av}.tool`);
      L.push(`def ${(t.f.fname||"outil").trim()}(${t.f.params||""}) -> ${t.f.ret||"dict"}:`);
      if(t.f.doc) L.push(`    ${pyTriDoc(t.f.doc)}`);
      L.push(indentBody(t.f.body, "    "));
      L.push(``);
    }
    // divulgation progressive des schémas d'outils (0.18)
    if(agentB && agentB.f.tsearch){
      L.push(`# Divulgation progressive : au-delà du seuil, on n'envoie que find_tools`);
      L.push(`# + les schémas déjà révélés. tool_policy/taint voient TOUJOURS tout.`);
      const tsm = num(agentB.f.tsearch_max,5) !== 5 ? `, max_results=${num(agentB.f.tsearch_max,5)}` : ``;
      L.push(`${av}.enable_tool_search(threshold=${num(agentB.f.tsearch_threshold,15)}${tsm})`);
      L.push(``);
    }
    // outils du workspace (écriture + lecture / liste / remplacement / annulation)
    for(const w of wss){
      const wv = (w.f.var||"espace").trim();
      L.push(`@${av}.tool`);
      L.push(`def ${(w.f.tname||"ecrire_rapport").trim()}(chemin: str, contenu: str) -> dict:`);
      L.push(`    """Enregistre un fichier — refusé par le code hors de la zone autorisée."""`);
      L.push(`    return ${wv}.write_file(chemin, contenu, reason="rapport")`);
      L.push(``);
      if(w.f.t_read){
        L.push(`@${av}.tool`);
        L.push(`def lire_${wv}(chemin: str) -> dict:`);
        L.push(`    """Lit un fichier de la zone (lecture bornée)."""`);
        L.push(`    return ${wv}.read_file(chemin)`);
        L.push(``);
      }
      if(w.f.t_list){
        L.push(`@${av}.tool`);
        L.push(`def lister_${wv}(motif: str = "**/*") -> dict:`);
        L.push(`    """Liste les fichiers de la zone."""`);
        L.push(`    return ${wv}.list_files(motif)`);
        L.push(``);
      }
      if(w.f.t_replace){
        L.push(`@${av}.tool`);
        L.push(`def remplacer_${wv}(chemin: str, avant: str, apres: str) -> dict:`);
        L.push(`    """Remplace du texte dans un fichier de la zone."""`);
        L.push(`    return ${wv}.replace_text(chemin, avant, apres)`);
        L.push(``);
      }
      if(w.f.t_rollback){
        L.push(`@${av}.tool`);
        L.push(`def annuler_${wv}() -> dict:`);
        L.push(`    """Annule la dernière écriture dans la zone."""`);
        L.push(`    return ${wv}.rollback_last_change()`);
        L.push(``);
      }
    }
    // serveurs MCP : montés sur l'agent principal, fermés après le run
    for(const m of mcps){
      const mv = (m.f.var||"mcp").trim();
      L.push(`# Serveur MCP (sous-processus stdio) : ses outils deviennent des outils autoagent,`);
      L.push(`# validés par le registre avant chaque appel.`);
      const cwd = String(m.f.cwd||"").trim() ? `, cwd=${pyStr(m.f.cwd.trim())}` : ``;
      L.push(`${mv} = MCPClient(${pyStr(m.f.cmd||"npx -y @modelcontextprotocol/server-filesystem .")}, timeout=${num(m.f.timeout,60)}${cwd})`);
      L.push(`${mv}.start()`);
      const margs = [av];
      if((m.f.prefix||"").trim()) margs.push(`prefix=${pyStr(m.f.prefix.trim())}`);
      const inc = String(m.f.include||"").split(",").map(s=>s.trim()).filter(Boolean);
      if(inc.length) margs.push(`include={${inc.map(pyStr).join(", ")}}`);
      L.push(`${mv}.mount(${margs.join(", ")})`);
      L.push(``);
    }
    // lint au démarrage : un outil egress/untrusted sans garde cohérente se voit AVANT le run
    if(tools.some(x=>x.f.egress||x.f.untrusted)){
      L.push(`for _avertissement in ${av}.audit_trifecta():   # lint : egress sans garde, garde sans egress…`);
      L.push(`    print("⚠", _avertissement)`);
      L.push(``);
    }
    // lancer — omis en mode « fonction à intégrer » (l'hôte pilote l'agent)
    if(integ){
      // rien : build_agent() retournera l'agent (voir l'enveloppe en fin de generate)
    }else if(cascB){
      emitCascade();
    }else if(synthB){
      const s = synthB.f;
      const lignes = String(s.examples||"").split("\n").map(l=>l.trim()).filter(Boolean);
      L.push(`# Synthèse PAR L'EXEMPLE : le modèle écrit l'outil, le bac à sable exécute TES cas.`);
      L.push(`# Les exemples sont COUPÉS : la part cachée n'est jamais transmise au modèle, même`);
      L.push(`# quand elle rate — sinon il code les exemples un par un.`);
      L.push(`builder = DynamicToolBuilder(create_provider(ModelConfig(provider=${pyStr(a?a.prov:"gemini")}, model=${pyStr(a?a.model:"gemini-3.7-flash")})), tools_dir=${pyStr(s.dir||".autoagent/tools")})`);
      L.push(`exemples = [`);
      for(const l of lignes){
        const i = l.indexOf("=>"); if(i<0) continue;
        L.push(`    Example(${l.slice(0,i).trim()}, ${l.slice(i+2).trim()}),`);
      }
      L.push(`]`);
      L.push(`res = synthesize_tool(builder, ${pyLines(s.goal, 0)}, exemples, tool_name=${pyStr(s.var||"outil")},`);
      L.push(`                      holdout=${num(s.holdout,0.4)}, max_attempts=${num(s.attempts,5)}${agentB?`, register_on=${av}`:``})`);
      L.push(`print(res.summary())     # essai accepté, montrés/cachés passés — ou refus honnête`);
      L.push(`for a in res.attempts: print(a)`);
    }else if(fiabB){
      const fb = fiabB.f;
      if(!run) note("warn", "Fiabilité : ajoute « Lancer » pour fournir la consigne à répéter.");
      L.push(`# Fiabilité MESURÉE : k runs de la même consigne, TON juge en code (jamais un LLM juge —`);
      L.push(`# ils plafonnent sous 55 % sur les échecs d'agent). Les échecs se paient aussi.`);
      L.push(`def juge(res) -> bool:`);
      L.push(indentBody(fb.juge || "return bool(res.output.strip())", "    "));
      L.push(``);
      L.push(`rapport = run_k(${av}, ${run ? pyLines(run.f.prompt, 0) : pyStr("…")}, k=${num(fb.k,5)}, check=juge${ctxLit ? `, context=${ctxLit}` : ``})`);
      L.push(`print(rapport.summary())     # pass@1, pass^k observé, p^k estimé, jetons par succès`);
    }else if(run){
      const extra = (timeoutS ? `, cancel_token=_stop` : ``) + (ctxLit ? `, context=${ctxLit}` : ``);
      const ckArg = (ckpt ? `, checkpoint=sauvegarder` : ``) + extra;
      // Échange antérieur : le host possède l'historique, la mémoire le
      // compacte. Sans lui, une démo de mémoire ne retrouve rien.
      let cible = pyLines(run.f.prompt, 0), methode = "run", noms = [];
      const mv = mem ? (mem.f.var || "memoire") : "memoire";
      if(amorce){
        L.push(`# Échange antérieur : c'est l'HÔTE qui possède l'historique ;`);
        L.push(`# la mémoire ne fait que le compacter. Sans lui, rien à retrouver.`);
        // Une ligne vide sépare deux conversations : la mémoire les plie
        // l'une après l'autre. Indispensable pour qu'une contradiction du
        // second appel tombe dans la partie PLIÉE du premier.
        const convs = amorce.split(/\n\s*\n/).map(c => c.trim()).filter(Boolean);
        convs.forEach((conv, i) => {
          const nom = convs.length > 1 ? `APPEL_${i + 1}` : `HISTORIQUE`;
          noms.push(nom);
          L.push(`${nom} = [`);
          for(const ligne of conv.split("\n")){
            const t = ligne.trim();
            if(!t) continue;
            const sep = t.indexOf("|");
            const role = sep < 0 ? "user" : t.slice(0, sep).trim();
            const texte = sep < 0 ? t : t.slice(sep + 1).trim();
            L.push(`    Message(role=${pyStr(role)}, content=${pyStr(texte)}),`);
          }
          L.push(`]`);
        });
        L.push(``);
        if(mem.f.kind === "FactMemory"){
          // La mémoire factuelle se construit TOUR PAR TOUR : on joue d'abord
          // l'échange antérieur pour qu'elle en extraie ses faits. Tout envoyer
          // d'un bloc ferait extraire un seul fait consolidé — et la
          // supersession, qui est l'intérêt, resterait invisible.
          // L'échange antérieur est passé À LA MÉMOIRE, pas à l'agent : c'est
          // `compact()` qui plie les vieux tours et déclenche l'extraction.
          // Une contradiction y devient un `update` — qui PÉRIME l'ancien fait
          // au lieu de l'empiler. Un `run` sur un transcript court ne plie rien.
          L.push(`# L'échange antérieur est donné À LA MÉMOIRE : c'est elle qui`);
          L.push(`# en extrait des faits (pliage des vieux tours au-delà de`);
          L.push(`# max_messages). Une contradiction produit alors un « update »,`);
          L.push(`# qui PÉRIME le fait ancien au lieu de l'empiler à côté.`);
          for(const nom of noms) L.push(`${mv}.compact(${nom})`);
          L.push(``);
          L.push(`# Puis une conversation NEUVE : aucun historique transmis.`);
          L.push(`# Ce que l'agent sait encore vient uniquement de sa mémoire.`);
          methode = "run";
        }else{
          cible = `${noms.join(" + ")} + [Message(role="user", content=${pyLines(run.f.prompt, 0)})]`;
          methode = "run_messages";
        }
      }
      if(imagePath){
        L.push(`# Image jointe, encodée en base64. Avec le routing, sa présence envoie la requête au modèle vision.`);
        L.push(`_img = pathlib.Path(${pyStr(imagePath)})`);
        L.push(`_piece = ImageAttachment(data=base64.b64encode(_img.read_bytes()).decode(),`);
        L.push(`                         mime_type=mimetypes.guess_type(_img.name)[0] or "image/jpeg")`);
        L.push(``);
        const msg = `Message(role="user", content=${pyLines(run.f.prompt, 0)}, attachments=[_piece])`;
        cible = (methode === "run_messages" && noms.length) ? `${noms.join(" + ")} + [${msg}]` : `[${msg}]`;
        methode = "run_messages";
      }
      if(timeoutS){
        L.push(`# Annulation coopérative : l'agent s'arrête ENTRE deux tours, jamais au milieu d'un outil.`);
        L.push(`_stop = threading.Event()`);
        L.push(`threading.Timer(${timeoutS}, _stop.set).start()`);
        L.push(``);
      }
      const debut = L.length;
      const wrapRun = () => {
        if(!polApprove && !trifApprove && !timeoutS && !repriseBorne) return;
        const corps = L.splice(debut);
        L.push(`try:`);
        for(const l of corps) L.push(l==="" ? "" : "    "+l);
        if(polApprove || trifApprove){
          const reprise = `${av}.resume(pause.state${ckpt ? ", checkpoint=sauvegarder" : ""}${extra})`;
          L.push(`except ApprovalRequired as pause:`);
          L.push(`    # La boucle s'est ARRÊTÉE avant tout effet de bord : aucun outil du tour n'a tourné.`);
          L.push(`    print("⏸ approbation requise :", [c.name for c in pause.calls])`);
          L.push(`    ok = input("autoriser ? [o/N] ").strip().lower() == "o"`);
          if(polApprove){
            L.push(`    for c in pause.calls:`);
            L.push(`        _DECISIONS[c.id] = "autorise" if ok else "refuse"`);
          }
          if(trifApprove){
            L.push(`    ${av}.trifecta_guard = "off" if ok else "deny"    # vaut pour la suite de CE run`);
          }
          L.push(`    resultat = ${reprise}   # les appels en attente repassent par la politique`);
          if(trifApprove) L.push(`    ${av}.trifecta_guard = "approve"`);
          if(run.f.stream) L.push(`    print(resultat.output)`);
        }
        if(repriseBorne){
          const budgetPose = (boundsB ? boundsB.f.budget : a.budget) !== "" && (boundsB ? boundsB.f.budget : a.budget) != null;
          const suite = `${ckpt ? ", checkpoint=sauvegarder" : ""}${extra}`;
          if(budgetPose){
            L.push(`except TokenBudgetExceeded as borne:`);
            L.push(`    # La borne a tenu (borne.spent = jetons dépensés). Reprise UNE fois avec le double — la limite reste du code.`);
            L.push(`    ${av}.token_budget = ${av}.token_budget * 2`);
            L.push(`    resultat = ${av}.resume(borne.state${suite})`);
          }
          L.push(`except MaxStepsExceeded as borne:`);
          L.push(`    # Plafond d'étapes atteint. Reprise UNE fois avec le double ; si ça retombe, ça remonte.`);
          L.push(`    ${av}.max_steps = ${av}.max_steps * 2`);
          L.push(`    resultat = ${av}.resume(borne.state${suite})`);
          if(run.f.stream) L.push(`    print(resultat.output)`);
        }
        if(timeoutS){
          L.push(`except AgentCancelled:`);
          L.push(`    print("⏱ délai de ${timeoutS} s écoulé : run annulé entre deux tours")`);
          L.push(`    raise SystemExit(1)`);
        }
      };
      if(run.f.stream){
        L.push(`# Streaming : on consomme les événements au fil de l'eau.`);
        L.push(`for ev in ${av}.${methode === "run_messages" ? "run_messages_stream" : "run_stream"}(${cible}${ckArg}):`);
        L.push(`    if ev.type == "text":`);
        L.push(`        print(ev.text, end="", flush=True)`);
        L.push(`    elif ev.type == "tool_start":`);
        L.push(`        print(f"\\n[outil] {ev.tool_name}\\u2026")`);
        L.push(`    elif ev.type == "done":`);
        L.push(`        print(f"\\n\\n({ev.steps} tours d'agent)")`);
        wrapRun();
      }else{
        if(ckpt && ckpt.f.resume){
          L.push(`# Reprise : si un snapshot existe (run interrompu), on continue au lieu de repartir de zéro.`);
          L.push(`if _CHECKPOINT.exists():`);
          L.push(`    _etat = RunState.from_dict(json.loads(_CHECKPOINT.read_text(encoding="utf-8")))`);
          L.push(`    resultat = ${av}.resume(_etat, checkpoint=sauvegarder${extra})`);
          L.push(`else:`);
          L.push(`    resultat = ${av}.${methode}(${cible}, checkpoint=sauvegarder${extra})`);
        }else{
          L.push(`resultat = ${av}.${methode}(${cible}${ckArg})`);
        }
        wrapRun();
        L.push(`print(resultat.output)`);
        L.push(`print(f"\\n({resultat.steps} tours d'agent)")`);
        if(tr) L.push(`print("trace \\u2192", ${pyStr(tr.f.file||"trace.jsonl")})`);
        if(ckpt) L.push(`_CHECKPOINT.unlink(missing_ok=True)   # run terminé : le snapshot n'a plus lieu d'être`);
        // Sans ça, la supersession reste invisible : on ne voit que la
        // réponse, pas ce qui est réellement stocké.
        if(mem && mem.f.kind==="FactMemory" && mem.f.dump){
          L.push(``);
          L.push(`# Les faits TELS QU'ILS SONT STOCKÉS. Une information qui change`);
          L.push(`# ne remplace pas l'ancienne : elle FERME sa fenêtre de validité.`);
          L.push(`# On ne sert jamais un fait périmé, mais on peut encore dire ce`);
          L.push(`# qu'on croyait, et depuis quand.`);
          L.push(`#`);
          L.push(`# La PROVENANCE distingue deux écritures qui ne se valent pas :`);
          L.push(`#   agent = déduit de la conversation par le modèle ;`);
          L.push(`#   host  = déclaré explicitement via remember().`);
          L.push(`print("\\nfaits stockés :")`);
          L.push(`for _f in ${(mem.f.var||"memoire")}.facts(include_invalid=True):`);
          L.push(`    _etat = "périmé" if _f["invalid_at"] else "à jour "`);
          L.push(`    _suite = f" → remplacé par #{_f['superseded_by']}" if _f["superseded_by"] else ""`);
          L.push(`    print(f"  [{_etat}] [{_f['source']:<5}] #{_f['id']} {_f['fact']}{_suite}")`);
        }
      }
      if(tr && tr.f.resume){
        L.push(``);
        L.push(`# L'efficacité lue dans la trace, après coup : appels redondants, refus des gardes,`);
        L.push(`# résultats élagués, jetons par succès. Rien n'a été ajouté au run pour l'obtenir.`);
        L.push(`print(summarize_trace(${pyStr(tr.f.file||"trace.jsonl")}).summary())`);
      }
      if(mem && mem.f.kind==="FactMemory" && mem.f.background) L.push(`${mv}.flush()   # consolidation en arrière-plan : on attend qu'elle soit écrite`);
      if(recB && !replay) L.push(`session.close()   # la fixture est complète : rejouable avec ReplaySession`);
      for(const m of mcps) L.push(`${(m.f.var||"mcp").trim()}.close()`);
    }else{
      note("warn", "Ajoute « Lancer » pour exécuter l'agent (ou « Fiabilité », « Cascade », « Synthèse »).");
      L.push(`# Ajoute un bloc « Lancer » pour exécuter l'agent.`);
    }
  }

  /* ═══ Programme ORCHESTRATOR (flux piloté par l'hôte) ═══ */
  if(orchB){
    const o = orchB.f, ov = (o.var||"orch").trim();
    if(agentB){ L.push(``); L.push(`# ${"═".repeat(60)}`); }
    L.push(`# Flux piloté par l'hôte : le LLM interprète les réponses et reformule`);
    L.push(`# les questions ; TA machine à états décide de l'avancement.`);
    L.push(`_STEPS = [`);
    L.push(orchSteps(o.steps));
    L.push(`]`);
    L.push(`_reponses = {}`);
    L.push(``);
    L.push(`def current_steps():`);
    L.push(`    # L'étape courante d'abord ; [] quand tout est répondu.`);
    L.push(`    return [s for s in _STEPS if s.id not in _reponses]`);
    L.push(``);
    L.push(`def record(step_id, value):`);
    L.push(`    # Retourne un message d'erreur (str) pour REFUSER la valeur, sinon None.`);
    L.push(`    _reponses[step_id] = value`);
    L.push(`    return None`);
    L.push(``);
    const libelles = orchSteps(o.describe||"").length ? String(o.describe||"").split("\n").map(l=>l.trim()).filter(Boolean).map(l=>{ const i=l.indexOf("|"); return [(i>=0?l.slice(0,i):l).trim(), (i>=0?l.slice(i+1):l).trim()]; }) : [];
    if(libelles.length){
      L.push(`# Accusé de réception fidèle : les modèles lisent mal les codes bruts, on leur`);
      L.push(`# donne le libellé humain.`);
      L.push(`_LIBELLES = {${libelles.map(([k,v])=>`${pyStr(k)}: ${pyStr(v)}`).join(", ")}}`);
      L.push(``);
      L.push(`def describe(step_id, value):`);
      L.push(`    return f"{_LIBELLES.get(step_id, step_id)} : {value}"`);
      L.push(``);
    }
    const ok = [`current_steps=current_steps, record=record`];
    if(libelles.length) ok.push(`describe=describe`);
    if(o.on_refused) ok.push(`on_refused=lambda step_id: print(f"[refus explicite] {step_id}")`);
    if(o.on_offtopic) ok.push(`on_offtopic=lambda note: print(f"[hors-sujet] {note}")`);
    if(num(o.phrase_temp,0.6) !== 0.6) ok.push(`phrase_temperature=${num(o.phrase_temp,0.6)}`);
    L.push(`${ov} = Orchestrator(`);
    L.push(`    create_provider(ModelConfig(${pyStr(o.prov)}, ${pyStr(o.model)})),`);
    for(const k of ok) L.push(`    ${k},`);
    L.push(`    closing_text=${pyStr(o.closing||"Merci !")})`);
    L.push(``);
    L.push(`_restantes = current_steps()`);
    L.push(`print(_restantes[0].payload["question"])   # 1re question`);
    L.push(`while current_steps():`);
    L.push(`    for ev in ${ov}.turn(input("> ")):`);
    L.push(`        if ev.type == "text":`);
    L.push(`            print(ev.text)`);
    L.push(`print("\\nRéponses collectées :", _reponses)`);
  }

  /* ═══ CHAÎNE déterministe (pipeline séquentiel — code, pas LLM) ═══ */
  if(chaineB){
    const c = chaineB.f, stages = parseStages(c.stages);
    const traceArg = hasTrace ? `, trace=trace` : ``;
    if(agentB||orchB){ L.push(``); L.push(`# ${"═".repeat(60)}`); }
    L.push(`# Chaîne DÉTERMINISTE : l'ordre est garanti par le code (pas par le LLM).`);
    L.push(`# Chaque étape reçoit la sortie de la précédente.`);
    L.push(`_etapes = [`);
    for(const [nom,role] of stages) L.push(`    (${pyStr(nom)}, ${pyStr(role)}),`);
    L.push(`]`);
    const borneC = boundsB ? `, bounds=${(boundsB.f.var||"BORNES").trim()}` : `, max_steps=${num(c.steps,4)}`;
    L.push(`_agents = {nom: Agent.from_model(${pyStr(c.prov)}, ${pyStr(c.model)}, system_prompt=role,`);
    L.push(`                                 temperature=0.0${borneC}${traceArg})`);
    L.push(`           for nom, role in _etapes}`);
    L.push(``);
    L.push(`_entree = ${pyLines(c.prompt, 0)}`);
    L.push(`_contexte = _entree`);
    L.push(`_resultats = []`);
    L.push(`for _nom, _ in _etapes:`);
    L.push(`    _res = _agents[_nom].run(_contexte)`);
    L.push(`    _resultats.append(_res)`);
    L.push(`    print(f"[{_nom}]\\n{_res.output}\\n")`);
    L.push(`    _contexte = f"{_entree}\\n\\n[Sortie de l'étape précédente ({_nom})]\\n{_res.output}"`);
    L.push(`_jetons = sum(r.usage.total_tokens for r in _resultats if r.usage)`);
    L.push(`print(f"=== Résultat final de la chaîne — {len(_resultats)} étapes, {_jetons} jetons ===")`);
    L.push(`print(_res.output)`);
  }

  /* ═══ PARALLÈLE + fusion (fan-out concurrent puis synthèse) ═══ */
  if(cascB && !agentB && !orchB){ emitCascade(); }
  if(parB){
    const p = parB.f, stages = parseStages(p.stages);
    const traceArg = hasTrace ? `, trace=trace` : ``;
    if(agentB||orchB||chaineB){ L.push(``); L.push(`# ${"═".repeat(60)}`); }
    L.push(`# Fan-out : les experts tournent EN PARALLÈLE (threads), puis un synthétiseur fusionne.`);
    L.push(`# Chaque expert est une instance distincte → sûr en parallèle.`);
    L.push(`_experts = [`);
    for(const [nom,role] of stages) L.push(`    (${pyStr(nom)}, ${pyStr(role)}),`);
    L.push(`]`);
    const borneP = boundsB ? `, bounds=${(boundsB.f.var||"BORNES").trim()}` : `, max_steps=${num(p.steps,4)}`;
    L.push(`_agents = {nom: Agent.from_model(${pyStr(p.prov)}, ${pyStr(p.model)}, system_prompt=role,`);
    L.push(`                                 temperature=0.0${borneP}${traceArg})`);
    L.push(`           for nom, role in _experts}`);
    L.push(`_synth = Agent.from_model(${pyStr(p.prov)}, ${pyStr(p.model)}, temperature=0.0${borneP}${traceArg},`);
    L.push(`                          system_prompt=${pyLines(p.synth||"Fusionne les analyses.", 26)})`);
    L.push(``);
    L.push(`_entree = ${pyLines(p.prompt, 0)}`);
    L.push(`with ThreadPoolExecutor() as _ex:`);
    L.push(`    _futs = {nom: _ex.submit(_agents[nom].run, _entree) for nom, _ in _experts}`);
    L.push(`    _resultats = {nom: f.result() for nom, f in _futs.items()}`);
    L.push(``);
    L.push(`_fusion = "\\n\\n".join(f"[{n}]\\n{r.output}" for n, r in _resultats.items())`);
    L.push(`final = _synth.run(f"Voici les analyses à fusionner :\\n{_fusion}")`);
    L.push(`_jetons = sum(r.usage.total_tokens for r in [*_resultats.values(), final] if r.usage)`);
    L.push(`print(final.output)`);
    L.push(`print(f"\\n({len(_resultats)} experts en parallèle + 1 synthèse — {_jetons} jetons)")`);
  }

  let code = L.join("\n").replace(/\n{3,}/g,"\n\n").trimEnd()+"\n";
  if(integ) code = wrapAsFunction(code, av);
  // canInteg : le programme PEUT devenir une fonction (agent seul, pas un flux).
  const canInteg = !!(agentB && !orchB && !chaineB && !parB);
  return {code, env: replay ? null : env, loc: code.split("\n").length, integ, canInteg, notes};
}

/* Transforme un script en fonction `build_agent()` réutilisable : garde les
   imports au niveau module, indente tout le reste sous la fonction, et
   retourne l'agent (au lieu de le lancer). Pour l'intégration dans une app. */
function wrapAsFunction(code, av){
  const lines = code.split("\n");
  let lastImport = -1;
  for(let i=0;i<lines.length;i++){
    const t = lines[i].trim();
    if(t.startsWith("from ") || t.startsWith("import ")) lastImport = i;
  }
  const header = lines.slice(0, lastImport+1);
  let body = lines.slice(lastImport+1);
  while(body.length && body[0].trim()==="") body.shift();
  while(body.length && body[body.length-1].trim()==="") body.pop();
  const indented = body.map(l => l.trim()==="" ? "" : "    "+l);
  return [
    ...header, "", "",
    "def build_agent():",
    '    """Construit et retourne l\'agent configuré — à piloter par ton app."""',
    ...indented,
    "",
    `    return ${av}`,
    "",
  ].join("\n");
}
function pyTriDoc(s){ return `"""${String(s).replace(/\\/g,"\\\\").replace(/"""/g,'\\"\\"\\"')}"""`; }

/* ══════════════════════════════════════════════════════════════════════
   4. COLORATION SYNTAXIQUE (scanner sûr : échappe le HTML puis tokenise)
   ══════════════════════════════════════════════════════════════════════ */
const KW = new Set("False None True and as assert async await break class continue def del elif else except finally for from global if import in is lambda nonlocal not or pass raise return try while with yield".split(" "));
function highlight(code){
  const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  let out = "", i = 0, n = code.length;
  const spec = /^(#[^\n]*)|^("""[\s\S]*?"""|'''[\s\S]*?'''|"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*')|^(@[\w.]+)/;
  while(i < n){
    const rest = code.slice(i);
    const m = spec.exec(rest);
    if(m){
      const tok = m[0];
      if(m[1]) out += `<span class="tok-com">${esc(tok)}</span>`;
      else if(m[2]) out += `<span class="tok-str">${esc(tok)}</span>`;
      else out += `<span class="tok-dec">${esc(tok)}</span>`;
      i += tok.length; continue;
    }
    // morceau "code" jusqu'au prochain caractère spécial
    let j = i;
    while(j < n){
      const c = code[j];
      if(c==="#"||c==='"'||c==="'"||c==="@") break;
      j++;
    }
    const chunk = code.slice(i, j===i? i+1 : j);
    // Une seule passe : on colore ET on échappe en même temps, pour ne jamais
    // ré-échapper les balises <span> qu'on vient d'insérer.
    out += chunk.replace(/([A-Za-z_]\w*)|(\d+\.?\d*)|([&<>])|([\s\S])/g,
      (m, id, num, sp, other)=>{
        if(id!==undefined) return KW.has(id) ? `<span class="tok-kw">${id}</span>` : id;
        if(num!==undefined) return `<span class="tok-num">${num}</span>`;
        if(sp!==undefined) return {"&":"&amp;","<":"&lt;",">":"&gt;"}[sp];
        return other;
      });
    i = (j===i)? i+1 : j;
  }
  return out;
}

const $ = s => document.querySelector(s);

// ── Infobulle (position:fixed → jamais rognée par le scroll de la colonne) ──
const escapeHtml = s => String(s).replace(/[&<>]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const tt = document.createElement("div"); tt.id="tt"; document.body.appendChild(tt);
function showTip(el){
  const type = el.dataset.type, d = INFO[type], def = DEFS[type];
  if(!d || !def) return;
  tt.style.setProperty("--cat", CATS[def.cat].color);
  tt.innerHTML = `<b>${escapeHtml(def.name)}</b><span class="api">${escapeHtml(d.api)}</span><p>${escapeHtml(d.info)}</p>`;
  const r = el.getBoundingClientRect();
  const w = tt.offsetWidth, h = tt.offsetHeight, m = 8;
  let left = r.right + m;
  if(left + w > window.innerWidth - m) left = r.left - w - m;      // bascule à gauche si ça déborde
  if(left < m) left = m;
  let top = r.top - 4;
  if(top + h > window.innerHeight - m) top = window.innerHeight - h - m;
  if(top < m) top = m;
  tt.style.left = left+"px"; tt.style.top = top+"px";
  tt.classList.add("show");
}
function hideTip(){ tt.classList.remove("show"); }

function renderPalette(){
  const p = $("#palette");
  p.innerHTML = "";
  // regroupe par catégorie, dans un ordre pédagogique
  const order = ["core","tool","safe","mem","trace","multi","hook","flow","run"];
  const byCat = {};
  for(const [type,def] of Object.entries(DEFS)){ (byCat[def.cat] ||= []).push(type); }
  for(const cat of order){
    if(!byCat[cat]) continue;
    const wrap = document.createElement("div"); wrap.className="cat";
    wrap.innerHTML = `<h3>${CATS[cat].label}</h3>`;
    for(const type of byCat[cat]){
      const def = DEFS[type];
      const used = def.one && stack.some(b=>b.type===type);
      const piw = document.createElement("div"); piw.className="pi-wrap"; piw.style.setProperty("--cat", CATS[cat].color);
      piw.dataset.search = `${def.name} ${def.sub} ${(INFO[type]||{}).api||""} ${(INFO[type]||{}).info||""}`.toLowerCase();
      const b = document.createElement("button");
      b.className="paletteItem"; b.style.setProperty("--cat", CATS[cat].color);
      b.setAttribute("draggable","true");
      b.setAttribute("aria-disabled", used?"true":"false");
      b.innerHTML = `${svgGlyph(cat)}<span class="txt"><span class="pi-name">${def.name}</span><span class="pi-sub">${def.sub}</span></span>`;
      b.addEventListener("click", ()=> addBlock(type));
      b.addEventListener("dragstart", e=>{ e.dataTransfer.setData("text/newblock", type); e.dataTransfer.effectAllowed="copy"; dragging={label:def.name, cat:def.cat}; });
      b.addEventListener("dragend", ()=>{ dragging=null; clearInsert(); });
      piw.appendChild(b);
      // icône info + infobulle
      const info = document.createElement("span");
      info.className="pi-info"; info.textContent="i"; info.dataset.type=type;
      info.tabIndex=0; info.setAttribute("role","button");
      info.setAttribute("aria-label", `À quoi sert « ${def.name} »`);
      info.addEventListener("mouseenter", ()=>showTip(info));
      info.addEventListener("mouseleave", hideTip);
      info.addEventListener("focus", ()=>showTip(info));
      info.addEventListener("blur", hideTip);
      info.addEventListener("click", e=>{ e.stopPropagation(); });
      piw.appendChild(info);
      wrap.appendChild(piw);
    }
    p.appendChild(wrap);
  }
  // note de câblage (relations entre modules)
  const note = document.createElement("div");
  note.className="wire-note";
  note.innerHTML = `<b>Deux façons d'orchestrer :</b><br>
    • <b>Pilotée par le LLM</b> — un <span style="color:var(--c-multi)">Sous-agent</span> devient un outil (<code>as_tool()</code>) ; l'agent décide quand l'appeler (ordre <em>émergent</em>).<br>
    • <b>Déterministe (code)</b> — <span style="color:var(--c-multi)">Chaîne</span> impose l'ordre A→B→C (chaque étape reçoit la sortie de la précédente) ; <span style="color:var(--c-multi)">Parallèle</span> lance N experts en // puis fusionne.<br>
    <b>Câblage auto :</b> la <span style="color:var(--c-trace)">Trace</span> est partagée par tous les agents ; <span style="color:var(--c-mem)">Mémoire</span> / <span style="color:var(--c-hook)">Vérification</span> / <span style="color:var(--c-core)">Routing</span> se branchent sur l'agent principal ; le <span style="color:var(--c-safe)">Bac à sable</span> alimente les <span style="color:var(--c-tool)">Outils dynamiques</span> ; un <span style="color:var(--c-tool)">Serveur MCP</span> monte ses outils sur l'agent (et se ferme après le run) ; l'<span style="color:var(--c-trace)">Export OpenTelemetry</span> se greffe sur la Trace ; <span style="color:var(--c-run)">Checkpoint</span> rend le run reprenable après un crash ; l'<span style="color:var(--c-flow)">Orchestrator</span> est un flux piloté par l'hôte.`;
  p.appendChild(note);
  appliquerFiltre();
}

// Filtre de la palette : nom, sous-titre, API et aide au survol.
function appliquerFiltre(){
  const inp = $("#filtre"); const q = ((inp && inp.value) || "").trim().toLowerCase();
  for(const w of document.querySelectorAll("#palette .pi-wrap")) w.classList.toggle("masque", !!q && !(w.dataset.search||"").includes(q));
  for(const c of document.querySelectorAll("#palette .cat")) c.classList.toggle("vide", !!q && ![...c.querySelectorAll(".pi-wrap")].some(w=>!w.classList.contains("masque")));
}

function fieldEl(block, fld){
  const def = DEFS[block.type];
  const id = `f-${block.id}-${fld.k}`;
  const wrap = document.createElement("div");
  wrap.className = "field" + (fld.kind==="check"?" check":"");
  const val = block.f[fld.k];
  if(fld.kind==="check"){
    wrap.innerHTML = `<input type="checkbox" id="${id}" ${val?"checked":""}><label for="${id}">${fld.l}</label>`;
    wrap.querySelector("input").addEventListener("change", e=>{ block.f[fld.k]=e.target.checked; regen(); });
    return wrap;
  }
  let ctrl;
  if(fld.kind==="textarea"){ ctrl = document.createElement("textarea"); ctrl.value = val??""; }
  else if(fld.kind==="select"){
    ctrl = document.createElement("select");
    for(const o of fld.opts){ const op=document.createElement("option"); op.value=o; op.textContent=o; if(o===val) op.selected=true; ctrl.appendChild(op); }
  }
  else { ctrl = document.createElement("input"); ctrl.type = fld.kind==="number"?"number":"text"; ctrl.value = val??""; }
  ctrl.id = id;
  const lab = `<label for="${id}">${fld.l}${fld.hint?` <span class="f-hint">· ${fld.hint}</span>`:""}</label>`;
  wrap.innerHTML = lab;
  wrap.appendChild(ctrl);
  const ev = fld.kind==="select"?"change":"input";
  ctrl.addEventListener(ev, e=>{
    block.f[fld.k] = e.target.value;
    // Le modèle suit le fournisseur — sauf si l'utilisateur a saisi le sien.
    if(fld.k === "prov" && (e.target.value in MODELE_DEFAUT)){
      const connus = Object.values(MODELE_DEFAUT);
      if(!block.f.model || connus.includes(block.f.model)){
        block.f.model = MODELE_DEFAUT[e.target.value];
        renderStack();      // le champ modèle doit refléter la bascule
      }
    }
    regen();
  });
  return wrap;
}

/* Les champs d'un bloc : grilles half/third, et les champs marqués `grp` repliés
   dans un <details> — ouvert seulement si l'un d'eux s'écarte du défaut (ou si
   l'utilisateur l'a ouvert). L'essentiel reste visible, le reste à portée. */
function layoutFields(block, fs, body){
  const pose = (fields, container) => {
    let i=0;
    while(i<fields.length){
      const f=fields[i];
      if(f.w==="half" && fields[i+1] && fields[i+1].w==="half"){
        const g=document.createElement("div"); g.className="grid2";
        g.appendChild(fieldEl(block, fields[i])); g.appendChild(fieldEl(block, fields[i+1])); container.appendChild(g); i+=2; continue;
      }
      if(f.w==="third" && fields[i+1]&&fields[i+1].w==="third" && fields[i+2]&&fields[i+2].w==="third"){
        const g=document.createElement("div"); g.className="grid3";
        g.appendChild(fieldEl(block, fields[i])); g.appendChild(fieldEl(block, fields[i+1])); g.appendChild(fieldEl(block, fields[i+2])); container.appendChild(g); i+=3; continue;
      }
      container.appendChild(fieldEl(block, f)); i++;
    }
  };
  const differe = f => {
    const v = block.f[f.k];
    return f.kind==="check" ? !!v !== !!f.def : String(v ?? "") !== String(f.def ?? "");
  };
  block.ui ||= {};
  const faits = new Set();
  let run = [];
  const flush = () => { if(run.length){ pose(run, body); run=[]; } };
  for(const f of fs){
    if(!f.grp){ run.push(f); continue; }
    if(faits.has(f.grp)) continue;
    faits.add(f.grp); flush();
    const membres = fs.filter(x=>x.grp===f.grp);
    const n = membres.filter(differe).length;
    const d = document.createElement("details"); d.className="grp";
    d.open = block.ui[f.grp] ?? (n>0);
    const s = document.createElement("summary");
    s.innerHTML = `<span>${f.grp}</span><span class="grp-n${n?"":" zero"}">${n ? `${n} réglé${n>1?"s":""}` : "défauts"}</span>`;
    d.appendChild(s);
    const corps = document.createElement("div"); corps.className="grp-body";
    pose(membres, corps); d.appendChild(corps);
    d.addEventListener("toggle", ()=>{ block.ui[f.grp] = d.open; });
    body.appendChild(d);
  }
  flush();
}

function blockEl(block, index){
  const def = DEFS[block.type];
  const el = document.createElement("div");
  el.className="block"; el.style.setProperty("--cat", CATS[def.cat].color);
  el.dataset.id = block.id;
  el.setAttribute("draggable","true");

  const head = document.createElement("div"); head.className="block-head";
  head.innerHTML = `<span class="grip" title="Glisser pour réordonner">⋮⋮</span>
    <span class="b-name">${def.name}</span><span class="b-cat">${CATS[def.cat].label}</span>
    <span class="b-actions">
      <button class="icon-btn" data-act="up"   title="Monter">▲</button>
      <button class="icon-btn" data-act="down" title="Descendre">▼</button>
      <button class="icon-btn danger" data-act="del" title="Supprimer">✕</button>
    </span>`;
  el.appendChild(head);

  const body = document.createElement("div"); body.className="block-body";
  layoutFields(block, def.fields, body);
  el.appendChild(body);

  head.querySelector('[data-act="up"]').addEventListener("click", ()=>moveBlock(block.id,-1));
  head.querySelector('[data-act="down"]').addEventListener("click", ()=>moveBlock(block.id,1));
  head.querySelector('[data-act="del"]').addEventListener("click", ()=>removeBlock(block.id));

  el.addEventListener("dragstart", e=>{
    e.dataTransfer.setData("text/moveid", String(block.id));
    e.dataTransfer.effectAllowed="move"; el.classList.add("dragging");
    dragging={label:def.name, cat:def.cat};
  });
  el.addEventListener("dragend", ()=>{ el.classList.remove("dragging"); dragging=null; clearInsert(); });
  return el;
}

function renderStack(){
  const s = $("#stack");
  s.innerHTML="";
  if(stack.length===0){
    s.innerHTML = `<div class="drop-empty"><strong>Glisse un module ici</strong>Commence par un bloc « Agent », puis empile outils, mémoire, trace, sous-agents… ou clique un exemple en haut.</div>`;
    return;
  }
  stack.forEach((b,i)=> s.appendChild(blockEl(b,i)));
}

function render(){ renderPalette(); renderStack(); regen(); }

function regen(){
  cacherSortie();   // le code vient de changer : la sortie ne lui correspond plus
  const {code, env, loc, integ, canInteg, notes} = generate();
  $("#code").innerHTML = highlight(code);
  const dg = $("#diag");
  if(dg){
    const ns = notes || [];
    dg.hidden = ns.length === 0;
    dg.innerHTML = ns.map(n=>`<div class="${n.lvl}">${escapeHtml(n.txt)}</div>`).join("");
  }
  window.__lastCode = code; window.__lastEnv = env; window.__lastName = "mon_agent.py";
  $("#loc-count").textContent = loc>1 ? `${loc} lignes` : "";
  // Le mode « fonction à intégrer » n'a de sens que pour un agent seul :
  // un flux (Orchestrator/Chaîne/Parallèle) reste un script → bouton grisé.
  const mi = $("#mode-integ");
  if(mi){
    mi.disabled = !canInteg;
    mi.title = canInteg
      ? "Une fonction build_agent() à importer dans ton app (sans run ni __main__)"
      : "Indisponible : un flux (Orchestrateur/Chaîne/Parallèle) reste un script autonome";
  }
  const rc = $("#run-cmd");
  if(integ) rc.innerHTML = `<span class="k">from</span>&nbsp;mon_agent&nbsp;<span class="k">import</span>&nbsp;build_agent&nbsp;&nbsp;→&nbsp;agent&nbsp;=&nbsp;build_agent()`;
  else if(env) rc.innerHTML = `<span class="k">${env}</span>=…&nbsp;&nbsp;python&nbsp;mon_agent.py`;
  else rc.textContent = "";
}

/* ══════════════════════════════════════════════════════════════════════
   6. DRAG & DROP sur la pile (insertion + réordonnancement)
   ══════════════════════════════════════════════════════════════════════ */
const stackEl = $("#stack");
function clearInsert(){
  const l=stackEl.querySelector(".slot"); if(l) l.remove();
  stackEl.querySelectorAll(".neighbor-before,.neighbor-after")
    .forEach(b=>b.classList.remove("neighbor-before","neighbor-after"));
  insertIdx=null;
}
function indexFromY(y){
  const blocks=[...stackEl.querySelectorAll(".block")];
  for(let k=0;k<blocks.length;k++){
    const r=blocks[k].getBoundingClientRect();
    if(y < r.top + r.height/2) return k;
  }
  return blocks.length;
}
function showInsert(idx){
  if(idx===insertIdx && stackEl.querySelector(".slot")) return;  // pas de rebuild inutile (anti-flicker)
  clearInsert();
  insertIdx=idx;
  const blocks=[...stackEl.querySelectorAll(".block")];
  // Aperçu du slot : montre CE qui va tomber, dans la couleur de la catégorie.
  const slot=document.createElement("div"); slot.className="slot";
  const cat = dragging ? dragging.cat : "core";
  slot.style.setProperty("--slotcat", CATS[cat] ? CATS[cat].color : "var(--c-core)");
  const label = dragging ? dragging.label : "Module";
  slot.innerHTML = `<span class="slot-dot"></span><span>${label} — déposer ici</span><span class="slot-arrow">↳</span>`;
  if(idx>=blocks.length) stackEl.appendChild(slot);
  else stackEl.insertBefore(slot, blocks[idx]);
  // Allume et ÉCARTE les deux voisins (précédent + suivant) du point d'insertion.
  if(idx-1>=0 && blocks[idx-1]) blocks[idx-1].classList.add("neighbor-before");
  if(idx<blocks.length && blocks[idx]) blocks[idx].classList.add("neighbor-after");
}
stackEl.addEventListener("dragover", e=>{
  e.preventDefault();
  e.dataTransfer.dropEffect = e.dataTransfer.types.includes("text/newblock")?"copy":"move";
  showInsert(indexFromY(e.clientY));
});
stackEl.addEventListener("dragleave", e=>{ if(!stackEl.contains(e.relatedTarget)) clearInsert(); });
stackEl.addEventListener("drop", e=>{
  e.preventDefault();
  const idx = insertIdx!=null?insertIdx:stack.length;
  const newType = e.dataTransfer.getData("text/newblock");
  const moveId  = e.dataTransfer.getData("text/moveid");
  clearInsert(); dragging=null;
  if(newType){ addBlock(newType, idx); return; }
  if(moveId){
    const id=+moveId; const from=stack.findIndex(b=>b.id===id); if(from<0) return;
    const [blk]=stack.splice(from,1);
    let to=idx; if(from<idx) to--;
    stack.splice(Math.max(0,Math.min(to,stack.length)),0,blk); render();
  }
});

const SHOWCASES = [
  {id: "09", file: "09_sortie_structuree.py", label: "09 · Sortie structurée (code seul)", note: "JSON fiable sans agent : response_format demandé au provider, parse direct.", code: "\"\"\"08 — Sortie structurée : du JSON fiable, pas du texte à re-parser.\n\n`response_format={\"type\": \"json_object\"}` active le JSON mode natif\n(OpenAI/DeepSeek/Gemini ; consigne stricte pour Anthropic). On appelle le\nprovider DIRECTEMENT (sans boucle d'agent) pour extraire une fiche\nstructurée d'un texte libre — le pattern « extraction » classique.\n\n    python examples_autoagent/08_sortie_structuree.py\n\"\"\"\n\nimport json\n\nfrom _common import make_provider\n\nfrom autoagent import LLMRequest, Message\n\nTEXTE = (\n    \"Bonjour, ici l'exploitant A7. Le capteur CMP-VAL-SN à Valence (GPS 44.95, 4.87) \"\n    \"ne remonte plus rien depuis 8h ce matin, sens sud. Il faisait très chaud hier. \"\n    \"Merci de regarder en priorité haute.\"\n)\n\n\ndef main() -> None:\n    provider = make_provider()\n\n    request = LLMRequest(\n        messages=[\n            Message(role=\"system\", content=(\n                \"Extrais une fiche d'incident. Réponds en JSON avec EXACTEMENT ces clés : \"\n                \"capteur_id (str), lieu (str), gps (objet lat/lon), heure (str), \"\n                \"direction (str), priorite (str parmi basse/normale/haute).\")),\n            Message(role=\"user\", content=TEXTE),\n        ],\n        response_format={\"type\": \"json_object\"},\n        temperature=0,\n        max_tokens=400,\n    )\n    response = provider.complete(request)\n\n    fiche = json.loads(response.content)  # parse direct : le JSON mode garantit la forme\n    print(\"Fiche extraite (dict Python) :\\n\")\n    print(json.dumps(fiche, indent=2, ensure_ascii=False))\n    print(f\"\\ncapteur = {fiche.get('capteur_id')} | priorité = {fiche.get('priorite')}\")\n\n\nif __name__ == \"__main__\":\n    main()\n"},
  {id: "12", file: "12_pseudonymisation_pii.py", label: "12 · Pseudonymisation PII (code seul)", note: "RGPD : le host masque noms/emails/téléphones en jetons — le LLM ne voit jamais les vraies données.", code: "\"\"\"12 — Pseudonymisation : le LLM ne voit JAMAIS les vraies données (RGPD).\n\nPattern « coffre-fort à la frontière ». Avant qu'un texte n'atteigne le LLM,\nle HOST remplace les données personnelles (nom, e-mail, téléphone) par des\nJETONS opaques ([PERSONNE_1], [EMAIL_1]…) et garde la correspondance CÔTÉ\nHOST. Le modèle raisonne sur les jetons ; sa sortie est « dé-tokenisée »\nlocalement — les vraies valeurs réapparaissent uniquement dans le résultat\nfinal, sans avoir transité par le fournisseur LLM.\n\nLe script PROUVE qu'aucune vraie donnée n'est dans le payload envoyé au LLM.\n\n    python examples_autoagent/12_pseudonymisation_pii.py\n\"\"\"\n\nimport re\n\nfrom _common import make_provider\n\nfrom autoagent import LLMRequest, Message\n\n# --- Dossier client RÉEL (fictif, mais c'est le genre de données à protéger) -\nDOSSIER = {\n    \"nom\": \"Camille Berthier\",\n    \"email\": \"camille.berthier@example.com\",\n    \"tel\": \"06 12 34 56 78\",\n}\nDEMANDE = (\n    f\"Rédige un SMS de relance court et poli pour {DOSSIER['nom']} : son rendez-vous \"\n    f\"d'installation du capteur est demain 9h. Termine par « répondez à {DOSSIER['email']} \"\n    f\"ou au {DOSSIER['tel']} ». Garde les mentions entre crochets EXACTEMENT telles quelles.\"\n)\n\n_EMAIL = re.compile(r\"[\\w.+-]+@[\\w-]+\\.[\\w.-]+\")\n_TEL = re.compile(r\"0[1-9](?:[ .\\-]?\\d{2}){4}\")\n\n\nclass Vault:\n    \"\"\"Remplace les PII par des jetons ; seul le HOST connaît la correspondance.\"\"\"\n\n    def __init__(self) -> None:\n        self._to_real: dict[str, str] = {}\n        self._to_token: dict[str, str] = {}\n        self._n: dict[str, int] = {}\n\n    def _tok(self, kind: str, real: str) -> str:\n        if real not in self._to_token:\n            self._n[kind] = self._n.get(kind, 0) + 1\n            token = f\"[{kind}_{self._n[kind]}]\"\n            self._to_token[real] = token\n            self._to_real[token] = real\n        return self._to_token[real]\n\n    def mask(self, text: str, noms: tuple[str, ...] = ()) -> str:\n        for nom in noms:  # noms connus d'abord (regex ne les attrape pas)\n            text = text.replace(nom, self._tok(\"PERSONNE\", nom))\n        text = _EMAIL.sub(lambda m: self._tok(\"EMAIL\", m.group()), text)\n        text = _TEL.sub(lambda m: self._tok(\"TEL\", m.group()), text)\n        return text\n\n    def unmask(self, text: str) -> str:\n        for token, real in self._to_real.items():\n            text = text.replace(token, real)\n        return text\n\n\ndef main() -> None:\n    provider = make_provider()\n    vault = Vault()\n\n    masque = vault.mask(DEMANDE, noms=(DOSSIER[\"nom\"],))\n    print(\"1) Ce que le LLM reçoit RÉELLEMENT (données masquées) :\\n\")\n    print(\"   \" + masque.replace(\"\\n\", \"\\n   \"), \"\\n\")\n\n    # Garde-fou : AUCUNE vraie PII ne doit être dans le payload sortant.\n    fuites = [v for v in DOSSIER.values() if v in masque]\n    assert not fuites, f\"FUITE de PII vers le LLM : {fuites}\"\n    print(f\"2) Vérification : 0 donnée réelle dans le payload (jetons: \"\n          f\"{list(vault._to_real)}).\\n\")\n\n    response = provider.complete(LLMRequest(\n        messages=[\n            Message(role=\"system\", content=\"Tu rédiges des SMS pros. Garde les [JETONS] intacts.\"),\n            Message(role=\"user\", content=masque),\n        ],\n        temperature=0,\n        max_tokens=300,\n    ))\n    print(\"3) Sortie du LLM (encore masquée) :\\n\")\n    print(\"   \" + response.content.strip().replace(\"\\n\", \"\\n   \"), \"\\n\")\n\n    final = vault.unmask(response.content)\n    print(\"4) Après dé-tokenisation CÔTÉ HOST (vraies valeurs restaurées) :\\n\")\n    print(\"   \" + final.strip().replace(\"\\n\", \"\\n   \"))\n\n\nif __name__ == \"__main__\":\n    main()\n"},
  {id: "13", file: "13_prise_rdv_supervisee.py", label: "13 · Prise de RDV supervisée (code seul)", note: "La démo complète des 3 cerveaux (Orchestrator + superviseur + mémoire par appelant) — le preset ★ en est l'approximation par blocs.", code: "\"\"\"13 — Prise de RDV supervisée : les 3 cerveaux de cati_service, sans la voix.\n\nLe cas le plus riche : un répondeur de prise de rendez-vous. On enlève la couche\nvocale (Gemini Live / Asterisk, qui n'est PAS de l'autoagent) et il reste\nl'architecture à TROIS cerveaux séparés, chacun une brique de la lib :\n\n  1. FLUX DÉTERMINISTE  (Orchestrator)  — le moteur possède la machine à états ;\n     le LLM ne fait qu'interpréter/reformuler. Validation Python par slot :\n     un jour hors planning ou une heure hors fenêtre sont REFUSÉS par le code.\n  2. SUPERVISEUR        (Agent + tools) — un agent autoagent qui a la VUE GLOBALE\n     (état + transcript + mémoire) et TRANCHE via UN outil : valider() ou\n     demander_correction(). post_turn_hook = on le force à trancher.\n  3. MÉMOIRE PAR APPELANT (Memory Protocol) — le numéro = l'identité. Chaque\n     appel est résumé et rangé sur disque ; au rappel, l'agent RETROUVE le passé\n     (register_recall_tool → outil rappeler_memoire).\n\nExécutable tel quel (client simulé) :\n    python examples_autoagent/13_prise_rdv_supervisee.py\n\"\"\"\n\nfrom __future__ import annotations\n\nimport json\nimport re\nimport time\nfrom pathlib import Path\n\nfrom _common import make_provider\n\nfrom autoagent import (Agent, AgentTurnContext, Message, Orchestrator, Step,\n                       TraceEmitter)\n\n# ── Config du RDV (comme config_rdv.json de cati_service) ────────────────────\nJOURS = [\"mardi\", \"mercredi\", \"jeudi\", \"vendredi\", \"samedi\"]\nFENETRES = {\"semaine\": (17, 21), \"samedi\": (10, 15)}   # heures d'ouverture\nDUREE_MIN = 35\nCHAMPS = [\n    (\"nom\",     \"le nom et prénom de la personne\"),\n    (\"jour\",    \"le jour du rendez-vous (du mardi au samedi)\"),\n    (\"heure\",   \"l'heure du rendez-vous\"),\n    (\"tel\",     \"le numéro de rappel (format français)\"),\n    (\"confirm\", \"la confirmation du récapitulatif (oui / non)\"),\n]\nMEM_DIR = Path(__file__).resolve().parent / \"memoire_demo\"\nMEM_DIR.mkdir(exist_ok=True)\nTRACE = Path(__file__).resolve().parent / \"trace_rdv.jsonl\"\n\n\n# ── CERVEAU 3 : mémoire par appelant (Memory Protocol : compact + recall) ────\nclass CallerMemory:\n    \"\"\"Mémoire d'UN numéro. Branchée sur l'agent superviseur (`memory=` +\n    register_recall_tool) : il fouille lui-même les appels passés.\"\"\"\n\n    def __init__(self, numero: str) -> None:\n        self.numero = re.sub(r\"\\D\", \"\", numero) or \"inconnu\"\n\n    def _file(self) -> Path:\n        return MEM_DIR / f\"{self.numero}.json\"\n\n    def compact(self, messages: list[Message]) -> list[Message]:\n        return messages                                   # runs courts → inchangé\n\n    def recall(self, query: str, k: int = 3) -> list[Message]:\n        try:\n            appels = json.loads(self._file().read_text(encoding=\"utf-8\"))[\"appels\"]\n        except Exception:\n            return []\n        mots = [m for m in re.split(r\"\\W+\", (query or \"\").lower()) if len(m) > 2]\n        scored = []\n        for ap in appels:\n            texte = f\"[appel du {ap['date']}] {ap['resume']} — RDV={json.dumps(ap['reponses'], ensure_ascii=False)}\"\n            score = sum(texte.lower().count(m) for m in mots) if mots else 1\n            if score:\n                scored.append((score, texte))\n        scored.sort(key=lambda s: -s[0])\n        return [Message(role=\"user\", content=t) for _, t in scored[:k]]\n\n    def save(self, resume: str, reponses: dict) -> None:\n        data = {\"appels\": []}\n        if self._file().is_file():\n            data = json.loads(self._file().read_text(encoding=\"utf-8\"))\n        data[\"appels\"].append({\"date\": time.strftime(\"%Y-%m-%d %H:%M\"),\n                               \"resume\": resume, \"reponses\": reponses})\n        data[\"appels\"] = data[\"appels\"][-10:]\n        self._file().write_text(json.dumps(data, ensure_ascii=False, indent=1), encoding=\"utf-8\")\n\n\n# ── CERVEAU 1 : validation déterministe des slots (comme flow.py) ────────────\ndef _fenetre(jour: str) -> tuple[int, int, str]:\n    if \"samedi\" in jour.lower():\n        return (*FENETRES[\"samedi\"], \"le samedi\")\n    return (*FENETRES[\"semaine\"], \"en semaine\")\n\ndef valider_slot(champ: str, valeur, etat: dict) -> str | None:\n    \"\"\"Renvoie un message d'erreur (→ rejet, reformulé) ou None (→ accepté).\"\"\"\n    v = str(valeur).lower().strip()\n    if champ == \"jour\":\n        if not any(j in v for j in JOURS):\n            return f\"les enquêteurs ne rappellent que : {', '.join(JOURS)}\"\n    elif champ == \"heure\":\n        m = re.search(r\"(\\d{1,2})\\s*[h:]\\s*(\\d{0,2})\", v)\n        if not m:\n            return \"je n'ai pas compris l'heure (ex. 18h, 14h30)\"\n        h = int(m.group(1))\n        lo, hi, libelle = _fenetre(etat.get(\"jour\", \"\"))\n        if not (lo <= h < hi or (h == hi)):\n            return (f\"{libelle} c'est entre {lo}h et {hi}h (l'entretien dure ~{DUREE_MIN} min) — \"\n                    \"proposez un autre créneau\")\n    elif champ == \"tel\":\n        if not re.match(r\"^(0|\\+?33)\\d{9}$\", re.sub(r\"[ .\\-]\", \"\", v)):\n            return \"il me faut un numéro français valide (ex. 06 12 34 56 78)\"\n    return None\n\n\n# ── Le flux (Orchestrator) piloté par un client SIMULÉ ───────────────────────\ndef prise_de_rdv(provider, scenario: list[str]) -> tuple[dict, str]:\n    answers: dict[str, object] = {}\n    transcript: list[str] = []\n\n    def current_steps():\n        restants = [(c, lbl) for c, lbl in CHAMPS if c not in answers]\n        return [Step(id=c, payload={\"demande\": lbl}) for c, lbl in restants[:2]]\n\n    def record(step_id: str, value) -> str | None:\n        err = valider_slot(step_id, value, answers)\n        if err:\n            return err                                    # rejet : l'étape reste\n        answers[step_id] = int(re.search(r\"\\d{1,2}\", str(value)).group()) if step_id == \"heure\" \\\n            else value\n        return None\n\n    orch = Orchestrator(provider, current_steps=current_steps, record=record,\n                        describe=lambda sid, val: f\"{sid} = {val}\",\n                        closing_text=\"Parfait, votre rendez-vous est confirmé. Merci et à bientôt !\")\n\n    print(\"Léa : Bonjour, service rendez-vous de l'institut Alyce, je suis Léa !\")\n    for reponse in scenario:\n        if not current_steps():\n            break\n        print(f\"\\nClient : {reponse}\")\n        transcript.append(f\"CLIENT : {reponse}\")\n        rep_lea = \"\"\n        for ev in orch.turn(reponse):\n            if ev.type == \"text\":\n                rep_lea += ev.text\n        print(f\"Léa : {rep_lea.strip()}\")\n        transcript.append(f\"LÉA : {rep_lea.strip()}\")\n    return answers, \"\\n\".join(transcript)\n\n\n# ── CERVEAU 2 : le superviseur (Agent autoagent qui TRANCHE) ─────────────────\n_SYS_SUP = (\n    \"Tu es l'ORCHESTRATEUR silencieux d'un répondeur de prise de RDV (l'agent \"\n    \"vocal s'appelle Léa). Tu as la vue globale : état du questionnaire, \"\n    \"transcript, et la mémoire des appels passés de ce numéro (outil \"\n    \"rappeler_memoire — utilise-le si le passé éclaire le présent). Vérifie que \"\n    \"le dernier échange est cohérent, puis TRANCHE en appelant EXACTEMENT UN \"\n    \"outil : valider() si tout va bien (cas NORMAL, sois conservateur) ; \"\n    \"demander_correction(probleme, consigne) s'il y a un VRAI problème (mauvaise \"\n    \"valeur notée, réponse ambiguë validée à tort, info déjà donnée lors d'un \"\n    \"appel passé). Dans le doute → valider().\"\n)\n\ndef superviser(provider, trace, numero: str, etat: str, transcript: str) -> dict:\n    verdict: dict = {\"decide\": False}\n\n    def force_verdict(ctx: AgentTurnContext) -> Message | None:\n        if not verdict[\"decide\"]:\n            return Message(role=\"user\", content=\"Tu n'as pas tranché : appelle valider() \"\n                           \"ou demander_correction(probleme, consigne) MAINTENANT.\")\n        return None\n\n    agent = Agent(provider, system_prompt=_SYS_SUP, max_steps=4, temperature=0.0,\n                  memory=CallerMemory(numero), trace=trace,\n                  post_turn_hook=force_verdict, max_corrections_per_run=1)\n    agent.register_recall_tool(\n        name=\"rappeler_memoire\", default_k=3,\n        description=\"Fouille les appels PASSÉS de ce numéro (résumés + RDV pris).\")\n\n    @agent.tool\n    def valider(raison: str = \"\") -> dict:\n        \"\"\"Le dernier échange est correct : l'appel continue normalement.\"\"\"\n        verdict.update(decide=True, ok=True, raison=raison)\n        return {\"enregistre\": True}\n\n    @agent.tool\n    def demander_correction(probleme: str, consigne: str) -> dict:\n        \"\"\"Signale un vrai problème + une consigne corrective courte pour Léa.\"\"\"\n        verdict.update(decide=True, ok=False, probleme=probleme, consigne=consigne)\n        return {\"enregistre\": True}\n\n    agent.run(f\"ÉTAT DU QUESTIONNAIRE :\\n{etat}\\n\\nTRANSCRIPT :\\n{transcript}\\n\\nTranche.\")\n    return verdict\n\n\ndef main() -> None:\n    provider = make_provider()\n    trace = TraceEmitter(file=str(TRACE))\n    numero = \"0612345678\"\n\n    print(\"═\" * 70 + \"\\nCERVEAU 1 — FLUX DÉTERMINISTE (Orchestrator + validation Python)\\n\" + \"═\" * 70)\n    scenario = [\n        \"Bonjour, Marie Dupont à l'appareil.\",\n        \"Est-ce que lundi serait possible ?\",     # ← REFUSÉ par le moteur (hors planning)\n        \"d'accord, alors jeudi\",                   # ← accepté\n        \"vers 18h ce serait parfait\",              # ← accepté (fenêtre semaine 17-21h)\n        \"vous me rappelez au 06 12 34 56 78\",      # ← accepté\n        \"oui, c'est parfait pour moi\",             # ← confirmation\n    ]\n    answers, transcript = prise_de_rdv(provider, scenario)\n    etat = \"\\n\".join(f\"  {c} = {answers.get(c, '—')}\" for c, _ in CHAMPS)\n    print(f\"\\n→ RDV capturé par le MOTEUR (pas par le LLM) : {answers}\")\n\n    print(\"\\n\" + \"═\" * 70 + \"\\nCERVEAU 2 — SUPERVISEUR (Agent qui tranche : valider / corriger)\\n\" + \"═\" * 70)\n    print(\"\\n• Sur le transcript RÉEL (propre) :\")\n    v1 = superviser(provider, trace, numero, etat, transcript)\n    print(f\"  → verdict : {'✅ VALIDÉ' if v1.get('ok') else '⚠️ CORRECTION'} \"\n          f\"— {v1.get('raison') or v1.get('consigne', '')}\")\n\n    print(\"\\n• Sur un transcript DOUTEUX (Léa a noté 18h mais le client a dit 18h30) :\")\n    faux = transcript.replace(\"vers 18h ce serait parfait\",\n                              \"plutôt 18h30 si possible\") + \"\\nLÉA : C'est noté, jeudi à 18h.\"\n    v2 = superviser(provider, trace, numero, etat + \"\\n  (heure notée : 18h)\", faux)\n    print(f\"  → verdict : {'✅ VALIDÉ' if v2.get('ok') else '⚠️ CORRECTION'} \"\n          f\"— {v2.get('probleme','')} / consigne : {v2.get('consigne','')}\")\n\n    print(\"\\n\" + \"═\" * 70 + \"\\nCERVEAU 3 — MÉMOIRE PAR APPELANT (le numéro rappelle)\\n\" + \"═\" * 70)\n    mem = CallerMemory(numero)\n    mem.save(resume=f\"Marie Dupont a pris RDV le {answers.get('jour')} à {answers.get('heure')}h, \"\n             f\"rappel au {answers.get('tel')}.\", reponses=answers)\n    print(f\"\\n• Appel mémorisé pour le {numero}.\")\n    print(\"• Le MÊME numéro rappelle → l'agent retrouve le passé (recall) :\")\n    for m in mem.recall(\"rendez-vous jour heure\"):\n        print(f\"    ↳ {m.content}\")\n\n    print(f\"\\n[trace complète de l'essaim : {TRACE.name}]\")\n\n\nif __name__ == \"__main__\":\n    main()\n"},
  {id: "14", file: "14_base_sql.py", label: "14 · Base SQL comme source (code seul)", note: "L'agent inspecte le schéma et écrit des SELECT ; l'écriture est refusée PAR LE CODE.", code: "\"\"\"14 — Base SQL comme source : l'agent répond en INTERROGEANT une base.\n\nLa base de données est la SOURCE DE VÉRITÉ — l'agent ne devine rien. Il\ninspecte le schéma (outil `schema`), écrit une requête, la lib l'exécute\n(outil `requete_sql`, en LECTURE SEULE : toute écriture est refusée PAR LE\nCODE, pas par le prompt), puis il répond à partir des lignes réelles.\n\nZéro dépendance : SQLite (stdlib), base en mémoire seedée au démarrage.\n\n    python examples_autoagent/14_base_sql.py\n\"\"\"\n\nfrom __future__ import annotations\n\nimport sqlite3\n\nfrom _common import make_provider\n\nfrom autoagent import Agent\n\n\ndef _base() -> sqlite3.Connection:\n    \"\"\"Une petite base « comptage routier » en mémoire (la source).\"\"\"\n    conn = sqlite3.connect(\":memory:\")\n    conn.executescript(\"\"\"\n        CREATE TABLE capteurs  (id INTEGER PRIMARY KEY, ville TEXT, statut TEXT);\n        CREATE TABLE comptages (capteur_id INTEGER, jour TEXT, vehicules INTEGER);\n        INSERT INTO capteurs VALUES\n          (1,'Lyon','actif'), (2,'Lyon','panne'), (3,'Valence','actif'),\n          (4,'Grenoble','actif'), (5,'Grenoble','panne');\n        INSERT INTO comptages VALUES\n          (1,'2026-07-01',1240), (1,'2026-07-02',1310),\n          (3,'2026-07-01', 860), (3,'2026-07-02', 910),\n          (4,'2026-07-01',2100), (4,'2026-07-02',1980);\n    \"\"\")\n    return conn\n\n\ndef main() -> None:\n    conn = _base()\n    agent = Agent(make_provider(), max_steps=6,\n                  system_prompt=(\"Tu réponds UNIQUEMENT à partir de la base SQL. \"\n                                 \"Commence par regarder le schéma, puis écris une \"\n                                 \"requête SELECT. Ne fabrique jamais de chiffres.\"))\n\n    @agent.tool\n    def schema() -> dict:\n        \"\"\"Liste les tables et leurs colonnes (à consulter avant d'écrire une requête).\"\"\"\n        out = {}\n        for (table,) in conn.execute(\"SELECT name FROM sqlite_master WHERE type='table'\"):\n            out[table] = [f\"{c[1]} {c[2]}\" for c in conn.execute(f\"PRAGMA table_info({table})\")]\n        return {\"tables\": out}\n\n    @agent.tool\n    def requete_sql(sql: str) -> dict:\n        \"\"\"Exécute une requête SQL en LECTURE SEULE et renvoie les lignes.\n        Seul un unique SELECT est autorisé — tout le reste est refusé.\"\"\"\n        clean = sql.strip().rstrip(\";\").strip()\n        if \";\" in clean:\n            return {\"erreur\": \"une seule requête à la fois (pas de ';' multiples)\"}\n        if not clean.lower().startswith((\"select\", \"with\")):\n            return {\"erreur\": \"lecture seule : seules les requêtes SELECT sont autorisées\"}\n        try:\n            cur = conn.execute(clean)\n            cols = [d[0] for d in cur.description]\n            rows = [dict(zip(cols, r)) for r in cur.fetchmany(50)]\n            return {\"colonnes\": cols, \"lignes\": rows, \"n\": len(rows)}\n        except Exception as exc:  # noqa: BLE001 — l'agent voit l'erreur et corrige sa requête\n            return {\"erreur\": f\"{type(exc).__name__}: {exc}\"}\n\n    question = (\"Quelle ville totalise le plus de véhicules comptés, et combien de \"\n                \"capteurs sont en panne au total ?\")\n    print(f\"Question : {question}\\n\")\n    result = agent.run(question)\n    print(result.output)\n\n    # Preuve que l'écriture est bloquée PAR LE CODE (pas par la bonne volonté du LLM) :\n    essai = requete_sql(\"DELETE FROM capteurs\")\n    print(f\"\\n[garde-fou] requete_sql('DELETE …') → {essai}\")\n    if result.usage:\n        print(f\"[{result.steps} tours | {result.usage.total_tokens} tokens | source : SQLite en mémoire]\")\n\n\nif __name__ == \"__main__\":\n    main()\n"},
  {id: "15", file: "15_appel_entrant_fiche.py", label: "15 · Appel entrant → fiche (code seul)", note: "Cascade de repli pilotée par l'agent : fiche locale → CRM → création par conversation.", code: "\"\"\"15 — Appel entrant : identifier l'appelant, ou créer sa fiche.\n\nUn standard téléphonique reçoit un appel avec un NUMÉRO. L'agent applique une\nCASCADE de repli, en choisissant lui-même le bon outil à chaque étape :\n\n    1. fiche_locale(numero)        — connu en base locale ? → on salue.\n    2. sinon annuaire_externe(...)  — connu dans l'AUTRE système (CRM) ?\n    3. sinon on DISCUTE : demander_a_la_personne(...) pour obtenir nom + adresse,\n       puis creer_fiche(...) — la fiche existe désormais en local.\n\nC'est l'agent qui décide de l'escalade (pas un `if` en dur) : on lui donne les\noutils + la procédure, il enchaîne. Ici le CRM et la personne sont simulés pour\nque la démo tourne seule ; en prod on branche un vrai CRM / la voix.\n\n    python examples_autoagent/15_appel_entrant_fiche.py\n\"\"\"\n\nfrom __future__ import annotations\n\nfrom _common import make_provider\n\nfrom autoagent import Agent\n\n# ── Les \"sources\" (simulées) ────────────────────────────────────────────────\nFICHES_LOCALES: dict[str, dict] = {\n    \"0611111111\": {\"nom\": \"Marie Dupont\", \"adresse\": \"12 rue de la Paix, Lyon\"},\n}\nCRM_EXTERNE: dict[str, dict] = {                       # l'AUTRE système\n    \"0622222222\": {\"nom\": \"Paul Martin\", \"adresse\": \"5 av. Jean Jaurès, Grenoble\"},\n}\nPERSONNES: dict[str, dict] = {                         # ce que dira l'appelant inconnu\n    \"0633333333\": {\"nom\": \"Sophie Bernard\", \"adresse\": \"8 place Bellecour, Lyon\"},\n}\n\n\ndef traiter_appel(provider, numero: str) -> str:\n    etat = {\"num\": numero}                             # l'appelant courant (pour la voix simulée)\n\n    agent = Agent(provider, max_steps=10, temperature=0.0, system_prompt=(\n        \"Tu es le standard téléphonique. Un appel arrive avec un numéro. \"\n        \"Procédure STRICTE, dans l'ordre, en t'arrêtant dès que tu as la fiche :\\n\"\n        \"1) fiche_locale(numero) ;\\n\"\n        \"2) si absente → annuaire_externe(numero) ;\\n\"\n        \"3) si toujours absente → demande à la personne son NOM puis son ADRESSE \"\n        \"(demander_a_la_personne), puis creer_fiche(numero, nom, adresse).\\n\"\n        \"Termine par une phrase d'accueil personnalisée, en disant d'où vient la \"\n        \"fiche (base locale, CRM, ou fiche créée à l'instant).\"))\n\n    @agent.tool\n    def fiche_locale(numero: str) -> dict:\n        \"\"\"Cherche l'appelant dans la base LOCALE.\"\"\"\n        f = FICHES_LOCALES.get(numero)\n        print(f\"   [local]    {numero} → {'trouvé' if f else 'inconnu'}\")\n        return {\"trouve\": bool(f), \"fiche\": f}\n\n    @agent.tool\n    def annuaire_externe(numero: str) -> dict:\n        \"\"\"Cherche l'appelant dans l'AUTRE système (CRM externe).\"\"\"\n        f = CRM_EXTERNE.get(numero)\n        print(f\"   [CRM]      {numero} → {'trouvé' if f else 'inconnu'}\")\n        return {\"trouve\": bool(f), \"fiche\": f}\n\n    @agent.tool\n    def demander_a_la_personne(question: str) -> dict:\n        \"\"\"Pose une question à l'appelant et renvoie sa réponse (voix simulée).\"\"\"\n        profil = PERSONNES.get(etat[\"num\"], {})\n        q = question.lower()\n        if any(w in q for w in (\"nom\", \"prénom\", \"appelez\", \"identité\", \"qui\")):\n            rep = profil.get(\"nom\", \"je préfère ne pas dire\")\n        elif any(w in q for w in (\"adresse\", \"habitez\", \"domicile\", \"rue\", \"ville\", \"où\")):\n            rep = profil.get(\"adresse\", \"je ne souhaite pas la donner\")\n        else:\n            rep = \"Pouvez-vous reformuler ?\"\n        print(f\"   [personne] « {question} » → « {rep} »\")\n        return {\"reponse\": rep}\n\n    @agent.tool\n    def creer_fiche(numero: str, nom: str, adresse: str) -> dict:\n        \"\"\"Crée la fiche de l'appelant dans la base LOCALE.\"\"\"\n        FICHES_LOCALES[numero] = {\"nom\": nom, \"adresse\": adresse}\n        print(f\"   [fiche]    créée pour {numero} : {nom} — {adresse}\")\n        return {\"cree\": True, \"fiche\": FICHES_LOCALES[numero]}\n\n    return agent.run(f\"Appel entrant du numéro {numero}. Identifie l'appelant.\").output\n\n\ndef main() -> None:\n    provider = make_provider()\n    for numero, titre in [\n        (\"0611111111\", \"A — numéro CONNU en local\"),\n        (\"0622222222\", \"B — inconnu en local, TROUVÉ dans le CRM externe\"),\n        (\"0633333333\", \"C — inconnu partout → on crée la fiche en discutant\"),\n    ]:\n        print(f\"\\n{'═'*70}\\nAPPEL {titre}\\n{'═'*70}\")\n        print(traiter_appel(provider, numero))\n\n    print(f\"\\n[base locale après les appels : {list(FICHES_LOCALES)}]  \"\n          f\"← le 0633333333 y est maintenant\")\n\n\nif __name__ == \"__main__\":\n    main()\n"},
  {id: "26", file: "26_resultat_trop_gros.py", label: "26 · Le résultat trop gros (code seul)", note: "La butée 1 MESURÉE : même outil, même prompt, deux runs — seul max_tool_result_chars change. 41 597 → 4 000 caractères, 17 993 → 2 453 jetons, et la réponse reste juste parce que la coupe est au MILIEU (le bilan est à la dernière ligne du journal).", code: "\"\"\"26 — Le résultat trop gros : la borne est du code, et elle coupe au MILIEU.\n\nLa démo de la première butée. Un seul outil, un seul prompt, deux runs —\nla seule différence entre les deux tient dans un argument :\n\n    Agent(...)                                 # run A : rien ne borne\n    Agent(..., max_tool_result_chars=4000)     # run B : la butée est vissée\n\nCe que la démo prouve, dans l'ordre :\n\n  1. Un outil non borné injecte TOUT dans la conversation. Ici 40 000\n     caractères pour une question dont la réponse fait deux lignes. Le prix\n     est en jetons, et il est réel — la démo l'affiche.\n\n  2. La borne n'est pas une consigne, c'est une fonction Python. Le modèle\n     ne peut pas la dépasser en insistant.\n\n  3. Elle coupe au MILIEU, et c'est là que tout se joue. Le bilan du journal\n     est à la DERNIÈRE ligne. Une coupe naïve (les 4 000 premiers caractères)\n     le perdrait, et l'agent répondrait faux avec aplomb. La coupe milieu\n     garde la tête — la forme des données — ET la queue — les totaux.\n\n  4. La marque de coupure compte dans le budget. Une limite qu'on peut\n     dépasser n'est pas une limite : la démo vérifie len() <= 4000.\n\n    python examples_autoagent/26_resultat_trop_gros.py\n\"\"\"\n\nfrom __future__ import annotations\n\nfrom _common import load_env        # lit .env — seul emprunt à l'utilitaire\n\nfrom autoagent import Agent, ModelConfig, create_provider\n\nload_env()\n\n# ── UNE ligne à changer, et rien d'autre dans tout le fichier. ───────────────\nCONFIG = ModelConfig(provider=\"deepseek\",  model=\"deepseek-chat\")\n# CONFIG = ModelConfig(provider=\"gemini\",    model=\"gemini-3.7-flash\")\n# CONFIG = ModelConfig(provider=\"openai\",    model=\"gpt-4o-mini\")\n# CONFIG = ModelConfig(provider=\"anthropic\", model=\"claude-sonnet-4-5\")\n\n\ndef _n(valeur: int) -> str:\n    \"\"\"Milliers séparés par une espace, sans toucher à la ponctuation.\"\"\"\n    return f\"{valeur:,}\".replace(\",\", \" \")\n\n\nBORNE = 4_000          # la valeur conseillée par la doc (§24.1)\nQUESTION = (\"Lis le journal du collecteur, puis réponds en deux lignes : \"\n            \"combien d'ERROR au total, et quelle erreur revient le plus souvent ?\")\n\n\n# ── Le journal : gros, réaliste, et son bilan est à la FIN ───────────────────\ndef _journal() -> str:\n    \"\"\"400 lignes de journal. Les totaux sont dans les trois dernières.\"\"\"\n    lignes = [\n        \"# collecteur-mobilite v4.2 — journal d'exécution\",\n        \"# horodatage | niveau | capteur | message\",\n    ]\n    erreurs = 0\n    for i in range(400):\n        minute, seconde = divmod(i * 7, 60)\n        heure = f\"2026-08-19T14:{minute % 60:02d}:{seconde:02d}\"\n        capteur = f\"cmp-lyo-{i % 12:02d}\"\n        if i % 11 == 3:                                  # l'erreur dominante\n            erreurs += 1\n            lignes.append(f\"{heure} | ERROR | cmp-lyo-07 | timeout après 30 s \"\n                          f\"sur la lecture du compteur, tentative {i % 4 + 1}/4\")\n        elif i % 37 == 5:                                # une erreur rare\n            erreurs += 1\n            lignes.append(f\"{heure} | ERROR | {capteur} | connexion refusée par \"\n                          f\"postgres:5432 (pool saturé, 40/40 connexions)\")\n        else:\n            lignes.append(f\"{heure} | INFO  | {capteur} | 1 240 passages agrégés, \"\n                          f\"latence 42 ms, file d'attente vide\")\n    lignes += [\n        \"# ─── BILAN DE L'EXÉCUTION ───\",\n        f\"# ERROR total : {erreurs}\",\n        \"# erreur la plus fréquente : timeout cmp-lyo-07\",\n    ]\n    return \"\\n\".join(lignes)\n\n\nJOURNAL = _journal()\n\n\ndef _construire(borne: int | None) -> Agent:\n    \"\"\"Le même agent, le même outil. Seule la borne change.\"\"\"\n    agent = Agent(create_provider(CONFIG), max_tool_result_chars=borne)\n\n    @agent.tool(description=\"Renvoie le journal complet du collecteur.\")\n    def lire_journal() -> str:\n        return JOURNAL\n\n    return agent\n\n\ndef _mesurer(resultat) -> tuple[int, str]:\n    \"\"\"Longueur du message d'outil réellement injecté, et son contenu.\"\"\"\n    for message in resultat.messages:\n        if message.role == \"tool\":\n            return len(message.content), message.content\n    return 0, \"\"\n\n\ndef main() -> None:\n    print(f\"Journal produit : {_n(len(JOURNAL))} caractères, \"\n          f\"{JOURNAL.count(chr(10)) + 1} lignes\")\n    print(f\"Le bilan est à la DERNIÈRE ligne : {JOURNAL.splitlines()[-1]}\")\n    print(f\"Modèle : {CONFIG.provider} / {CONFIG.model}\")\n    print()\n\n    mesures = {}\n    for etiquette, borne in ((\"A · sans borne\", None), (f\"B · borne à {BORNE}\", BORNE)):\n        print(\"─\" * 74)\n        print(f\"RUN {etiquette}\")\n        resultat = _construire(borne).run(QUESTION)\n        taille, contenu = _mesurer(resultat)\n        jetons = resultat.usage.total_tokens if resultat.usage else None\n        mesures[etiquette] = (taille, jetons)\n\n        print(f\"  injecté dans la conversation : {_n(taille)} caractères\")\n        print(f\"  jetons du run                : \"\n              f\"{_n(jetons) if jetons is not None else 'non rapportés'}\")\n        if \"[TRUNCATED\" in contenu:\n            marque = [l for l in contenu.splitlines() if \"[TRUNCATED\" in l][0]\n            print(f\"  marque au milieu             : {marque.strip()}\")\n            assert taille <= BORNE, \"la borne a été dépassée — ce serait un bug\"\n            print(f\"  borne respectée              : {taille} <= {BORNE} ✓\")\n        print(f\"  réponse du modèle            : \"\n              f\"{' / '.join(resultat.output.split(chr(10))[:2])}\")\n        print()\n\n    (ta, ja), (tb, jb) = mesures[\"A · sans borne\"], mesures[f\"B · borne à {BORNE}\"]\n    print(\"─\" * 74)\n    print(\"CE QU'IL FAUT RETENIR\")\n    print()\n    print(f\"  Le même outil a injecté {_n(ta)} caractères, puis {_n(tb)}.\")\n    if ja and jb:\n        print(f\"  Le même travail a coûté {_n(ja)} jetons, puis {_n(jb)} \"\n              f\"— soit {100 - round(jb / ja * 100)} % de moins.\")\n    print()\n    print(\"  Et la réponse reste juste dans le run B, parce que la coupe est au\")\n    print(\"  MILIEU : le bilan de la dernière ligne a survécu. Une coupe qui\")\n    print(\"  garde les 4 000 premiers caractères aurait perdu les totaux, et\")\n    print(\"  l'agent aurait répondu faux — sans jamais le signaler.\")\n    print()\n    print(\"  Enfin : ce n'est pas une consigne dans le prompt. C'est un argument\")\n    print(\"  de constructeur. Le modèle ne peut pas l'ignorer, il ne le voit même\")\n    print(\"  pas — il reçoit un résultat déjà borné, avec une marque qui lui dit\")\n    print(\"  d'affiner sa requête.\")\n\n\nif __name__ == \"__main__\":\n    main()\n"},
  {id: "27", file: "27_cache_de_prompt.py", label: "27 · Le cache de prompt, mesuré", note: "La même question trois fois, préfixe stable ~6 800 jetons. Run 1 : le cache s'écrit (« inconnu », pas « zéro »). Runs 2–3 : 4 073 / 6 847 servis par le cache. Non reproductible à volonté sur Gemini (cache opportuniste) ; déterministe sur DeepSeek (0 mesuré puis 100 %).", code: "\"\"\"27 — Le cache de prompt : la même question, trois fois, de moins en moins chère.\n\nUn agent n'a pas de mémoire : à CHAQUE tour, on lui renvoie tout — le prompt\nsystème, les schémas de tous ses outils, et l'historique. Sur un run de huit\nétapes, le même préfixe part donc huit fois.\n\nLes fournisseurs savent servir ce préfixe depuis un cache. La démo montre les\ntrois choses qu'il faut avoir comprises :\n\n  1. LE PREMIER RUN NE GAGNE RIEN. Le cache s'écrit ; il n'y a rien à lire.\n     Le fournisseur ne rapporte pas de part servie — on affiche « inconnu »,\n     pas « zéro ». Les deux ne veulent pas dire la même chose.\n\n  2. LES SUIVANTS PAIENT MOINS. La part servie par le cache apparaît, et le\n     taux avec. C'est mesuré, pas estimé.\n\n  3. L'ENTRÉE TOTALE NE BOUGE PAS. Le cache est un SOUS-ENSEMBLE de l'entrée,\n     jamais un ajout — sinon on facturerait deux fois les mêmes jetons. La\n     démo le vérifie par une assertion.\n\nLe préfixe doit être STABLE et assez GROS : chaque fournisseur a un seuil\nminimal en dessous duquel il ne met rien en cache. Un prompt système qui\nchange à chaque appel (une date, un identifiant) ne sera jamais mis en cache.\n\nMAIS ces deux conditions ne SUFFISENT PAS, et c'est le point le moins connu :\nchez Gemini et OpenAI le cache est IMPLICITE — le fournisseur décide seul,\nsans garantie. Mesuré sur ce dépôt : le même préfixe de 7 026 jetons a mordu\nsur un appel et pas sur le suivant, et un préfixe de 9 366 jetons n'a rien\ndonné là où un de 14 046 marchait. Cette démo peut donc afficher « inconnu »\npartout un jour et 59 % le lendemain, sans qu'une li
