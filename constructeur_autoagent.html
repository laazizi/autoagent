<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Constructeur autoagent — assemble ton agent, récupère le code Python</title>
<style>
  /* ── Type : choix délibéré de stacks système (aucune police CDN, aucun
       fallback silencieux). Grotesque système pour l'UI, mono native pour
       tout ce qui est code — cohérent avec un outil de dev. ── */
  :root{
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, "Cascadia Code", "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;

    /* Neutres biaisés bleu (choisis, pas hérités) */
    --bg:        #10131c;
    --panel:     #171b28;
    --panel-2:   #1e2333;
    --line:      #2b3145;
    --line-soft: #232838;
    --ink:       #e8ebf4;
    --ink-soft:  #a3abc2;
    --ink-faint: #6b7488;

    /* Couleurs de catégorie = carte des modules (teintes bijou sourdes, même famille) */
    --c-core:  #6172f3;  /* Agent — la colonne vertébrale */
    --c-tool:  #d9922b;  /* Outils */
    --c-safe:  #35a86e;  /* Workspace — les garde-fous */
    --c-mem:   #9b6cf2;  /* Mémoire */
    --c-trace: #33a0c4;  /* Trace — observabilité */
    --c-multi: #d75a86;  /* Sous-agent — multi-agent */
    --c-hook:  #e07b3c;  /* Vérification */
    --c-flow:  #5b7a99;  /* Orchestrator — flux piloté par l'hôte */
    --c-run:   #17a89a;  /* Lancer */

    --shadow: 0 1px 0 rgba(255,255,255,.03), 0 10px 30px rgba(0,0,0,.35);
    --radius: 12px;
  }
  @media (prefers-color-scheme: light){
    :root{
      --bg:#eef0f5; --panel:#ffffff; --panel-2:#f4f6fb; --line:#d5dae6;
      --line-soft:#e4e8f1; --ink:#1a1f2e; --ink-soft:#4b5468; --ink-faint:#8892a6;
      --shadow: 0 1px 2px rgba(20,25,40,.06), 0 12px 28px rgba(30,40,70,.10);
    }
  }
  :root[data-theme="dark"]{
    --bg:#10131c; --panel:#171b28; --panel-2:#1e2333; --line:#2b3145;
    --line-soft:#232838; --ink:#e8ebf4; --ink-soft:#a3abc2; --ink-faint:#6b7488;
    --shadow: 0 1px 0 rgba(255,255,255,.03), 0 10px 30px rgba(0,0,0,.35);
  }
  :root[data-theme="light"]{
    --bg:#eef0f5; --panel:#ffffff; --panel-2:#f4f6fb; --line:#d5dae6;
    --line-soft:#e4e8f1; --ink:#1a1f2e; --ink-soft:#4b5468; --ink-faint:#8892a6;
    --shadow: 0 1px 2px rgba(20,25,40,.06), 0 12px 28px rgba(30,40,70,.10);
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:var(--sans); font-size:14px; line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{margin:0; text-wrap:balance}
  button{font-family:inherit; cursor:pointer}
  a{color:var(--c-core)}

  /* ── En-tête ── */
  header{
    display:flex; align-items:center; gap:16px; flex-wrap:wrap;
    padding:14px 20px; border-bottom:1px solid var(--line);
    background:linear-gradient(180deg, var(--panel), var(--panel-2));
  }
  .brand{display:flex; align-items:baseline; gap:12px; margin-right:auto}
  .brand .logo{
    font-family:var(--mono); font-weight:700; letter-spacing:-.5px;
    font-size:19px; color:var(--ink);
    padding:3px 9px; border:1px solid var(--line); border-radius:8px;
    background:var(--bg);
  }
  .brand .logo b{color:var(--c-core)}
  .brand .tag{color:var(--ink-soft); font-size:13px}
  .toolbar{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
  .btn{
    background:var(--panel-2); color:var(--ink); border:1px solid var(--line);
    padding:7px 12px; border-radius:8px; font-size:13px; font-weight:600;
    transition:border-color .15s, background .15s, transform .05s;
  }
  .btn:hover{border-color:var(--ink-faint)}
  .btn:active{transform:translateY(1px)}
  .btn.primary{background:var(--c-core); border-color:var(--c-core); color:#fff}
  .btn.ghost{background:transparent}
  .btn:focus-visible, .chip:focus-visible, .field :focus-visible, .paletteItem:focus-visible{
    outline:2px solid var(--c-core); outline-offset:2px;
  }
  .sel-theme{display:flex; gap:2px; border:1px solid var(--line); border-radius:8px; overflow:hidden}
  .sel-theme button{background:var(--panel-2); border:0; padding:7px 10px; font-size:12px; color:var(--ink-soft)}
  .sel-theme button[aria-pressed="true"]{background:var(--c-core); color:#fff}
  .sel-theme button:not([disabled]){cursor:pointer}
  .sel-theme button[disabled]{opacity:.4; cursor:not-allowed}
  .menu-wrap{position:relative}
  #preset-btn{white-space:nowrap}
  .menu{
    position:absolute; top:calc(100% + 4px); left:0; z-index:150;
    min-width:250px; max-height:70vh; overflow-y:auto;
    background:var(--panel); border:1px solid var(--line); border-radius:10px;
    box-shadow:var(--shadow); padding:6px; display:none;
  }
  .menu.open{display:block}
  .menu-item{
    display:block; width:100%; text-align:left; background:transparent; border:0;
    color:var(--ink); padding:8px 10px; border-radius:7px; font-size:13px; font-weight:600;
    white-space:nowrap;
  }
  .menu-item:hover, .menu-item:focus-visible{background:var(--panel-2); outline:none}

  /* ── Grille principale ── */
  main{
    display:grid; grid-template-columns:270px minmax(320px,1fr) minmax(340px,1fr);
    gap:0; height:calc(100vh - 61px); min-height:480px;
  }
  .col{display:flex; flex-direction:column; min-width:0; min-height:0}
  .col + .col{border-left:1px solid var(--line)}
  .col-head{
    padding:12px 16px; border-bottom:1px solid var(--line-soft);
    display:flex; align-items:center; gap:8px; flex-shrink:0;
  }
  .col-head h2{font-size:12px; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-soft); font-weight:700}
  .col-head .hint{font-size:11.5px; color:var(--ink-faint); margin-left:auto}
  .col-body{overflow-y:auto; padding:14px; flex:1; min-height:0}

  /* ── Palette ── */
  .cat{margin-bottom:16px}
  .cat h3{
    font-size:11px; letter-spacing:.08em; text-transform:uppercase;
    color:var(--ink-faint); font-weight:700; margin-bottom:8px; padding-left:2px;
  }
  .paletteItem{
    display:flex; align-items:center; gap:10px; width:100%; text-align:left;
    background:var(--panel-2); border:1px solid var(--line); border-left:4px solid var(--cat);
    border-radius:9px; padding:9px 11px; margin-bottom:7px; color:var(--ink);
    transition:transform .06s, border-color .15s, box-shadow .15s;
  }
  .paletteItem:hover{border-color:var(--cat); box-shadow:0 3px 12px rgba(0,0,0,.18)}
  .paletteItem:active{cursor:grabbing}
  .paletteItem[aria-disabled="true"]{opacity:.4; pointer-events:none}
  .paletteItem .pi-name{font-weight:700; font-size:13px}
  .paletteItem .pi-sub{font-size:11px; color:var(--ink-faint); display:block; margin-top:1px}
  /* Glyphe SVG par catégorie : une petite icône colorée, plus parlante qu'un point */
  .paletteItem .pi-glyph{
    width:30px; height:30px; flex-shrink:0; border-radius:8px;
    display:grid; place-items:center;
    background:color-mix(in srgb, var(--cat) 16%, transparent);
    border:1px solid color-mix(in srgb, var(--cat) 40%, var(--line));
  }
  .paletteItem .pi-glyph svg{width:17px; height:17px; stroke:var(--cat); fill:none;
    stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round}
  .paletteItem .pi-glyph svg .fillcat{fill:var(--cat); stroke:none}
  .paletteItem:hover .pi-glyph{background:color-mix(in srgb, var(--cat) 26%, transparent)}
  .paletteItem .txt{min-width:0}
  .wire-note{
    font-size:11.5px; color:var(--ink-soft); background:var(--panel-2);
    border:1px dashed var(--line); border-radius:9px; padding:10px 12px; line-height:1.55;
  }
  .wire-note b{color:var(--ink)}

  /* Icône info + infobulle */
  .pi-wrap{position:relative}
  .pi-wrap .paletteItem{padding-right:30px}
  .pi-info{
    position:absolute; top:8px; right:9px; width:17px; height:17px; border-radius:50%;
    display:grid; place-items:center; font-size:11px; font-weight:700; font-family:var(--mono);
    color:var(--ink-faint); border:1px solid var(--line); background:var(--bg); cursor:help; z-index:3;
    transition:color .12s, background .12s, border-color .12s;
  }
  .pi-info:hover, .pi-info:focus-visible{color:#fff; background:var(--cat); border-color:var(--cat); outline:none}
  #tt{
    position:fixed; z-index:200; max-width:264px; background:var(--panel); color:var(--ink);
    border:1px solid var(--line); border-left:3px solid var(--cat); border-radius:10px;
    padding:11px 13px; box-shadow:var(--shadow); font-size:12px; line-height:1.5;
    opacity:0; pointer-events:none; transition:opacity .12s;
  }
  #tt.show{opacity:1}
  #tt b{display:block; font-size:12.5px; margin-bottom:2px; color:var(--ink)}
  #tt .api{display:block; font-family:var(--mono); font-size:10.5px; color:var(--cat); margin-bottom:7px; word-break:break-word}
  #tt p{margin:0; color:var(--ink-soft)}

  /* ── Canvas / stack ── */
  #stack{display:flex; flex-direction:column; gap:0; min-height:100%}
  .drop-empty{
    border:2px dashed var(--line); border-radius:var(--radius);
    padding:34px 20px; text-align:center; color:var(--ink-faint); font-size:13px;
  }
  .drop-empty strong{color:var(--ink-soft); display:block; margin-bottom:4px; font-size:14px}

  /* ── Aperçu d'insertion : un "slot" qui montre où et QUOI on dépose ── */
  .slot{
    display:flex; align-items:center; gap:8px;
    border:2px dashed var(--slotcat, var(--c-core)); border-radius:var(--radius);
    background:color-mix(in srgb, var(--slotcat, var(--c-core)) 10%, transparent);
    color:var(--slotcat, var(--c-core)); font-weight:700; font-size:12.5px;
    padding:12px 14px; margin:6px 0; animation:slotIn .14s ease;
  }
  .slot .slot-dot{width:10px; height:10px; border-radius:50%; background:var(--slotcat, var(--c-core))}
  .slot .slot-arrow{margin-left:auto; font-size:15px; opacity:.7}
  @keyframes slotIn{from{opacity:0; transform:scaleY(.4)} to{opacity:1; transform:scaleY(1)}}

  .block{
    position:relative;
    background:var(--panel); border:1px solid var(--line);
    border-left:5px solid var(--cat); border-radius:var(--radius);
    margin-bottom:22px; box-shadow:var(--shadow); overflow:visible;
    transition:margin .16s ease, box-shadow .16s ease, transform .16s ease;
  }
  /* Connecteur de flux : une flèche verticale reliant chaque bloc au précédent */
  .block:not(:first-child)::before{
    content:"▾"; position:absolute; top:-19px; left:50%; transform:translateX(-50%);
    color:var(--ink-faint); font-size:14px; line-height:1; pointer-events:none;
  }
  .block:not(:first-child)::after{
    content:""; position:absolute; top:-22px; left:50%; width:2px; height:11px;
    transform:translateX(-50%); background:var(--line); pointer-events:none;
  }
  .block .block-head{overflow:hidden; border-top-left-radius:var(--radius); border-top-right-radius:var(--radius)}
  .block.dragging{opacity:.4; transform:scale(.98)}
  /* Voisins du point d'insertion : on les écarte et on les met en évidence */
  .block.neighbor-before{margin-bottom:40px; box-shadow:0 6px 18px color-mix(in srgb, var(--cat) 30%, transparent)}
  .block.neighbor-after{margin-top:18px; box-shadow:0 -6px 18px color-mix(in srgb, var(--cat) 30%, transparent)}
  .block.neighbor-before, .block.neighbor-after{border-color:var(--cat)}
  .block-head{
    display:flex; align-items:center; gap:9px; padding:9px 11px;
    background:linear-gradient(90deg, color-mix(in srgb, var(--cat) 14%, transparent), transparent 70%);
    border-bottom:1px solid var(--line-soft);
  }
  .grip{cursor:grab; color:var(--ink-faint); font-size:15px; line-height:1; padding:2px; letter-spacing:-2px}
  .grip:active{cursor:grabbing}
  .block-head .b-name{font-weight:700; font-size:13.5px}
  .block-head .b-cat{
    font-family:var(--mono); font-size:10.5px; color:var(--cat);
    border:1px solid color-mix(in srgb, var(--cat) 45%, var(--line));
    padding:1px 6px; border-radius:20px; font-weight:600;
  }
  .block-head .b-actions{margin-left:auto; display:flex; gap:3px}
  .icon-btn{
    background:transparent; border:1px solid transparent; color:var(--ink-faint);
    border-radius:6px; width:26px; height:26px; font-size:14px; line-height:1;
    display:grid; place-items:center;
  }
  .icon-btn:hover{background:var(--panel-2); color:var(--ink); border-color:var(--line)}
  .icon-btn.danger:hover{color:#ff6b6b}
  .block-body{padding:11px 12px; display:grid; gap:10px}
  .field{display:flex; flex-direction:column; gap:4px}
  .field.row{flex-direction:row; align-items:center; gap:8px}
  .field label{font-size:11px; color:var(--ink-soft); font-weight:600; letter-spacing:.02em}
  .field .f-hint{font-size:10.5px; color:var(--ink-faint)}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px}
  .grid3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px}
  input[type=text], input[type=number], textarea, select{
    background:var(--bg); color:var(--ink); border:1px solid var(--line);
    border-radius:7px; padding:7px 9px; font-size:12.5px; font-family:var(--mono);
    width:100%; resize:vertical;
  }
  input:focus, textarea:focus, select:focus{outline:2px solid var(--c-core); outline-offset:0; border-color:var(--c-core)}
  textarea{line-height:1.45; min-height:56px}
  .field.check{flex-direction:row; align-items:center; gap:8px}
  .field.check input{width:auto}
  .field.check label{font-size:12.5px; color:var(--ink)}

  /* ── Code ── */
  .code-wrap{flex:1; min-height:0; display:flex; flex-direction:column}
  .code-scroll{flex:1; overflow:auto; min-height:0}
  pre#code{
    margin:0; padding:16px 18px; font-family:var(--mono); font-size:12.5px;
    line-height:1.65; tab-size:4; white-space:pre; color:var(--ink);
  }
  .tok-kw{color:#c678dd} .tok-str{color:#98c379} .tok-com{color:var(--ink-faint); font-style:italic}
  .tok-num{color:#d19a66} .tok-dec{color:#e5c07b} .tok-def{color:#61afef} .tok-cls{color:#e5c07b}
  @media (prefers-color-scheme: light){
    .tok-kw{color:#a626a4} .tok-str{color:#3a8a1f} .tok-num{color:#b26a00}
    .tok-dec{color:#986801} .tok-def{color:#3a6dd0} .tok-cls{color:#986801}
  }
  :root[data-theme="light"] .tok-kw{color:#a626a4}
  :root[data-theme="light"] .tok-str{color:#3a8a1f}
  :root[data-theme="light"] .tok-num{color:#b26a00}
  :root[data-theme="light"] .tok-dec{color:#986801}
  :root[data-theme="light"] .tok-def{color:#3a6dd0}
  :root[data-theme="light"] .tok-cls{color:#986801}
  :root[data-theme="dark"] .tok-kw{color:#c678dd}
  :root[data-theme="dark"] .tok-str{color:#98c379}

  .run-cmd{
    padding:9px 16px; border-top:1px solid var(--line-soft); background:var(--panel-2);
    font-family:var(--mono); font-size:11.5px; color:var(--ink-soft);
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  }
  .run-cmd .k{color:var(--c-safe); font-weight:700}
  /* Panneau « Sortie » : une exécution RÉELLE du preset, jamais un exemple
     rédigé. Il disparaît dès qu'on modifie les blocs — on n'a pas exécuté
     ce code-là, donc on ne montre rien. */
  .sortie{
    border-top:1px solid var(--line-soft); background:var(--panel-2);
    display:flex; flex-direction:column; min-height:0; max-height:38%;
  }
  .sortie[hidden]{display:none}
  .sortie-h{display:flex; align-items:baseline; gap:10px; padding:9px 16px 5px}
  .sortie-h .lbl{
    font-size:11px; letter-spacing:.09em; text-transform:uppercase;
    font-weight:700; color:var(--c-safe);
  }
  .sortie-h .meta{font-size:11px; color:var(--ink-faint); margin-left:auto; text-align:right; line-height:1.5}
  .sortie-h .meta .nuance{font-size:10.5px; opacity:.85}
  .sortie-h .meta code{font-family:var(--mono); font-size:10px}
  .sortie pre{
    margin:0; padding:0 16px 13px; overflow:auto; min-height:0;
    font-family:var(--mono); font-size:11.5px; line-height:1.55;
    color:var(--ink); white-space:pre-wrap; word-break:break-word;
  }
  .sortie.vide pre{color:var(--ink-faint); font-style:italic}
  /* « Agrandir » : le code et la sortie sont à l'étroit dans leur colonne.
     Un bouton par panneau le passe en plein écran, sans rien changer sinon. */
  .agrandir{
    flex:none; margin-left:10px; border:1px solid var(--line); border-radius:6px;
    background:var(--panel-2); color:var(--ink-soft); cursor:pointer;
    font-size:13px; line-height:1; padding:4px 8px;
  }
  .agrandir:hover{color:var(--ink); border-color:var(--ink-faint)}
  .agrandir:focus-visible{outline:2px solid var(--c-core); outline-offset:2px}
  .fond-zoom{
    position:fixed; inset:0; z-index:59; background:rgba(0,0,0,.55);
    backdrop-filter:blur(2px);
  }
  .fond-zoom[hidden]{display:none}
  .zoome{
    position:fixed !important; inset:22px; z-index:60; max-height:none !important;
    border:1px solid var(--line); border-radius:12px; background:var(--panel);
    box-shadow:0 24px 70px rgba(0,0,0,.5); overflow:hidden;
    display:flex; flex-direction:column;
  }
  .zoome .code-scroll{max-height:none}
  .zoome pre{max-height:none}
  .indice-zoom{
    position:fixed; z-index:61; right:34px; bottom:34px; font-size:11.5px;
    color:var(--ink-faint); background:var(--panel-2); border:1px solid var(--line);
    border-radius:20px; padding:5px 12px; pointer-events:none;
  }
  .indice-zoom[hidden]{display:none}
  .toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--ink); color:var(--bg); padding:9px 16px; border-radius:8px;
    font-weight:600; font-size:13px; opacity:0; pointer-events:none; transition:.25s;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0)}

  /* ── Groupes repliables dans un bloc : l'essentiel visible, le reste à portée ── */
  details.grp{border:1px solid var(--line-soft); border-radius:8px; background:var(--panel-2)}
  details.grp summary{
    cursor:pointer; list-style:none; display:flex; align-items:center; gap:8px;
    padding:7px 10px; font-size:11.5px; font-weight:700; color:var(--ink-soft); letter-spacing:.02em;
  }
  details.grp summary::-webkit-details-marker{display:none}
  details.grp summary::before{content:"▸"; font-size:11px; color:var(--ink-faint); transition:transform .12s}
  details.grp[open] summary::before{transform:rotate(90deg)}
  details.grp summary .grp-n{
    margin-left:auto; font-family:var(--mono); font-weight:600; font-size:10.5px;
    color:var(--cat); border:1px solid color-mix(in srgb, var(--cat) 45%, var(--line));
    border-radius:20px; padding:0 7px;
  }
  details.grp summary .grp-n.zero{color:var(--ink-faint); border-color:var(--line)}
  details.grp .grp-body{padding:4px 10px 10px; display:grid; gap:10px}
  /* ── Diagnostic : ce que l'assemblage fait vraiment, et ce qui est ignoré ── */
  .diag{border-bottom:1px solid var(--line-soft); padding:8px 16px; display:grid; gap:4px; font-size:12px; background:var(--panel-2)}
  .diag[hidden]{display:none}
  .diag div{display:flex; gap:8px; align-items:baseline; color:var(--ink-soft); line-height:1.45}
  .diag div::before{content:""; width:8px; height:8px; border-radius:50%; flex:none; position:relative; top:1px; background:var(--ink-faint)}
  .diag .warn::before{background:#e0a03c}
  .diag .ok::before{background:var(--c-safe)}
  .diag .warn{color:var(--ink)}
  .ver{font-family:var(--mono); font-size:11px; color:var(--ink-faint); border:1px solid var(--line); border-radius:20px; padding:1px 8px; align-self:center}
  #filtre{
    margin-left:auto; width:118px; font-family:var(--sans); font-size:11.5px; padding:4px 8px;
    background:var(--bg); color:var(--ink); border:1px solid var(--line); border-radius:6px;
  }
  #filtre:focus{outline:2px solid var(--c-core); outline-offset:0}
  .pi-wrap.masque{display:none}
  .cat.vide{display:none}
  pre#code.wrap{white-space:pre-wrap; word-break:break-word}
  .menu-sep{padding:7px 10px 3px; font-size:10.5px; letter-spacing:.07em; text-transform:uppercase; color:var(--ink-faint); font-weight:700; border-top:1px solid var(--line-soft); margin-top:4px}
  .menu-sep:first-child{border-top:0; margin-top:0}

<body>
<header>
  <div class="brand">
    <span class="logo">auto<b>agent</b></span>
    <span class="tag">Constructeur visuel — assemble des blocs, récupère le code Python</span>
    <span class="ver" id="lib-ver"></span>
  </div>
  <div class="toolbar">
    <div class="menu-wrap">
      <button class="btn ghost" id="preset-btn" aria-haspopup="true" aria-expanded="false">Charger un exemple ▾</button>
      <div class="menu" id="preset-menu" role="menu"></div>
    </div>
    <div class="sel-theme" role="group" aria-label="Format du code généré">
      <button id="mode-script" aria-pressed="true" title="Un script exécutable directement (agent.run + __main__)">Script autonome</button>
      <button id="mode-integ" aria-pressed="false" title="Une fonction build_agent() à importer dans ton app (sans run ni __main__)">Fonction à intégrer</button>
    </div>
    <button class="btn ghost" id="clear">Vider</button>
    <button class="btn" id="copy">Copier le code</button>
    <button class="btn primary" id="download">Télécharger .py</button>
    <div class="sel-theme" role="group" aria-label="Thème">
      <button id="th-light" aria-pressed="false">Clair</button>
      <button id="th-dark" aria-pressed="false">Sombre</button>
    </div>
  </div>
</header>

<main>
  <!-- Palette -->
  <section class="col" aria-label="Palette de modules">
    <div class="col-head"><h2>Modules</h2><input id="filtre" type="search" placeholder="filtrer…" aria-label="Filtrer les modules" autocomplete="off"></div>
    <div class="col-body" id="palette"></div>
  </section>

  <!-- Assemblage -->
  <section class="col" aria-label="Assemblage">
    <div class="col-head"><h2>Ton agent</h2><span class="hint">l'ordre d'exécution est câblé pour toi</span></div>
    <div class="col-body">
      <div id="stack" aria-live="polite"></div>
    </div>
  </section>

  <!-- Code -->
  <section class="col" aria-label="Code généré">
    <div class="col-head"><h2>Code Python</h2><span class="hint" id="loc-count"></span><button class="agrandir" id="wrap-code" type="button" title="Retour à la ligne automatique du code" aria-pressed="false">↵</button><button class="agrandir" id="zoom-code" type="button" title="Agrandir le code (Échap pour fermer)" aria-label="Agrandir le code">⤢</button></div>
    <div class="code-wrap">
      <div class="diag" id="diag" hidden aria-live="polite"></div>
      <div class="code-scroll"><pre id="code"></pre></div>
      <div class="run-cmd" id="run-cmd"></div>
      <div class="sortie" id="sortie" hidden>
        <div class="sortie-h"><span class="lbl">Sortie</span><span class="meta" id="sortie-meta"></span><button class="agrandir" id="zoom-sortie" type="button" title="Agrandir la sortie (Échap pour fermer)" aria-label="Agrandir la sortie">⤢</button></div>
        <pre id="sortie-txt"></pre>
      </div>
    </div>
  </section>
</main>

<div class="fond-zoom" id="fond-zoom" hidden></div>
<div class="indice-zoom" id="indice-zoom" hidden>Échap pour refermer</div>
<div class="toast" id="toast"></div>

let stack = [];
let uid = 1;
let insertIdx = null;          // position d'insertion pendant un drag
let dragging = null;           // {label, cat} du module en cours de glissement (pour l'aperçu)
let codeMode = "script";       // "script" (autonome) | "integration" (fonction build_agent)

function defaults(type){
  const f = {};
  for(const fld of DEFS[type].fields) f[fld.k] = fld.def;
  return f;
}
function addBlock(type, at){
  const def = DEFS[type];
  if(def.one && stack.some(b=>b.type===type)) return;
  const block = {id:uid++, type, f:defaults(type)};
  if(at==null || at>stack.length) stack.push(block); else stack.splice(at,0,block);
  render();
}
function removeBlock(id){ stack = stack.filter(b=>b.id!==id); render(); }
function moveBlock(id, dir){
  const i = stack.findIndex(b=>b.id===id); if(i<0) return;
  const j = i+dir; if(j<0||j>=stack.length) return;
  [stack[i],stack[j]]=[stack[j],stack[i]]; render();
}

/* ══════════════════════════════════════════════════════════════════════
   3. GÉNÉRATION DU CODE PYTHON
      L'ordre d'assemblage est libre ; on émet TOUJOURS dans l'ordre de
      dépendance correct — c'est ça, « presque prêt à l'emploi ».
   ══════════════════════════════════════════════════════════════════════ */
function pyStr(s){ return JSON.stringify(String(s ?? "")); }         // littéral sûr 1 ligne
function pyLines(s, indent){                                          // multi-ligne joli (concat implicite)
  const parts = String(s ?? "").split("\n");
  const pad = " ".repeat(indent);
  // Une seule ligne, mais longue : coupée aux espaces (~76 colonnes) en
  // concaténation implicite — le code se lit sans défiler à droite.
  if(parts.length===1){
    if(parts[0].length <= 84) return pyStr(parts[0]);
    const morceaux = []; let cur = "";
    for(const m of parts[0].split(/(?<=\s)/)){ if(cur && (cur+m).length > 76){ morceaux.push(cur); cur=""; } cur += m; }
    if(cur) morceaux.push(cur);
    return "(\n" + morceaux.map(p=>pad+"    "+pyStr(p)).join("\n") + "\n"+pad+")";
  }
  // Plusieurs lignes : chaque morceau garde SON retour à la ligne (la
  // concaténation implicite ne les ajoute pas).
  return "(\n" + parts.map((p,k)=>pad+"    "+pyStr(p + (k < parts.length-1 ? "\n" : ""))).join("\n") + "\n"+pad+")";
}
function indentBody(body, pad){
  const lines = String(body||"").replace(/\r/g,"").split("\n");
  if(lines.every(l=>l.trim()==="")) return pad+"pass";
  return lines.map(l=> l.trim()==="" ? "" : pad+l).join("\n");
}
function setExt(raw){
  const items = String(raw||"").split(",").map(s=>s.trim()).filter(Boolean)
    .map(e=> e.startsWith(".")?e:"."+e);
  return "{" + items.map(pyStr).join(", ") + "}";
}

function num(v, d){ const n=Number(v); return Number.isFinite(n)?n:d; }
function pyLit(v){                       // valeur JSON → littéral Python
  if(v===null) return "None";
  if(v===true) return "True";
  if(v===false) return "False";
  if(typeof v==="number") return String(v);
  if(typeof v==="string") return pyStr(v);
  if(Array.isArray(v)) return "[" + v.map(pyLit).join(", ") + "]";
  return "{" + Object.entries(v).map(([k,x])=>`${pyStr(k)}: ${pyLit(x)}`).join(", ") + "}";
}
function parsePolicy(raw){               // « outil | action | condition JSON | motif » → règles
  return String(raw||"").split("\n").map(l=>l.trim()).filter(Boolean).map(l=>{
    const p = l.split("|").map(s=>s.trim());
    const r = {tool:p[0]||"*", action:p[1]||"deny", when:null, reason:p[3]||"", err:null};
    if(p[2]){ try{ r.when = JSON.parse(p[2]); }catch(e){ r.err = p[2]; } }
    return r;
  });
}
function orchSteps(raw){
  return String(raw||"").split("\n").map(l=>l.trim()).filter(Boolean).map(l=>{
    const i=l.indexOf("|");
    const id=(i>=0?l.slice(0,i):l).trim();
    const q =(i>=0?l.slice(i+1):"").trim();
    return `    Step(${pyStr(id)}, {"question": ${pyStr(q)}}),`;
  }).join("\n");
}

function parseStages(raw){
  return String(raw||"").split("\n").map(l=>l.trim()).filter(Boolean).map(l=>{
    const i=l.indexOf("|");
    const nom=(i>=0?l.slice(0,i):l).trim().replace(/\s+/g,"_");
    const role=(i>=0?l.slice(i+1):"").trim();
    return [nom, role];
  });
}

function generate(){
  const by = t => stack.filter(b=>b.type===t);
  const agentB = by("agent")[0];
  const orchB  = by("orchestrator")[0];
  const chaineB = by("chaine")[0];
  const parB    = by("parallele")[0];
  const cascSeul = by("cascade")[0];
  const notes = [];                                   // diagnostic montré au-dessus du code
  const note = (lvl, txt) => notes.push({lvl, txt});
  if(!agentB && !orchB && !chaineB && !parB && !cascSeul){
    return {notes, code:"# ← Ajoute un bloc « Agent » (ou « Orchestrator », « Chaîne », « Parallèle ») pour démarrer.\n# Puis empile des outils, une mémoire, une trace, un bac à sable…", env:null, loc:0};
  }
  const a   = agentB ? agentB.f : null;
  const av  = agentB ? (a.var||"agent").trim() : "agent";
  const tools = by("tool");
  const sharedTools = tools.filter(t=>t.f.share);   // outils donnés aussi aux sous-agents
  // Les drapeaux d'un outil suivent l'outil PARTOUT où il est attaché (agent ET sous-agents).
  const flagsOf = t => [t.f.untrusted?"untrusted=True":null, t.f.egress?"egress=True":null, t.f.idempotent?"idempotent=True":null].filter(Boolean);
  const attache = (qui, t) => `${qui}.tool(${(t.f.fname||"outil").trim()}${flagsOf(t).length ? ", "+flagsOf(t).join(", ") : ""})`;
  const ownTools    = tools.filter(t=>!t.f.share);  // outils de l'agent principal seul
  const wss   = by("workspace");
  const subs  = by("subagent");
  const mem   = by("memory")[0];
  const tr    = by("trace")[0];
  const otelB = by("otel")[0];
  const hook  = by("hook")[0];
  const sb    = by("sandbox")[0];
  const dyn   = by("dynamic")[0];
  const mcps  = by("mcp");
  const ckpt  = by("checkpoint")[0];
  const run   = by("run")[0];
  const hasTrace = !!(tr || otelB);   // OTel implique une TraceEmitter, créée au besoin
  const adv   = agentB && !a.routing && ((a.baseurl||"").trim() || (a.keyenv||"").trim());  // provider avancé
  const routing = agentB && a.routing;
  const hasPipeline = !!(chaineB || parB);   // les sous-agents ne sont PAS ajoutés en as_tool si un pipeline pilote

  // — imports du paquet principal —
  const names = new Set();
  if(agentB) names.add("Agent");
  if(chaineB || parB) names.add("Agent");
  if(hasTrace) names.add("TraceEmitter");
  if(otelB) names.add("OTelTraceExporter");
  if(agentB && mcps.length) names.add("MCPClient");
  if(agentB && ckpt) names.add("RunState");
  if(wss.length) names.add("ProjectWorkspace");
  const boundsB = by("bounds")[0], delegB = by("delegation")[0], cascB = by("cascade")[0], synthB = by("synthese")[0];
  const polB = agentB ? by("policy")[0] : null, recB = agentB ? by("record")[0] : null, fiabB = agentB ? by("fiabilite")[0] : null;
  const replay = !!(recB && String(recB.f.mode||"").startsWith("replay"));
  const evoB = agentB ? by("evolution")[0] : null;
  const manifest = (agentB && dyn) ? String(dyn.f.manifest||"").trim() : "";
  const repriseBorne = !!(agentB && run && String(run.f.reprise||"").startsWith("reprendre"));
  let ctxLit = null;
  if(agentB && run && String(run.f.context||"").trim()){
    try{ ctxLit = pyLit(JSON.parse(run.f.context)); }catch(e){ note("warn", "Lancer : contexte hôte JSON invalide, ignoré."); }
  }
  for(const b of stack) if(b.f && b.f.prov==="groq" && ("model" in b.f) && !String(b.f.model||"").trim())
    note("warn", `${DEFS[b.type].name} : renseigne le modèle Groq (aucun défaut connu ici).`);
  const regles = polB ? parsePolicy(polB.f.rules) : [];
  const polApprove = !!(polB && (polB.f.default==="approve" || regles.some(r=>r.action==="approve")));
  const trifApprove = !!(agentB && ((boundsB ? boundsB.f.trifecta : a.trifecta) === "approve"));
  const timeoutS = (run && run.f.timeout!=="" && run.f.timeout!=null) ? num(run.f.timeout, 0) : 0;
  const imagePath = run ? String(run.f.image||"").trim() : "";
  // Ce qui est IGNORÉ, dit clairement — plutôt qu'un bloc posé qui ne produit rien.
  if(!agentB){
    const besoin = {tool:"Outil Python", workspace:"Écriture bornée", sandbox:"Bac à sable", dynamic:"Outils dynamiques",
      synthese:"Synthèse par l'exemple", mcp:"Serveur MCP", memory:"Mémoire", subagent:"Sous-agent", hook:"Vérification",
      checkpoint:"Checkpoint / reprise", delegation:"Délégation parallèle", policy:"Politique d'outils",
      record:"Enregistrer / rejouer", fiabilite:"Fiabilité", run:"Lancer"};
    for(const [ty, nom] of Object.entries(besoin)) if(by(ty).length) note("warn", `« ${nom} » est ignoré : il lui faut un bloc Agent.`);
    if(boundsB && !chaineB && !parB) note("warn", "« Bornes » est ignoré : il lui faut un bloc Agent, une Chaîne ou un Parallèle.");
  }else{
    if(run && cascB) note("info", "« Lancer » n'est pas utilisé : la Cascade porte sa propre tâche.");
    else if(run && synthB) note("info", "« Lancer » n'est pas utilisé : la Synthèse produit un outil, elle ne lance pas l'agent.");
    else if(run && fiabB) note("info", `« Fiabilité » remplace « Lancer » : la consigne est jouée ${num(fiabB.f.k,5)} fois.`);
    if(hasPipeline && subs.length) note("info", "Sous-agents non branchés en outils : la Chaîne / le Parallèle pilote l'ordre.");
    if(ckpt && run && run.f.stream) note("info", "En streaming, la reprise depuis le snapshot n'est pas émise (le snapshot est bien sauvé).");
    for(const r of regles) if(r.err) note("warn", `Politique : condition JSON invalide, ignorée → ${r.err}`);
    if(polApprove || trifApprove) note("ok", "ApprovalRequired est géré : la boucle s'arrête AVANT l'effet de bord et demande à l'humain.");
    if(tools.some(x=>x.f.egress||x.f.untrusted)) note("ok", "audit_trifecta() au démarrage : lint des outils egress / untrusted.");
    if(replay && (dyn || mcps.length)) note("info", "En replay, aucun outil ne tourne : MCP / outils dynamiques ne servent qu'à l'enregistrement.");
    if(recB && codeMode==="integration") note("info", "Enregistrement : pense à fermer la session (session.close()) côté app.");
    // Les subtilités de la lib, dites AU MOMENT où l'assemblage les rencontre.
    const aUntrusted = tools.some(x=>x.f.untrusted), aEgress = tools.some(x=>x.f.egress);
    if(subs.length && tools.length && !sharedTools.length && !hasPipeline)
      note("info", "as_tool ne partage PAS les outils du parent : coche « donner aussi aux sous-agents » sur l'outil qu'un spécialiste doit utiliser.");
    if(aUntrusted && !aEgress && !mcps.length)
      note("info", "Un outil non fiable teinte le run, mais aucun outil n'est marqué egress : la garde trifecta n'a rien à bloquer.");
    if(aEgress && !aUntrusted && !mcps.length)
      note("info", "Un outil egress sans aucune source non fiable : la teinte ne s'active jamais, l'envoi passe toujours. Marque untrusted=True ce qui lit du contenu externe.");
    if(aEgress && aUntrusted && !polB && !trifApprove)
      note("info", "Trifecta : une sortie LÉGITIME est aussi bloquée dès que le run est teinté. Choisis trifecta_guard=approve si le métier exige l'envoi.");
    if(a.parallel) note("info", "parallel_tool_calls : les handlers d'outils doivent être thread-safe (l'ordre du transcript reste déterministe).");
    if(delegB) note("info", "delegate_to : parallèle ≠ asynchrone — l'appel rend la main quand TOUS les spécialistes ont fini ; token_budget reste exact.");
    if(ckpt && mem) note("info", "À la reprise depuis un snapshot, la compaction mémoire est SAUTÉE (le snapshot est pris mi-run).");
    const prune = (boundsB ? boundsB.f.prune : a.prune);
    if(prune!=="" && prune!=null && a.prov==="gemini")
      note("info", "Élaguer casse le préfixe du cache. Sur Gemini le cache implicite est opportuniste (mesuré) ; il est déterministe sur DeepSeek.");
    if(cascB) note("info", "Cascade : les paliers ratés se paient. Rentable seulement si le petit modèle convainc assez souvent (la démo 33 calcule le seuil).");
    if(run && run.f.stream && tools.length && !tools.some(x=>x.f.idempotent))
      note("info", "En streaming, marque idempotent=True les outils de lecture / calcul : ils partiront pendant que le modèle parle.");
    if(run && run.f.stream && tools.some(x=>x.f.idempotent))
      note("info", "idempotent + streaming : l'outil part dès son chunk. Sur le fil OpenAI, le dernier appel d'un tour attend la fin du flux.");
    if(synthB) note("info", "Synthèse : la part cachée n'est jamais envoyée au modèle, même quand elle échoue — sinon il code les exemples un par un.");
    if(mem && mem.f.kind==="FactMemory" && !(mem.f.amorce||"").trim())
      note("info", "FactMemory sans échange antérieur : rien à retrouver au premier run. L'amorce, c'est l'historique que l'hôte possède déjà.");
    if(hook && num(hook.f.maxcorr,1) > 3) note("info", "max_corrections_per_run élevé : chaque correction est un tour LLM payé.");
    if(repriseBorne) note("ok", "Reprise sur borne : max_steps / token_budget doublés UNE fois, le run reprend du snapshot. La limite reste du code.");
    if(evoB && !String(evoB.f.validation||"").trim()) note("info", "Évolution sans commande de validation : l'agent ne peut pas vérifier ses changements avant de conclure.");
    if(evoB && evoB.f.custom_cmd) note("warn", "Le modèle peut choisir la commande de validation : c'est une exécution arbitraire. À réserver à un bac à sable.");
    if(manifest) note("ok", "Promotion par manifest : un outil généré ne tourne en natif que si son sha256 est approuvé ; sinon bac à sable.");
  }
  if(boundsB) names.add("Bounds");
  if(polB) names.add("ToolPolicySpec");
  if(recB){ names.add(replay ? "ReplaySession" : "RecordSession"); if(!replay){ names.add("create_provider"); names.add("ModelConfig"); } }
  if(agentB && tr && tr.f.resume) names.add("summarize_trace");
  if(agentB && imagePath){ names.add("ImageAttachment"); names.add("Message"); }
  if(agentB && timeoutS) names.add("AgentCancelled");
  if(polApprove || trifApprove) names.add("ApprovalRequired");
  if(evoB){ names.add("EvolutionRuntime"); names.add("enable_software_evolution"); }
  if(repriseBorne){ names.add("MaxStepsExceeded"); if((boundsB ? boundsB.f.budget : a.budget) !== "" && (boundsB ? boundsB.f.budget : a.budget) != null) names.add("TokenBudgetExceeded"); }
  if(delegB){ names.add("delegate_to"); names.add("Agent"); }
  if(cascB){ names.add("cascade"); names.add("Agent"); }
  if(synthB){ names.add("Example"); names.add("synthesize_tool"); names.add("DynamicToolBuilder"); names.add("create_provider"); names.add("ModelConfig"); }
  const emitCascade = () => {
    const c = cascB.f;
    L.push(`# Cascade PAR RÉSULTAT : le palier bon marché d'abord ; le fort seulement si le JUGE`);
    L.push(`# — du code, pas l'avis du modèle — refuse. Les paliers ratés se paient : la facture`);
    L.push(`# ci-dessous est celle de tout ce qui a été essayé.`);
    L.push(`def juge(res) -> bool:`);
    L.push(indentBody(c.juge || "return bool(res.output.strip())", "    "));
    L.push(``);
    L.push(`def _palier(modele: str):`);
    L.push(`    return lambda: Agent.from_model(${pyStr(c.prov)}, modele, system_prompt=${pyStr(c.system||"")}, max_steps=2)`);
    L.push(``);
    L.push(`resultat = cascade([_palier(${pyStr(c.lite)}), _palier(${pyStr(c.pro)})], ${pyLines(c.prompt, 0)}, check=juge)`);
    L.push(`print(resultat.summary())   # palier qui a convaincu, escalades, jetons de TOUS les paliers`);
    L.push(`print(resultat.result.output)`);
  };
  if(mem){
    if(mem.f.kind==="BufferMemory") names.add("BufferMemory");
    else if(mem.f.kind==="FactMemory"){ names.add("FactMemory"); names.add("create_provider"); names.add("ModelConfig"); }
    else { names.add("SummarizingMemory"); names.add("create_provider"); names.add("ModelConfig"); }
  }
  if(hook) names.add("Message");
  // L'amorce est une liste de Message posée par l'hôte avant la question.
  const amorce = mem ? (mem.f.amorce||"").trim() : "";
  if(amorce) names.add("Message");
  if(dyn){ names.add("DynamicToolBuilder"); names.add("create_provider"); names.add("ModelConfig"); }
  if(adv) names.add("ModelConfig");
  if(routing){ names.add("RoutingProvider"); names.add("create_provider"); names.add("ModelConfig"); }
  if(orchB){ names.add("Orchestrator"); names.add("Step"); names.add("create_provider"); names.add("ModelConfig"); }

  const L = [];
  const env = ENV[(agentB?a.prov:(orchB?orchB.f.prov:(chaineB?chaineB.f.prov:(parB?parB.f.prov:(cascSeul?cascSeul.f.prov:"gemini")))))] || "GEMINI_API_KEY";
  // Mode « fonction à intégrer » : seulement pour un programme AGENT (les flux
  // Orchestrator/Chaîne/Parallèle restent des scripts par nature).
  const integ = codeMode==="integration" && agentB && !orchB && !chaineB && !parB;
  L.push(`"""Généré avec le Constructeur autoagent — pour autoagent ${LIB_VERSION}.`);
  L.push(``);
  if(integ){
    L.push(`Fonction à intégrer : importe build_agent() dans ton app.`);
    L.push(`    from mon_agent import build_agent`);
    L.push(`    agent = build_agent()`);
    L.push(`    print(agent.run("…").output)`);
  }else{
    if(replay) L.push(`Lancer :  python ce_fichier.py   (replay hors-ligne : aucune clé, aucun réseau)`);
    else L.push(`Lancer :  ${env}=...  python ce_fichier.py`);
    L.push(`(place ce fichier là où le paquet « autoagent » est importable.)`);
  }
  L.push(`"""`);
  L.push(``);
  const std = new Set();                                 // imports stdlib, triés
  if(agentB && ckpt){ std.add("json"); std.add("pathlib"); }
  if(agentB && imagePath && !integ){ std.add("base64"); std.add("mimetypes"); std.add("pathlib"); }
  if(agentB && timeoutS && !integ) std.add("threading");
  if(std.size){ for(const m of [...std].sort()) L.push(`import ${m}`); L.push(``); }
  L.push(`from autoagent import ${[...names].join(", ")}`);
  if(sb){
    const cls = sb.f.kind==="SubprocessSandbox" ? "SubprocessSandbox"
              : sb.f.kind==="DockerSandbox" ? "DockerSandbox" : "make_sandbox";
    L.push(`from autoagent.sandbox import ${cls}`);
  }
  if(agentB && fiabB && !integ) L.push(`from autoagent.eval import run_k`);
  if(manifest) L.push(`from autoagent.approval import ToolManifest, load_tools`);
  if(parB) L.push(`from concurrent.futures import ThreadPoolExecutor`);
  L.push(``);

  // — trace : ressource PARTAGÉE (agent, sous-agents, chaîne, parallèle) —
  if(hasTrace){
    L.push(`# Observabilité : tout l'arbre d'agents dans une seule trace.`);
    if(otelB){
      L.push(`# Export OpenTelemetry : configure ton TracerProvider (SDK) côté hôte ;`);
      L.push(`# sans provider configuré, l'exporteur est un no-op inoffensif.`);
      const sc = otelB.f.semconv==="gen_ai" ? `, semconv="gen_ai"` : ``;
      if(sc){ L.push(`# semconv="gen_ai" : spans invoke_agent / chat / execute_tool + gen_ai.usage.* — Langfuse, Phoenix, Grafana`); L.push(`# reconnaissent le modèle et le coût. Additif : les événements autoagent.* restent.`); }
      L.push(`exporteur = OTelTraceExporter(tracer_name=${pyStr((otelB.f.tracer||"autoagent").trim()||"autoagent")}${sc})`);
    }
    const targs = [];
    if(tr) targs.push(`file=${pyStr(tr.f.file||"trace.jsonl")}`);
    if(otelB) targs.push(`on_event=exporteur`);
    L.push(`trace = TraceEmitter(${targs.join(", ")})`);
    L.push(``);
  }

  if(boundsB && (agentB || chaineB || parB)){
    const b = boundsB.f, bv = (b.var||"BORNES").trim(), bk = [];
    bk.push(`max_steps=${num(b.steps,8)}`);
    if(b.budget!=="" && b.budget!=null) bk.push(`token_budget=${num(b.budget,0)}`);
    if(b.cap_res!=="" && b.cap_res!=null) bk.push(`max_tool_result_chars=${num(b.cap_res,0)}`);
    if(b.prune!=="" && b.prune!=null) bk.push(`prune_tool_results_after=${num(b.prune,0)}`);
    if(b.prune_batch!=="" && b.prune_batch!=null && num(b.prune_batch,1)>1) bk.push(`prune_batch=${num(b.prune_batch,1)}`);
    if(b.cap_rep!=="" && b.cap_rep!=null) bk.push(`max_repeated_tool_calls=${num(b.cap_rep,0)}`);
    if(b.trifecta && b.trifecta!=="deny") bk.push(`trifecta_guard=${pyStr(b.trifecta)}`);
    if(b.shadow) bk.push(`shadow_guards=True`);
    L.push(`# Les huit bornes en UN objet : lisible d'un coup, partageable, sérialisable (agent.bounds.to_dict()).`);
    const ligne = `${bv} = Bounds(${bk.join(", ")})`;
    if(ligne.length <= 92) L.push(ligne);
    else { L.push(`${bv} = Bounds(`); for(const k of bk) L.push(`    ${k},`); L.push(`)`); }
    L.push(``);
  }

  /* ═══ Programme AGENT ═══ */
  if(agentB){
    // workspace(s)
    for(const w of wss){
      L.push(`# Écritures bornées : ${w.f.root} + extensions ${w.f.exts} seulement.`);
      const wk = [pyStr(w.f.root||"_out"), `allowed_write_extensions=${setExt(w.f.exts)}`];
      if(w.f.max_read!=="" && w.f.max_read!=null) wk.push(`max_read_chars=${num(w.f.max_read,0)}`);
      if(w.f.max_write!=="" && w.f.max_write!=null) wk.push(`max_write_chars=${num(w.f.max_write,0)}`);
      const ign = String(w.f.ignored||"").split(",").map(s=>s.trim()).filter(Boolean);
      if(ign.length) wk.push(`ignored_dirs={${ign.map(pyStr).join(", ")}}`);
      L.push(`${(w.f.var||"espace").trim()} = ProjectWorkspace(${wk.join(", ")})`);
      L.push(``);
    }
    // bac à sable
    let sbVar = null;
    if(sb){
      sbVar = (sb.f.var||"bac").trim();
      const to = num(sb.f.timeout,10);
      L.push(`# Bac à sable : exécute le code non fiable isolé du système.`);
      if(sb.f.kind==="SubprocessSandbox")      L.push(`${sbVar} = SubprocessSandbox(timeout=${to})`);
      else if(sb.f.kind==="DockerSandbox")     L.push(`${sbVar} = DockerSandbox(image=${pyStr(sb.f.image||"python:3.11-slim")}, timeout=${to})`);
      else L.push(`${sbVar} = make_sandbox(prefer_docker=${sb.f.prefer?"True":"False"}, timeout=${to}, image=${pyStr(sb.f.image||"python:3.11-slim")})`);
      L.push(``);
    }
    // mémoire
    let memVar = null;
    if(mem){
      memVar = "memoire";
      if(mem.f.kind==="BufferMemory"){
        L.push(`memoire = BufferMemory(max_messages=${num(mem.f.maxm,20)})`);
      }else if(mem.f.kind==="FactMemory"){
        L.push(`# Mémoire FACTUELLE : faits atomiques tenus À JOUR (add/update/delete) —`);
        L.push(`# une contradiction REMPLACE le fait périmé. JSON lisible par identité.`);
        L.push(`resumeur = create_provider(ModelConfig(${pyStr(a.prov)}, ${pyStr(a.model)}))`);
        {
          const margs = [`path=${pyStr(mem.f.path||"faits_agent.json")}`,
                         `max_messages=${num(mem.f.maxm,40)}`,
                         `keep_recent=${num(mem.f.keep,12)}`];
          if(mem.f.rmode && mem.f.rmode!=="hybrid") margs.push(`recall_mode=${pyStr(mem.f.rmode)}`);
          if(mem.f.background) margs.push(`background=True`);
          if(mem.f.max_facts!=="" && mem.f.max_facts!=null) margs.push(`max_facts=${num(mem.f.max_facts,500)}`);
          if(mem.f.max_ctx!=="" && mem.f.max_ctx!=null) margs.push(`max_context_facts=${num(mem.f.max_ctx,20)}`);
          L.push(`memoire = FactMemory(resumeur, ${margs.join(", ")})`);
        }
      }else{
        L.push(`# La mémoire résume les vieux tours (un LLM, moins cher, s'en charge).`);
        L.push(`resumeur = create_provider(ModelConfig(${pyStr(a.prov)}, ${pyStr(a.model)}))`);
        const sm = num(mem.f.summax,600) !== 600 ? `, summary_max_tokens=${num(mem.f.summax,600)}` : ``;
        L.push(`memoire = SummarizingMemory(resumeur, max_messages=${num(mem.f.maxm,40)}, keep_recent=${num(mem.f.keep,12)}${sm})`);
      }
      L.push(``);
    }
    // constructeur d'outils dynamiques
    if(dyn){
      L.push(`# L'agent pourra GÉNÉRER ses propres outils Python (validés puis exécutés isolés).`);
      L.push(`builder = DynamicToolBuilder(`);
      L.push(`    create_provider(ModelConfig(${pyStr(a.prov)}, ${pyStr(a.model)})),`);
      const barg = [`tools_dir=${pyStr(dyn.f.dir||".autoagent/tools")}`];
      if(sbVar) barg.push(`sandbox=${sbVar}`); else barg.push(`timeout=${num(dyn.f.timeout,10)}`);
      L.push(`    ${barg.join(", ")})`);
      L.push(``);
    }
    // politique d'outils en données (+ décision humaine si une règle « approve » existe)
    if(polB){
      const pv = (polB.f.var||"politique").trim();
      L.push(`# Politique d'outils en DONNÉES (relisible, versionnable) : parmi les règles qui`);
      L.push(`# matchent, deny > approve > allow > défaut. Fail-CLOSED : une faute de frappe`);
      L.push(`# échoue au démarrage, une condition qui plante REFUSE l'appel.`);
      L.push(`_spec = ToolPolicySpec.from_dict({`);
      L.push(`    "default": ${pyStr(polB.f.default||"allow")},`);
      L.push(`    "rules": [`);
      for(const r of regles){
        const parts = [`"tool": ${pyStr(r.tool)}`, `"action": ${pyStr(r.action)}`];
        if(r.when && !r.err) parts.push(`"when": ${pyLit(r.when)}`);
        if(r.reason) parts.push(`"reason": ${pyStr(r.reason)}`);
        const une = `        {${parts.join(", ")}},`;
        if(une.length <= 96) L.push(une);
        else { L.push(`        {`); for(const q of parts) L.push(`            ${q},`); L.push(`        },`); }
      }
      L.push(`    ],`);
      L.push(`})`);
      if(polApprove){
        L.push(`_regles = _spec.compile()`);
        L.push(`_DECISIONS: dict[str, str] = {}      # call_id → "autorise" | "refuse" (l'id survit à la pause)`);
        L.push(``);
        L.push(`def ${pv}(ctx):`);
        L.push(`    """La décision humaine d'abord ; sinon la politique déclarative."""`);
        L.push(`    verdict = _DECISIONS.get(ctx.call.id)`);
        L.push(`    if verdict == "autorise":`);
        L.push(`        return None`);
        L.push(`    if verdict == "refuse":`);
        L.push(`        return "refusé par l'humain — propose une autre voie"`);
        L.push(`    return _regles(ctx)`);
      }else{
        L.push(`${pv} = _spec.compile()`);
      }
      L.push(``);
    }
    // hook
    if(hook){
      L.push(`def ${(hook.f.fname||"verifier").trim()}(ctx):`);
      L.push(`    """Appelé quand le modèle veut conclure : None = valider, Message = corriger."""`);
      L.push(indentBody(hook.f.body, "    "));
      L.push(``);
    }
    // checkpoint : snapshot JSON à chaque frontière d'étape
    if(ckpt){
      L.push(`# Checkpoint : snapshot sauvé à CHAQUE étape complétée → le run survit au processus.`);
      L.push(`_CHECKPOINT = pathlib.Path(${pyStr(ckpt.f.file||"run_state.json")})`);
      L.push(``);
      L.push(`def sauvegarder(state):`);
      L.push(`    _CHECKPOINT.write_text(json.dumps(state.to_dict()), encoding="utf-8")`);
      L.push(``);
    }

    for(const t of sharedTools){

      if(t.f.doc) L.push(`    ${pyTriDoc(t.f.doc)}`);

    }
    // sous-agents (avec les outils partagés attachés — comme dans demo_autoagent.py)
    for(const s of subs){
      const sv = (s.f.var||"specialiste").trim();
      const kw = [`temperature=0.0`];
      if(hasTrace) kw.push(`trace=trace`);
      L.push(`${sv} = Agent.from_model(${pyStr(s.f.prov)}, ${pyStr(s.f.model)},`);
      L.push(`    system_prompt=${pyLines(s.f.system, 4)},`);
      L.push(`    ${kw.join(", ")})`);
      for(const t of sharedTools) L.push(attache(sv, t));
      L.push(``);
    }
    // agent principal
    const kwTail = [];
    kwTail.push(`temperature=${(a.temp===""||a.temp==null)?"0.0":num(a.temp,0)}`);
    kwTail.push(`max_steps=${num(a.steps,8)}`);
    if(a.budget!=="" && a.budget!=null) kwTail.push(`token_budget=${num(a.budget,0)}`);
    if(a.cap_res!=="" && a.cap_res!=null) kwTail.push(`max_tool_result_chars=${num(a.cap_res,0)}`);
    if(a.cap_rep!=="" && a.cap_rep!=null) kwTail.push(`max_repeated_tool_calls=${num(a.cap_rep,0)}`);
    if(a.prune!=="" && a.prune!=null) kwTail.push(`prune_tool_results_after=${num(a.prune,0)}`);
    if(a.prune_batch!=="" && a.prune_batch!=null && num(a.prune_batch,1)>1) kwTail.push(`prune_batch=${num(a.prune_batch,1)}`);

      const bornes = /^(max_steps|token_budget|max_tool_result_chars|prune_tool_results_after|prune_batch|max_repeated_tool_calls|trifecta_guard|shadow_guards)=/;
      let retirees = 0;
      for(let i=kwTail.length-1;i>=0;i--) if(bornes.test(kwTail[i])){ kwTail.splice(i,1); retirees++; }
      if(retirees > 1) note("info", "Bornes : les bornes saisies dans le bloc Agent (hors max_steps) sont remplacées par l'objet Bounds.");
      kwTail.push(`bounds=${(boundsB.f.var||"BORNES").trim()}`);

    if(a.parallel) kwTail.push(`parallel_tool_calls=True`);
    if(dyn) kwTail.push(`max_dynamic_tools_per_run=${num(dyn.f.maxrun,3)}`);

    if(memVar) kwTail.push(`memory=${memVar}`);
    if(hook) kwTail.push(`post_turn_hook=${(hook.f.fname||"verifier").trim()}`);
    if(hook && num(hook.f.maxcorr,1)!==1) kwTail.push(`max_corrections_per_run=${num(hook.f.maxcorr,1)}`);
    if(polB) kwTail.push(`tool_policy=${(polB.f.var||"politique").trim()}`);

    const mc = [`provider=${pyStr(a.prov)}`, `model=${pyStr(a.model)}`];
    if(adv && (a.baseurl||"").trim()) mc.push(`base_url=${pyStr(a.baseurl.trim())}`);

    if(routing){
      L.push(`# Routing : une image dans la requête → modèle vision ; sinon → défaut.`);

      L.push(`_vision = create_provider(ModelConfig(${pyStr(a.prov)}, ${pyStr((a.vmodel||a.model).trim()||a.model)}))`);
      L.push(`provider = RoutingProvider(default=_defaut, vision=_vision)`);
      L.push(``);
    }
    if(recB){
      if(replay){
        L.push(`# REPLAY hors-ligne : zéro réseau, zéro outil exécuté, zéro jeton. Le LLM est apparié`);
        L.push(`# par position, les outils par call_id ; toute divergence lève ReplayMismatch.`);
      }else{
        L.push(`# RECORD : le run réel est figé dans une fixture JSONL (secrets masqués), rejouable`);
        L.push(`# ensuite hors-ligne (mode replay) — un test CI à 0 jeton, déterministe.`);
      }
      L.push(`session = ${replay ? "ReplaySession" : "RecordSession"}(${pyStr(recB.f.file||"fixture_run.jsonl")})`);
      L.push(``);
      if(!replay && !routing){ L.push(`_llm = create_provider(ModelConfig(${mc.join(", ")}))`); }
      const base = routing ? `provider` : `_llm`;
      L.push(replay ? `${av} = Agent(session.provider(), registry=session.registry(),`
                    : `${av} = Agent(session.provider(${base}), registry=session.registry(),`);
    }else if(routing){
      L.push(`${av} = Agent(provider,`);
    }else if(adv){
      L.push(`${av} = Agent.from_model_config(ModelConfig(${mc.join(", ")}),`);
    }else{
      L.push(`${av} = Agent.from_model(${pyStr(a.prov)}, ${pyStr(a.model)},`);
    }
    L.push(`    system_prompt=${pyLines(a.system, 4)},`);
    L.push(`    ${kwTail.join(", ")})`);
    L.push(``);

    if(mem && mem.f.recall){
      L.push(`${av}.register_recall_tool()   # l'agent peut retrouver un détail oublié`);

    }
